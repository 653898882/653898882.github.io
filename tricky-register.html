<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刁钻注册 · 85 关（每关机制都不同）</title>
<!-- 备用密钥（第 76 关会用到）：hunter2 -->
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#1b2233,#0b0e14 60%); color:#e8eaed; min-height:100vh;}
  header{position:sticky; top:0; z-index:99; background:rgba(13,17,24,.94); backdrop-filter:blur(8px);
         border-bottom:1px solid #232a38; padding:12px 16px 10px;}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  h1{font-size:14px; margin:0; letter-spacing:.4px; color:#cdd6e4; font-weight:600; white-space:nowrap;}
  #levelNo{font-size:12px; color:#6f7c90; font-variant-numeric:tabular-nums;}
  .tools{display:flex; gap:6px; flex-wrap:wrap;}
  .tools button{background:#1c2434; color:#aab6c8; border:1px solid #2c3852; border-radius:8px;
          padding:6px 10px; font-size:12px; cursor:pointer;}
  .tools button:hover{background:#232d40; color:#e8eaed;}
  .bar{height:6px; margin-top:9px; background:#212836; border-radius:99px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; border-radius:99px;
         background:linear-gradient(90deg,#4f8cff,#a05cff 60%,#ff5ca8); transition:width .25s ease;}
  #hintBox{display:none; margin-top:9px; padding:9px 12px; border-radius:9px; font-size:13px; line-height:1.6;
           background:#1a2438; border:1px solid #2f4a7a; color:#9dc0ff;}
  #hintBox.show{display:block;}
  main{padding:24px 16px 110px; max-width:760px; margin:0 auto; min-height:60vh;}
  .desc{color:#9aa6b8; font-size:15px; line-height:1.75; margin:0 0 20px;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .col{display:flex; flex-direction:column; gap:14px; align-items:flex-start;}
  .btn{background:#4f8cff; color:#fff; border:none; padding:12px 24px; border-radius:11px;
       font-size:16px; cursor:pointer; transition:background .15s, transform .05s; user-select:none;}
  .btn:hover{background:#6ba0ff;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#222a3a; color:#cdd6e4; border:1px solid #303a4d;}
  .btn.ghost:hover{background:#2b3548;}
  .btn.on{background:#5cd08a;}
  .note{color:#8b98ab; font-size:13.5px; line-height:1.6;}
  .warn{color:#ffb454;} .ok{color:#5cd08a;} .err{color:#ff6b6b;}
  input[type=text],input[type=password],input[type=number],select,textarea{
       padding:11px 13px; border-radius:9px; border:1px solid #2a3346; background:#141b28;
       color:#e8eaed; font-size:16px; outline:none; min-width:220px;}
  input:focus,select:focus{border-color:#4f8cff;}
  input[readonly]{opacity:.6;}
  .box{border:2px dashed #33405a; border-radius:14px; padding:18px; background:#101725;}
  .zone{width:150px; height:110px; border:2px dashed #4f8cff; border-radius:12px;
        display:flex; align-items:center; justify-content:center; color:#4f8cff; font-size:12px;}
  .chip{width:74px; height:40px; border-radius:9px; background:#4f8cff; color:#fff;
        display:flex; align-items:center; justify-content:center; cursor:grab; user-select:none; font-size:14px;}
  .card{width:74px; height:74px; border-radius:12px; background:#1b2436; border:1px solid #2c3852;
        display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; user-select:none;}
  .sw{width:66px; height:34px; border-radius:99px; background:#2a3346; position:relative; display:inline-block; cursor:pointer; transition:background .2s;}
  .sw.on{background:#4f8cff;}
  .sw>i{position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; transition:left .2s; cursor:grab;}
  .sw.on>i{left:35px;}
  .grid{display:grid; gap:8px;}
  footer{padding:22px 16px 60px; max-width:760px; margin:0 auto; color:#586274; font-size:12px; line-height:1.8;}
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
         background:#1c2434; border:1px solid #2c3852; color:#e8eaed; padding:10px 16px; border-radius:11px;
         font-size:13.5px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:600; max-width:86vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  #winOverlay{position:fixed; inset:0; z-index:700; background:rgba(5,8,14,.86);
              display:flex; align-items:center; justify-content:center; padding:24px;}
  #winBox{background:#161d2b; border:1px solid #2c3852; border-radius:18px; padding:28px; max-width:440px; text-align:center;}
  #winBox h2{margin:0 0 14px; font-size:22px;}
  #winBox p{color:#9aa6b8; font-size:14px; line-height:1.75; margin:6px 0;}
  #winBox button{background:#4f8cff; color:#fff; border:none; border-radius:10px; padding:11px 22px;
                 font-size:14px; cursor:pointer; margin-top:16px;}
</style>

<body>
<header>
  <div class="top">
    <h1>刁钻注册 · 85 关（机制各不相同）</h1>
    <span id="levelNo">第 1 关 / 共 85 关</span>
  </div>
  <div class="tools">
    <button id="tHint">💡 提示</button>
    <button id="tRetry">↻ 重来本关</button>
    <button id="tSkip">🏳 认输跳过</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div id="hintBox"></div>
</header>

<main id="stage"></main>

<footer>
  85 关，<b>每关的机制都不一样</b>，且都有解。<br>
  解法藏得比较深，过不去可以用「💡 提示」或「🏳 认输跳过」。<br>
  通关时会统计你真正手解了多少关。
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============================ 框架 ============================ */
const $ = s => document.querySelector(s);
const T = $('#toast');
let toastTimer = null;
function toast(msg, ms=1900){
  T.textContent = msg; T.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>T.classList.remove('show'), ms);
}
function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const B = (t, fn, cls='btn') => h('button', {class: cls, onclick: fn || (()=>{})}, t);
const P = (t, cls='note') => h('p', {class: cls, html: t});
const Row = (...k) => h('div', {class:'row'}, k);
const Col = (...k) => h('div', {class:'col'}, k);
const mkInput = (o={}) => h('input', Object.assign({type:'text'}, o));

let disposers = [];
function on(t, ev, fn, o){ t.addEventListener(ev, fn, o); disposers.push(()=>t.removeEventListener(ev, fn, o)); }
function every(ms, fn){ const id = setInterval(fn, ms); disposers.push(()=>clearInterval(id)); return id; }
function after(ms, fn){ const id = setTimeout(fn, ms); disposers.push(()=>clearTimeout(id)); return id; }
function clearAll(){ for (const d of disposers){ try{ d(); }catch(e){} } disposers = []; }
function makeFlee(btn, speed=170){
  btn.style.position = 'relative'; btn.style.transition = 'transform .1s';
  on(window, 'mousemove', e=>{
    const q = btn.getBoundingClientRect();
    const cx = q.left+q.width/2, cy = q.top+q.height/2;
    if (Math.hypot(e.clientX-cx, e.clientY-cy) < 150){
      const a = Math.atan2(cy-e.clientY, cx-e.clientX) + (Math.random()-0.5);
      btn.style.transform = "translate(" + (Math.cos(a)*speed) + "px," + (Math.sin(a)*speed) + "px)";
    }
  });
}
function overlap(a, b){
  const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
  return !(x.right < y.left || x.left > y.right || x.bottom < y.top || x.top > y.bottom);
}

/* ============================ 85 关（机制各不相同） ============================ */
const LEVELS = [

/* 01 键盘激活逃跑按钮 */
{ desc:'点击「继续」完成验证。（它有点怕你的鼠标）',
  hint:'鼠标碰不到它，改用键盘：按 Tab 选中它，再按 Enter。手机上直接点即可。',
  build(r,next){ const b = B('继续', next); makeFlee(b); r.append(Row(b)); }},

/* 02 悬停接近→触底反弹 */
{ desc:'按钮每被鼠标靠近一次缩小 12%；但缩到一半以下时会反过来变大。',
  hint:'一直靠近它，等它开始变大（超过一半），趁它变大时点下去。',
  build(r,next){
    let s = 1, grow = false;
    const b = B('继续', next); b.style.transition = 'transform .15s';
    r.append(Row(b));
    on(document,'mousemove', e=>{
      const q = b.getBoundingClientRect();
      if (Math.hypot(e.clientX-(q.left+q.width/2), e.clientY-(q.top+q.height/2)) < 130){
        if (!grow){ s *= 0.88; if (s <= 0.5) grow = true; } else { s = Math.min(1, s*1.25); }
        b.style.transform = "scale(" + s + ")";
      }
    });
  }},

/* 03 藏在正文里的行内按钮 */
{ desc:'阅读下面这段话，然后继续。',
  hint:'这段话里藏着一个可以点的词——点那个蓝色的词。',
  build(r,next){
    const b = h('span',{style:'color:#4f8cff;text-decoration:underline;cursor:pointer;'},'继续');
    on(b,'click', next);
    r.append(h('p',{style:'font-size:16px;line-height:2.2;color:#9aa6b8;'},
      '至此，你已通过前两步校验。请', b, '阅读并同意本页面剩余的全部条款，随后系统将为你创建账户。'
    ));
  }},

/* 04 按词序点击（洗牌但看词） */
{ desc:'按顺序依次点击：我 → 是 → 人 → 类。',
  hint:'点击后词语会重新洗牌，但判定看的是「词」不是「位置」——照着顺序点。',
  build(r,next){
    const words = ['我','是','人','类'], need = ['我','是','人','类'];
    let step = 0; const wrap = Row();
    const draw = ()=>{ wrap.innerHTML=''; words.slice().sort(()=>Math.random()-0.5).forEach(w=>{
      wrap.append(B(w, ()=>{ if (w===need[step]){ step++; if(step===4){ next(); return; } } else { step=0; toast('顺序错了。'); } draw(); }, 'btn ghost'));
    });};
    draw(); r.append(wrap);
  }},

/* 05 勾选后限时点击 */
{ desc:'勾选「我同意」，但它 1.5 秒后会自动取消。',
  hint:'勾选后会立刻冒出「继续」按钮——1.5 秒内点它就赢了。',
  build(r,next){
    const cb = h('input',{type:'checkbox', style:'width:22px;height:22px;min-width:0;'});
    const nb = B('继续', next); nb.style.display='none';
    r.append(Row(cb,'我同意'), Row(nb));
    on(cb,'change',()=>{ if (cb.checked){ nb.style.display='inline-block'; after(1500, ()=>{ cb.checked=false; nb.style.display='none'; }); } });
  }},

/* 06 输入被倒序 */
{ desc:'输入框会把内容倒过来显示。请让框里最终显示「通过」。',
  hint:'倒着打：输入「过通」，它会自己翻成「通过」。',
  build(r,next){
    const inp = mkInput({placeholder:'在这里输入…'}); const st = P('');
    on(inp,'input',()=>{ const p = inp.value.length; inp.value = inp.value.split('').reverse().join(''); inp.setSelectionRange(p,p);
      if (inp.value === '通过'){ st.className='note ok'; st.textContent='✓ 通过'; next(); } });
    r.append(Col(inp, st));
  }},

/* 07 逐字输入被拦→改用粘贴 */
{ desc:'在输入框里输入「通过」。',
  hint:'逐字输入会被拦截，但「粘贴」不会——先复制这个词再贴进去。',
  build(r,next){
    const inp = mkInput({placeholder:'试试输入…'}); const st = P('');
    on(inp,'beforeinput', e=>{ if (e.inputType === 'insertText'){ e.preventDefault(); st.className='note warn'; st.textContent='逐字输入被拦截。'; } });
    on(inp,'input', ()=>{ if (inp.value.includes('通过')){ st.className='note ok'; st.textContent='✓'; next(); } });
    r.append(Col(inp, st));
  }},

/* 08 滑块：鼠标弹回，键盘可行 */
{ desc:'把滑块拖到最右边，但它一松手就弹回 0。',
  hint:'别用鼠标拖。用 Tab 选中滑块，然后按「→」键。',
  build(r,next){
    const s = h('input',{type:'range',min:0,max:100,value:0,style:'width:320px;min-width:0;'});
    on(s,'pointerup', ()=>{ s.value = 0; toast('弹回 0 了。'); });
    on(s,'input', ()=>{ if (+s.value >= 100) next(); });
    r.append(Col(s, P('（键盘也行）')));
  }},

/* 09 什么都不做，等 5 秒 */
{ desc:'⚠ 请「不要」点击下方按钮。',
  hint:'答案就在题面里：什么都别做，安静等 5 秒。',
  build(r,next){
    let t = 0; const st = P('保持不动… 0 / 5 秒');
    const b = B('（别点我）', ()=>{ t = 0; st.textContent='保持不动… 0 / 5 秒'; toast('你不听话。'); });
    r.append(Row(b), st);
    every(1000, ()=>{ t++; st.textContent = "保持不动… " + t + " / 5 秒"; if (t >= 5) next(); });
  }},

/* 10 往下滚找真按钮 */
{ desc:'点击按钮进入下一步。',
  hint:'那个按钮是假的。把页面往下滚，底部藏着真正的「继续」。',
  build(r,next){
    let n = 0;
    const fake = B('继续', ()=>{ n++; fake.textContent = "再点一次（" + n + "）"; });
    r.append(Col(Row(fake), h('div',{style:'height:900px;'}), Row(B('✅ 继续（真的这个）', next))));
  }},

/* 11 按住恰好 3 秒 */
{ desc:'按住按钮「满 3 秒」再松手（允许 3.00–3.20 秒）。',
  hint:'盯着计时器，到 3.0 秒立刻松手。',
  build(r,next){
    const st = P('（按下开始计时）'); const b = B('按住我', ()=>{});
    let t0 = 0, down = false;
    on(b,'pointerdown', ()=>{ t0 = performance.now(); down = true; st.className='note warn'; st.textContent='计时中…'; });
    every(50, ()=>{ if (down) st.textContent = '计时中… ' + ((performance.now()-t0)/1000).toFixed(2) + ' 秒'; });
    on(window,'pointerup', ()=>{ if (!down) return; down = false; const d = performance.now()-t0;
      if (d >= 3000 && d <= 3200) next(); else { st.className='note err'; st.textContent = '用了 ' + (d/1000).toFixed(2) + ' 秒 → 失败。'; } });
    r.append(Col(Row(b), st));
  }},

/* 12 按住 4 秒且按钮抖动 */
{ desc:'按住按钮 4 秒，期间不能松手。',
  hint:'按住不放就行——它会轻微抖动，把手指/鼠标稳在按钮上。',
  build(r,next){
    let t = 0, down = false; const st = P('按住开始…'); const b = B('按住不放', ()=>{});
    on(b,'pointerdown', ()=>{ down = true; t = 0; st.className='note warn'; });
    every(100, ()=>{ if (down){ t += 0.1; st.textContent = '已坚持 ' + t.toFixed(1) + ' / 4.0 秒';
      const j = (Math.random()-0.5)*10; b.style.transform = "translate(" + j + "px," + j + "px)"; if (t >= 4) next(); } });
    on(window,'pointerup', ()=>{ if (down){ down=false; t=0; b.style.transform=''; st.className='note err'; st.textContent='松手了，重来。'; } });
    r.append(Col(Row(b), st));
  }},

/* 13 空格被禁→用回车 */
{ desc:'按下【空格键】继续。',
  hint:'空格被禁用了，但「回车」没有。',
  build(r,next){
    on(window,'keydown', e=>{ if (e.code === 'Space'){ e.preventDefault(); toast('空格：已禁用。'); } else if (e.key === 'Enter') next(); });
    r.append(P('（试试别的键）'));
  }},

/* 14 回车会清空→点提交 */
{ desc:'在输入框输入内容，然后按【回车】提交。',
  hint:'回车会清空输入框。改用鼠标点下面的「提交」按钮。',
  build(r,next){
    const inp = mkInput({placeholder:'输入点什么…'});
    on(inp,'keydown', e=>{ if (e.key === 'Enter'){ inp.value=''; toast('回车：已清空。'); } });
    r.append(Col(inp, B('提交', ()=>{ if (inp.value.trim()) next(); else toast('先输入内容。'); })));
  }},

/* 15 悬停暂停自动重置的进度 */
{ desc:'等进度条加载满。',
  hint:'它到 99% 就会重置。把鼠标停在进度条上，它就不重置了。',
  build(r,next){
    const i = h('i',{style:'display:block;height:100%;width:0;background:#4f8cff;border-radius:99px;'});
    const bar = h('div',{style:'height:12px;width:320px;background:#212836;border-radius:99px;overflow:hidden;cursor:pointer;'}, i);
    const st = P('0%'); let v = 0, paused = false;
    on(bar,'mouseenter', ()=>{ paused = true; }); on(bar,'mouseleave', ()=>{ paused = false; });
    every(90, ()=>{ v += 2; if (!paused && v >= 99) v = 0; if (v >= 100){ next(); return; }
      i.style.width = v + '%'; st.textContent = Math.floor(v) + '%' + (paused ? '（已暂停重置）' : ''); });
    r.append(Col(bar, st));
  }},

/* 16 点负数倒计时翻正 */
{ desc:'等倒计时结束即可。',
  hint:'倒计时是负的。点一下那个数字，它会翻成正数并跑完。',
  build(r,next){
    const st = h('div',{style:'font-size:52px;font-weight:700;color:#4f8cff;cursor:pointer;font-variant-numeric:tabular-nums;'}, '-1');
    let n = -1, speed = 1;
    on(st,'click', ()=>{ if (n < 0){ n = 3; st.style.color = '#5cd08a'; } });
    every(1000, ()=>{ n -= speed; st.textContent = n.toFixed(0); if (n <= 0) next(); });
    r.append(Col(st, P('倒计时：')));
  }},

/* 17 与背景同色的隐形按钮 */
{ desc:'点击「继续」按钮。',
  hint:'它和背景同色所以看不见。把鼠标在按钮区域附近移动，光标会变成手型。',
  build(r,next){
    const real = B('继续', next);
    real.style.background = '#0f1420'; real.style.color = '#0f1420'; real.style.border = '1px solid #0f1420';
    r.append(Row(real), P('（提示：它就在这儿，只是看不见）'));
  }},

/* 18 键盘可绕过互斥的复选框 */
{ desc:'同时勾选 A 和 B。',
  hint:'鼠标勾一个会取消另一个；用键盘就不会——Tab 到 A 按空格，再 Tab 到 B 按空格。',
  build(r,next){
    const a = h('input',{type:'checkbox', style:'width:22px;height:22px;min-width:0;'});
    const b = h('input',{type:'checkbox', style:'width:22px;height:22px;min-width:0;'});
    const chk = ()=>{ if (a.checked && b.checked) next(); };
    on(a,'click', e=>{ if (e.detail > 0 && a.checked){ b.checked = false; toast('B 被取消了（鼠标）。'); } chk(); });
    on(b,'click', e=>{ if (e.detail > 0 && b.checked){ a.checked = false; toast('A 被取消了（鼠标）。'); } chk(); });
    r.append(Row(a,'A 选项'), Row(b,'B 选项'));
  }},

/* 19 方向键移动方块 */
{ desc:'把方块移进虚线框内。',
  hint:'鼠标拖时目标会躲；用键盘：Tab 选中方块，用方向键把它挪进框里。',
  build(r,next){
    const box = h('div',{class:'box', style:'height:300px; position:relative;'});
    const zone = h('div',{class:'zone', style:'position:absolute; right:24px; top:30px;'}, '目标');
    const chip = h('div',{class:'chip', tabindex:'0', style:'position:absolute; left:24px; top:200px; outline:none;'}, '拖我');
    box.append(zone, chip); r.append(box);
    const done = ()=>{ if (overlap(chip, zone)) next(); };
    on(chip,'keydown', e=>{
      const x = parseInt(chip.style.left), y = parseInt(chip.style.top);
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
        e.preventDefault();
        chip.style.left = (x + (e.key==='ArrowLeft'?-12:e.key==='ArrowRight'?12:0)) + 'px';
        chip.style.top  = (y + (e.key==='ArrowUp'?-12:e.key==='ArrowDown'?12:0)) + 'px';
        done();
      }
    });
    let drag=false, ox=0, oy=0;
    on(chip,'pointerdown', e=>{ drag=true; const q=chip.getBoundingClientRect(); ox=e.clientX-q.left; oy=e.clientY-q.top; });
    on(document,'pointermove', e=>{ if (!drag) return; const bq = box.getBoundingClientRect();
      chip.style.left = (e.clientX-bq.left-ox)+'px'; chip.style.top = (e.clientY-bq.top-oy)+'px';
      const zq = zone.getBoundingClientRect(), cq = chip.getBoundingClientRect();
      const dx = (zq.left+zq.width/2)-(cq.left+cq.width/2), dy = (zq.top+zq.height/2)-(cq.top+cq.height/2);
      if (Math.hypot(dx,dy) < 160){ zone.style.left = (zq.left-bq.left-dx*0.6)+'px'; zone.style.top = (zq.top-bq.top-dy*0.6)+'px'; zone.style.right='auto'; } });
    on(document,'pointerup', ()=>{ drag=false; done(); });
  }},

/* 22 拖拽转盘转满一圈 */
{ desc:'转动这个旋钮：绕着圈拖满一整圈（360°）。',
  hint:'按住蓝色圆点，绕着虚线圆环拖一整圈，中途不要反向。',
  build(r,next){
    const R = 70, cx = 110, cy = 110;
    const wrap = h('div',{style:'position:relative;width:220px;height:220px;'});
    const ring = h('div',{style:'position:absolute;left:'+(cx-R)+'px;top:'+(cy-R)+'px;width:'+(2*R)+'px;height:'+(2*R)+'px;border:3px dashed #33405a;border-radius:50%;'});
    const knob = h('div',{style:'position:absolute;left:'+(cx-14)+'px;top:'+(cy-R-14)+'px;width:28px;height:28px;border-radius:50%;background:#4f8cff;cursor:grab;'});
    wrap.append(ring, knob);
    let drag=false, last=null, total=0, dir=0;
    const ang = (e)=>{ const q = wrap.getBoundingClientRect(); return Math.atan2(e.clientY-(q.top+cy), e.clientX-(q.left+cx)); };
    on(knob,'pointerdown', e=>{ drag=true; last=ang(e); total=0; dir=0; try{knob.setPointerCapture(e.pointerId);}catch(_){} });
    on(knob,'pointermove', e=>{
      if (!drag) return;
      const a = ang(e); let d = a-last;
      while (d > Math.PI) d -= 2*Math.PI;
      while (d < -Math.PI) d += 2*Math.PI;
      if (dir === 0 || Math.sign(d) === dir) total += Math.abs(d); else total = 0;
      if (d !== 0) dir = Math.sign(d);
      last = a;
      knob.style.left = (cx + Math.cos(a)*R - 14) + 'px';
      knob.style.top  = (cy + Math.sin(a)*R - 14) + 'px';
      if (total*180/Math.PI >= 350) next();
    });
    on(knob,'pointerup', ()=>{ drag=false; });
    r.append(wrap);
  }},

/* 49 迷宫：走出下边界 */
{ desc:'用方向键操控小人走出迷宫。',
  hint:'出口在网格的下边界之外——走到最下面一排，再继续按「↓」。',
  build(r,next){
    const W = 7, H = 6;
    const maze = [
      '#######',
      '#.....#',
      '#.###.#',
      '#.#...#',
      '#...#.#',
      '#.....#'
    ];
    const grid = h('div',{class:'grid', style:'grid-template-columns:repeat('+W+',34px);width:max-content;'});
    let px = 1, py = 1; const cells = [];
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const ch = maze[y][x];
      const c = h('div',{style:'width:34px;height:34px;border:1px solid #1a2230;display:flex;align-items:center;justify-content:center;background:'+(ch==='#'?'#232a38':'#0f1420')+';'});
      cells.push({c,x,y,wall:ch==='#'}); grid.append(c);
    }
    const draw = ()=>{ cells.forEach(o=>{ if (!o.wall) o.c.textContent = (o.x===px && o.y===py) ? '🧍' : ''; }); };
    draw();
    on(window,'keydown', e=>{
      const dx = e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
      const dy = e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;
      if (!dx && !dy) return;
      e.preventDefault();
      const nx = px+dx, ny = py+dy;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H){ if (ny === H) next(); return; }
      const t = cells.find(o=>o.x===nx && o.y===ny);
      if (t && !t.wall){ px=nx; py=ny; draw(); }
    });
    r.append(Col(grid, P('（走到最下面一排，再按「↓」走出边界）')));
  }},

/* 73 先冻结联动再设状态 */
{ desc:'同时满足：A 关闭、B 打开、C 关闭。',
  hint:'直接调会互相牵连。先打开「🔒 冻结联动」，再随便调。',
  build(r,next){
    let a=true, b=false, c=true, frozen=false;
    const wrap = Col();
    const render = ()=>{
      wrap.innerHTML = '';
      const mk = (label, get, set)=>{
        const sw = h('div',{class:'sw' + (get()?' on':''), style:'vertical-align:middle;'}, h('i'));
        on(sw,'click', ()=>{ set(!get()); render(); });
        return Row(sw, ' ' + label);
      };
      wrap.append(
        Row(B(frozen ? '🔒 已冻结联动' : '🔓 冻结联动', ()=>{ frozen = !frozen; render(); }, 'btn ghost')),
        mk('A（需关闭）', ()=>a, v=>{ a = v; if (!frozen) b = !b; }),
        mk('B（需打开）', ()=>b, v=>{ b = v; if (!frozen) c = !c; }),
        mk('C（需关闭）', ()=>c, v=>{ c = v; if (!frozen) a = !a; })
      );
      if (!a && b && !c) next();
    };
    render(); r.append(wrap);
  }},

/* 74 判定区在按钮之外 */
{ desc:'点击屏幕中央那颗按钮。',
  hint:'可点击区域不在按钮上。把鼠标向右移，会看到虚线轮廓，点那里。',
  build(r,next){
    const wrap = h('div',{style:'position:relative;height:200px;background:#101725;border-radius:12px;'});
    const vis = h('div',{style:'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#4f8cff;color:#fff;padding:12px 24px;border-radius:11px;'},'继续');
    const hit = h('div',{style:'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateX(200px);width:120px;height:46px;cursor:pointer;border-radius:11px;'});
    on(hit,'mouseenter', ()=>{ hit.style.outline = '2px dashed #5cd08a'; toast('找到判定区了，点它！'); });
    on(hit,'click', next);
    wrap.append(vis, hit); r.append(wrap);
  }},

/* 75 左右交替点击 20 次 */
{ desc:'左右交替点击两个按钮，共 20 次（不能连点同一个）。',
  hint:'左 → 右 → 左 → 右… 交替 20 次。',
  build(r,next){
    let last = null, n = 0;
    const st = P('进度：0 / 20');
    const mk = (id, label)=>B(label, ()=>{ if (last === id){ toast('不能连点同一个。'); return; } last = id; n++; st.textContent = '进度：'+n+' / 20'; if (n >= 20) next(); });
    r.append(Col(Row(mk('L','左'), mk('R','右')), st));
  }},

/* 76 密钥在源码注释里 */
{ desc:'输入解密密钥以解锁注册表。',
  hint:'密钥写在页面源码的注释里。查看源代码，找「备用密钥」。',
  build(r,next){
    const inp = mkInput({placeholder:'密钥'});
    on(inp,'input', ()=>{ if (inp.value.trim() === 'hunter2') next(); });
    r.append(Col(h('div',{style:'font-family:monospace;color:#9aa6b8;'}, 'cipher = 8f3a1c…'), inp, P('（右键 → 查看网页源代码）')));
  }},

/* 77 连点「我是机器人」3 次 */
{ desc:'请证明你是人类。',
  hint:'只有「我是机器人」这一个按钮。连点它 3 次，它就改口了。',
  build(r,next){
    let n = 0; const st = P('');
    const b = B('我是机器人', ()=>{ n++; if (n >= 3){ st.className='note ok'; st.textContent='系统：你显然不是机器人。通过。'; next(); } else { st.textContent = '已选「我是机器人」'+n+' 次…'; } }, 'btn ghost');
    r.append(Col(b, st));
  }},

/* 78 点击永不结束的转圈 */
{ desc:'正在校验身份，请稍候…',
  hint:'它永远不会转完。点一下那个转圈圈。',
  build(r,next){
    const s = document.createElement('style'); s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}'; document.head.append(s);
    disposers.push(()=>s.remove());
    const sp = h('div',{style:'width:46px;height:46px;border:4px solid #2c3852;border-top-color:#4f8cff;border-radius:50%;animation:spin 1s linear infinite;cursor:pointer;'});
    on(sp,'click', next);
    r.append(Row(sp, ' 校验中…'));
  }},

/* 79 先钉住会消失的按钮 */
{ desc:'点击「注册成功」。',
  hint:'它会消失。先点左边那个 📌 图钉把它钉住，再点它。',
  build(r,next){
    const b = B('✅ 注册成功', next);
    const pin = h('span',{style:'font-size:22px;cursor:pointer;user-select:none;'},'📌');
    let pinned = false;
    on(pin,'click', ()=>{ pinned = true; pin.style.filter = 'drop-shadow(0 0 6px #5cd08a)'; toast('已钉住。'); });
    on(document,'mousemove', e=>{ if (pinned) return; const q = b.getBoundingClientRect();
      b.style.opacity = Math.hypot(e.clientX-(q.left+q.width/2), e.clientY-(q.top+q.height/2)) < 90 ? '0' : '1'; });
    r.append(Row(pin, b));
  }},

/* 80 先退出登录再提交 */
{ desc:'提交注册信息。',
  hint:'左边显示你「已登录」——先点「退出登录」，再提交。',
  build(r,next){
    let logged = true;
    const badge = h('div',{style:'font-size:13px;color:#9aa6b8;'}, '👤 已登录：admin');
    const out = B('退出登录', ()=>{ logged = false; badge.textContent = '👤 未登录'; out.disabled = true; out.style.opacity = '.5'; }, 'btn ghost');
    const sub = B('提交', ()=>{ if (!logged) next(); else toast('请先退出登录。'); });
    r.append(Col(Row(badge, out), Row(sub)));
  }},

/* 81 连点陷阱 3 次直到它放弃 */
{ desc:'点击「跳过」继续（它会把你送回去）。',
  hint:'点它 3 次，它会自己放弃并放你过去。',
  build(r,next){
    let n = 0; const st = P('');
    const b = B('跳过', ()=>{ n++; if (n < 3){ st.textContent = '它把你送回去了…（' + n + '/3）'; } else { st.textContent = '它放弃了。通过。'; next(); } });
    r.append(Col(b, st));
  }},

/* 82 别点崩溃按钮，等 5 秒 */
{ desc:'🎉 恭喜注册成功！点击「查看我的账户」。',
  hint:'点它会报错。别点，安静等 5 秒，会出现真正的「继续」。',
  build(r,next){
    const b = B('查看我的账户', ()=>{ toast('错误：Cannot read properties of undefined (reading "human")'); });
    const st = P('（等待系统恢复…）');
    r.append(Col(h('div',{style:'font-size:20px;'},'🎊 注册完成 🎊'), b, st));
    let t = 0, shown = false;
    every(1000, ()=>{ t++; if (shown) return; if (t >= 5){ shown = true; st.innerHTML = ''; st.append(B('继续 →', next)); } else { st.textContent = '（等待系统恢复… ' + (5-t) + ' 秒）'; } });
  }},

/* 83 回忆第 1 关按钮文字 */
{ desc:'请输入第 1 关那个按钮上的文字。',
  hint:'第 1 关的按钮写的是「继续」。',
  build(r,next){
    const inp = mkInput({placeholder:'回忆一下…'});
    on(inp,'input', ()=>{ if (inp.value.trim() === '继续') next(); });
    r.append(inp);
  }},

/* 84 三组配对消除 */
{ desc:'把三组相同的图案配对消除。',
  hint:'点两张一样的牌即可消除，全部消完就通过。',
  build(r,next){
    const items = ['🍎','🍎','🍇','🍇','⭐','⭐'].sort(()=>Math.random()-0.5);
    let first = null, matched = 0;
    const wrap = Row();
    items.forEach(sym=>{
      const c = h('div',{class:'card'}, '？');
      on(c,'click', ()=>{
        if (c.dataset.done || c === first) return;
        if (!first){ first = c; c.textContent = sym; return; }
        c.textContent = sym;
        if (first.textContent === sym){ first.dataset.done = 1; c.dataset.done = 1; matched++; first = null; if (matched === 3) next(); }
        else { const f = first; after(500, ()=>{ f.textContent = '？'; c.textContent = '？'; }); first = null; }
      });
      wrap.append(c);
    });
    r.append(wrap);
  }},

/* 85 连点「完成注册」10 次 */
{ desc:'这是最后一关。点击「完成注册」结束整个流程。',
  hint:'点一次它会说又生成了 85 关。别停，连点 10 次。',
  build(r,next){
    let n = 0; const st = P('');
    const b = B('完成注册', ()=>{ n++; st.textContent = n < 10 ? ('它又生成了 85 关…（' + n + '/10）') : ''; if (n >= 10) next(); });
    r.append(Col(b, st, P('（你确定要点吗）')));
  }},

];

/* ============================ 引擎 ============================ */
let idx = 0, advanced = false, solved = 0, skippedCount = 0, hintCount = 0;

function go(n){
  clearAll();
  if (n >= LEVELS.length){ idx = LEVELS.length - 1; finish(); return; }
  idx = Math.max(0, n);
  render();
}
function next(){ if (advanced) return; advanced = true; solved++; go(idx + 1); }

function render(){
  const lv = LEVELS[idx];
  $('#levelNo').textContent = '第 ' + (idx+1) + ' 关 / 共 ' + LEVELS.length + ' 关';
  $('#bar').style.width = (idx / LEVELS.length * 100).toFixed(2) + '%';
  const hb = $('#hintBox'); hb.textContent = ''; hb.classList.remove('show');
  const stage = $('#stage');
  stage.innerHTML = '';
  stage.append(h('p', {class:'desc', html: lv.desc || ''}));
  advanced = false;
  try { lv.build(stage, next); }
  catch (e){ stage.append(P('本关渲染出错：' + (e && e.message))); }
  window.scrollTo(0, 0);
}

function finish(){
  const w = document.createElement('div');
  w.id = 'winOverlay';
  w.innerHTML = '<div id="winBox"><h2>🏁 你通关了</h2>'
    + '<p>手解关卡：<b style="color:#5cd08a">' + solved + ' / ' + LEVELS.length + '</b></p>'
    + '<p>认输跳过：<b style="color:#ffb454">' + skippedCount + '</b> 关</p>'
    + '<p>查看提示：<b>' + hintCount + '</b> 次</p>'
    + (skippedCount === 0 && hintCount === 0 ? '<p>（既没跳过也没看提示——你确定你是人类？）</p>' : '')
    + '<button id="winClose">关闭</button></div>';
  document.body.append(w);
  w.querySelector('#winClose').onclick = ()=>{ w.remove(); go(0); };
}

$('#tHint').onclick = ()=>{ hintCount++; const lv = LEVELS[idx]; const hb = $('#hintBox');
  hb.textContent = '💡 ' + (lv.hint || '（本关暂无提示）'); hb.classList.add('show'); };
$('#tRetry').onclick = ()=>go(idx);
$('#tSkip').onclick  = ()=>{ skippedCount++; go(idx + 1); };

render();
</script>
</body>
</html>
