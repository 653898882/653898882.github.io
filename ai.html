<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI 小智</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#eef1f5;color:#333;font-size:14px}
.top{background:#2b6cb0;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.top b{font-size:16px}
.top a{color:#dbe9f7;margin-left:auto;font-size:13px}
.wrap{max-width:820px;margin:12px auto;padding:0 10px 16px}
.panel{background:#fff;border:1px solid #cfd8e3;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 90px)}
.panel-hd{background:#f5f8fb;border-bottom:1px solid #e1e8f0;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.panel-hd .q{margin-left:auto;color:#7a8a99}
.chat{flex:1;overflow-y:auto;padding:12px;background:#fbfcfe}
.msg{display:flex;gap:8px;margin-bottom:12px}
.msg .av{width:32px;height:32px;border-radius:4px;flex:none;background:#2b6cb0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.msg.user .av{background:#7a8a99}
.msg .bub{background:#fff;border:1px solid #e1e8f0;border-radius:5px;padding:8px 11px;max-width:78%;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:#e8f0fb;border-color:#cfe0f7}
.msg .time{font-size:11px;color:#a9b4bf;margin-top:4px}
.msg.sys .bub{background:#fff6e5;border-color:#f2dfb8;color:#8a6d3b}
.inputbar{border-top:1px solid #e1e8f0;padding:10px;background:#fff}
.iline{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:1px solid #cfd8e3;border-radius:5px;padding:8px 10px;font-family:inherit;font-size:14px;resize:none;min-height:44px;max-height:120px;outline:none}
textarea:focus{border-color:#2b6cb0}
.send{border:0;background:#2b6cb0;color:#fff;border-radius:5px;padding:10px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.send:disabled{opacity:.5;cursor:not-allowed}
.meta{display:flex;gap:10px;font-size:12px;color:#8a95a1;margin-top:6px}
.meta .warn{color:#c0392b}
.meta .right{margin-left:auto}
.hint{font-size:12px;color:#8a95a1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#333;color:#fff;padding:7px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
.center{text-align:center}
</style>
</head>
<body>
<div class="top"><b>🤖 AI 小智</b><a href="./">← 返回论坛</a></div>
<div class="wrap">
  <div class="panel">
    <div class="panel-hd">
      <span>AI 小智</span>
      <span class="hint" id="who"></span>
      <span class="q" id="quota">额度加载中…</span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inputbar" id="inputbar">
      <div class="iline">
        <textarea id="msg" placeholder="输入你的问题…（最多 300 字）" maxlength="300"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="meta">
        <span id="counter">0/300</span>
        <span class="warn" id="cd"></span>
        <span class="right" id="tip"></span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $ = id => document.getElementById(id);
const chat = $('chat'), msg = $('msg'), sendBtn = $('send');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get token(){return localStorage.getItem('forum_token')||'';},
  get user(){try{return JSON.parse(localStorage.getItem('forum_user')||'null');}catch{return null;}}
};
let history = [];         // {role, content}
let remaining = null, maxInput = 300, cooldown = 8, cdTimer = null;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function nowTime(){return new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});}

function addMsg(role, text){
  const div=document.createElement('div');
  div.className='msg '+(role==='user'?'user':role==='sys'?'sys':'ai');
  const name = role==='user'?'我':'小智';
  div.innerHTML = `<div class="av">${role==='user'?'我':'智'}</div>
    <div><div class="bub">${esc(text)}</div><div class="time">${nowTime()}</div></div>`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}

async function req(path, opts={}){
  const headers = opts.body ? {'Content-Type':'application/json'} : {};
  if(store.token) headers['Authorization']='Bearer '+store.token;
  const r = await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(j.error||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}

function renderQuota(){
  if(remaining===null){ $('quota').textContent=''; return; }
  $('quota').textContent = `今日剩余 ${remaining} 次`;
}
function startCooldown(sec){
  let n = sec;
  $('cd').textContent = `冷却 ${n}s`;
  sendBtn.disabled = true;
  clearInterval(cdTimer);
  cdTimer = setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(cdTimer); $('cd').textContent=''; if(remaining!==null && remaining>0) sendBtn.disabled=false; }
    else $('cd').textContent = `冷却 ${n}s`;
  }, 1000);
}

async function loadQuota(){
  if(!store.token){ showLogin(); return; }
  try{
    const j = await req('?action=ai_quota');
    remaining = j.remaining; maxInput = j.maxInput||300; cooldown = j.cooldown||8;
    msg.setAttribute('maxlength', String(maxInput));
    msg.placeholder = `输入你的问题…（最多 ${maxInput} 字）`;
    renderQuota();
    if(j.wait>0) startCooldown(j.wait);
    if(remaining<=0){ sendBtn.disabled=true; $('tip').textContent='今日次数已用完，明天再来'; }
  }catch(e){
    if(e.status===401){ showLogin(); }
    else toast(e.message);
  }
}

function showLogin(){
  chat.innerHTML = `<div class="msg sys"><div class="av">!</div><div><div class="bub">请先登录论坛账号后再使用 AI 小智。\n\n回到论坛登录：<a href="./">点这里</a></div></div></div>`;
  $('inputbar').style.display='none';
  $('quota').textContent='未登录';
}

async function send(){
  const text = msg.value.trim();
  if(!text){ toast('请输入内容'); return; }
  if(text.length > maxInput){ toast(`最多 ${maxInput} 字`); return; }
  if(!store.token){ showLogin(); return; }

  addMsg('user', text);
  msg.value=''; updateCounter();
  sendBtn.disabled = true;
  const typing = document.createElement('div');
  typing.className='msg ai'; typing.innerHTML = `<div class="av">智</div><div><div class="bub">正在思考…</div></div>`;
  chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

  try{
    const j = await req('', {method:'POST', body:{action:'ai_chat', message:text, history}});
    typing.remove();
    addMsg('ai', j.reply);
    history.push({role:'user',content:text});
    history.push({role:'assistant',content:j.reply});
    if(history.length>6) history = history.slice(-6);
    remaining = j.remaining; renderQuota();
    startCooldown(cooldown);
    if(remaining<=0){ $('tip').textContent='今日次数已用完，明天再来'; }
  }catch(e){
    typing.remove();
    if(e.status===401){ showLogin(); }
    else if(e.status===429){ toast(e.message); startCooldown(cooldown); }
    else { toast(e.message); sendBtn.disabled=false; }
  }
}

function updateCounter(){ $('counter').textContent = `${msg.value.length}/${maxInput}`; }

msg.addEventListener('input', updateCounter);
msg.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) send(); } });
sendBtn.onclick = send;

// 初始
const u = store.user;
if(u){ $('who').textContent = `当前：${u.username}`; }
addMsg('sys','你好，我是 AI 小智，有什么可以帮你？（单条最多 300 字，每天 20 次）');
loadQuota();
updateCounter();
</script>
<script>
(function(){try{
  var t=localStorage.getItem('forum_token')||'';
  var h={'Content-Type':'application/json'};
  if(t) h['Authorization']='Bearer '+t;
  fetch('https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum',
    {method:'POST',headers:h,body:JSON.stringify({action:'track',path:location.pathname+location.search,referer:document.referrer||''})}
  ).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
