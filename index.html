<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>论坛</title>
<link rel="preconnect" href="https://jgwadmeqhzgzlkbbjcik.supabase.co" crossorigin>
<link rel="stylesheet" href="./theme.css">
<script src="./icons.js"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f7fc; --card:#fff; --soft:#f6f9fd; --soft2:#eef4ff;
  --ink:#22314a; --mut:#8896a8; --line:#e9eef6;
  --g1:#4f8cff; --g2:#35d0ba; --hot:#ff5d73;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e141b; --card:#151c26; --soft:#1b242f; --soft2:#1d2a3b;
         --ink:#e7eef8; --mut:#8d9aac; --line:#26313f; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ic{display:inline-block;vertical-align:-4px}
/* 头 */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--g1),var(--g2));box-shadow:0 6px 20px rgba(79,140,255,.22)}
.top .in{max-width:1000px;margin:0 auto;padding:0 14px;height:56px;display:flex;align-items:center;gap:12px;color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;cursor:pointer;color:#fff}
.tsearch{margin-left:auto;display:flex;align-items:center;gap:6px;background:#ffffff26;border-radius:18px;padding:6px 12px}
.tsearch input{background:none;border:0;outline:none;color:#fff;width:120px;font-size:13px}
.tsearch input::placeholder{color:#eaf3ffaa}
.ava{width:34px;height:34px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 2px #ffffff55;cursor:pointer}
.ava img{width:100%;height:100%;object-fit:cover}
/* 布局 */
.wrap{position:relative;z-index:1;max-width:1000px;margin:14px auto 88px;padding:0 14px}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 20px rgba(34,49,74,.06);overflow:hidden}
.card+.card,.mt{margin-top:14px}
.card-hd{padding:13px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card-hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-bd{padding:14px 16px}
/* 版块 */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bcard{background:var(--card);border-radius:18px;padding:15px;box-shadow:0 4px 20px rgba(34,49,74,.06);cursor:pointer;transition:.18s;display:block}
.bcard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(34,49,74,.1)}
.bicon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px}
.bname{font-weight:800;font-size:15px}
.bdesc{font-size:12px;color:var(--mut);margin-top:3px;min-height:32px}
.bstat{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:8px}
/* 主题行 */
.row{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .t{flex:1;min-width:0}
.row .tt{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:11.5px;color:var(--mut);margin-top:3px}
.row .n{font-size:11.5px;color:var(--mut);text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;margin-right:5px;vertical-align:1px}
.pill.st{background:#fff0f3;color:#e0245e}
.pill.ft{background:#fff6e0;color:#b07d00}
@media (prefers-color-scheme: dark){
  .pill.st{background:#3a1f28;color:#ff8fa8}
  .pill.ft{background:#3a2f14;color:#ffc85c}
}
/* 楼层 */
.post{background:var(--card);border-radius:18px;box-shadow:0 4px 20px rgba(34,49,74,.06);padding:15px;margin-top:12px}
.ph{display:flex;gap:10px;align-items:center}
.pn{font-weight:800;font-size:14.5px}
.pt{font-size:11.5px;color:var(--mut);margin-top:1px}
.pb{margin-top:10px;white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:15px}
.sig{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts a,.acts button{display:flex;align-items:center;gap:5px;background:var(--soft);border:0;border-radius:14px;padding:7px 12px;font-size:12.5px;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:600}
.acts a:hover,.acts button:hover{background:var(--soft2);color:#2f6fe0}
.acts .liked{color:var(--hot);background:#fff0f3}
@media (prefers-color-scheme: dark){ .acts .liked{background:#3a1f28} }
/* 表单 */
textarea,input,select{font-family:inherit;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:11px 13px;font-size:14.5px;color:var(--ink);outline:none;width:100%}
textarea:focus,input:focus,select:focus{border-color:#bcd6ff;box-shadow:0 0 0 3px rgba(79,140,255,.13)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
.btn{border:0;border-radius:22px;padding:10px 20px;font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));cursor:pointer;box-shadow:0 6px 16px rgba(79,140,255,.3);font-family:inherit;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.gray{background:var(--soft);color:var(--mut);box-shadow:none}
.btn.mini{padding:6px 14px;font-size:12px}
/* 用户页 */
.uhero{display:flex;flex-direction:column;align-items:center;padding:22px 16px 16px;gap:8px}
.uhero .ava{width:76px;height:76px;font-size:26px;box-shadow:none}
.ustat{display:flex;width:100%;margin-top:12px;background:var(--soft);border-radius:16px;overflow:hidden}
.ustat>div{flex:1;text-align:center;padding:11px 0}
.ustat b{display:block;font-size:16px;font-weight:800}
.ustat span{font-size:11.5px;color:var(--mut)}
/* 通用 */
.empty{padding:44px 16px;text-align:center;color:var(--mut)}
.muted{color:var(--mut);font-size:12px}
.hidden{display:none!important}
.err{color:#e0245e;font-size:13px;margin-top:8px}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:10px}
.crumb a{color:#2f6fe0}
/* 弹窗 */
.modal{position:fixed;inset:0;background:#0b1520aa;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(10,25,50,.3)}
.box h3{font-size:16px;font-weight:800;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:12.5px;color:var(--mut)}
.cap{display:flex;gap:9px;align-items:center}
.cap img{height:44px;border-radius:12px;cursor:pointer;background:var(--soft)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:#2f6fe0;box-shadow:0 2px 8px rgba(34,49,74,.08)}
/* 底栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(34,49,74,.06)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:4px 0}
.tabbar a.on{color:#4f8cff;font-weight:800}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) scale(.9);background:#22314a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
@media(min-width:760px){.boards{grid-template-columns:1fr 1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand" onclick="location.href='./'">
    <svg viewBox="0 0 32 32" width="22" height="22"><path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><rect x="8.5" y="11.6" width="15" height="2.6" rx="1.3" fill="#4f8cff"/><rect x="8.5" y="16.6" width="10" height="2.6" rx="1.3" fill="#9ed8ff"/></svg>
    论坛
  </div>
  <div class="tsearch" id="searchBox"></div>
  <div class="ava" id="topAva"></div>
</div></div>

<div class="wrap" id="app"></div>
<div class="tabbar" id="tabbar"></div>
<div class="toast" id="toast"></div>

<script>
const API="https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'';
const fmtD=t=>t?new Date(t).toLocaleDateString('zh-CN'):'';
const rel=t=>{const d=Date.now()-new Date(t).getTime();if(d<60000)return'刚刚';if(d<3600000)return Math.floor(d/60000)+'分钟前';if(d<86400000)return Math.floor(d/3600000)+'小时前';if(d<2592000000)return Math.floor(d/86400000)+'天前';return fmtD(t);};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
const PALETTE=[['#4f8cff','#35d0ba'],['#ff8f70','#ff5d73'],['#a78bfa','#7c9dff'],['#fbbf24','#fb923c'],['#34d399','#22d3ee'],['#f472b6','#a78bfa']];
function grad(n){let h=0;for(const c of String(n||'?'))h=(h*31+c.charCodeAt(0))>>>0;const p=PALETTE[h%PALETTE.length];return `linear-gradient(135deg,${p[0]},${p[1]})`;}
const TCOLOR={'萌新':'#9aa7b6','夜猫子':'#22c55e','段子手':'#fb923c','活跃分子':'#4f8cff','学霸':'#35d0ba','人气王':'#ff5d73','大佬':'#ffb020','传说':'#a78bfa'};
function tchip(n){return n?`<span class="pill" style="background:${TCOLOR[n]||'#8fa0b3'};color:#fff">${esc(n)}</span>`:'';}
function avatar(u,size){const st=size?`width:${size}px;height:${size}px;`:'';if(u&&u.avatar)return `<div class="ava" style="${st}"><img src="${esc(u.avatar)}"></div>`;const n=(u&&u.username)||'?';return `<div class="ava" style="${st}background:${grad(n)}">${esc(n.slice(0,1))}</div>`;}
function lvOf(u){const e=(u.points||0)+(u.post_count||0)*5;return {lv:1+Math.floor(e/100),cur:e%100};}

const store={get token(){return localStorage.getItem('forum_token')||'';},set token(v){v?localStorage.setItem('forum_token',v):localStorage.removeItem('forum_token');},
  get user(){try{return JSON.parse(localStorage.getItem('forum_user')||'null');}catch(e){return null;}},set user(u){u?localStorage.setItem('forum_user',JSON.stringify(u)):localStorage.removeItem('forum_user');}};
let me=store.user, boards=[], curPost=null, authMode='login', capId='';

async function req(path,opts={}){
  const h={}; if(opts.body)h['Content-Type']='application/json';
  if(store.token)h['Authorization']='Bearer '+store.token;
  const r=await fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}

/* ---------- 顶栏 ---------- */
function paintTop(){
  $('searchBox').innerHTML=icon('search',{size:15})+'<input id="sInput" placeholder="搜索主题…">';
  $('sInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)location.hash='#/search?q='+encodeURIComponent(q);}});
  $('topAva').innerHTML = me&&me.avatar?`<img src="${esc(me.avatar)}">`:esc(me?me.username.slice(0,1):'?');
  $('topAva').style.background = me&&me.avatar?'':grad(me?me.username:'?');
  $('topAva').onclick = ()=> me?location.hash='#/me' : openAuth('login');
  const tabs=[['./feed.html','home','动态',false],['./','forum','论坛',true],['./chat.html','chat','私信',false],['./ai.html','spark','AI',false],[me?'#/me':'./','user','我的',false]];
  $('tabbar').innerHTML = tabs.map(([href,ic,label,on])=>`<a href="${href}" class="${on?'on':''}">${icon(ic,{size:21})}<span>${label}</span></a>`).join('');
}

/* ---------- 路由 ---------- */
function parseHash(){const h=location.hash.replace(/^#/,'')||'/';const [p,q]=h.split('?');return {seg:p.split('/').filter(Boolean),q:new URLSearchParams(q||'')};}
async function route(){
  const {seg,q}=parseHash(); window.scrollTo(0,0);
  await loadBoards();
  try{
    if(seg[0]==='b') return boardView(seg[1],q);
    if(seg[0]==='t') return threadView(seg[1],q);
    if(seg[0]==='u') return profileView(seg[1]);
    if(seg[0]==='me') return meView(q.get('tab')||'info');
    if(seg[0]==='search') return searchView(q.get('q')||'');
    return homeView();
  }catch(e){ app.innerHTML=`<div class="card"><div class="empty">${esc(e.message)}</div></div>`; }
}
window.addEventListener('hashchange',route);

async function loadBoards(force){
  if(boards.length&&!force) return boards;
  try{const raw=localStorage.getItem('forum_boards');if(raw){const c=JSON.parse(raw);if(c.d&&c.d.length)boards=c.d;}}catch(e){}
  try{const j=await req('?action=boards');boards=j.boards||[];localStorage.setItem('forum_boards',JSON.stringify({t:Date.now(),d:boards}));}catch(e){}
  return boards;
}

/* ---------- 首页 ---------- */
async function homeView(){
  const list=await loadBoards(true);
  const icons=['forum','code','chat','spark','fire','grid'];
  app.innerHTML = `
    <div class="boards">${list.map((b,i)=>`
      <a class="bcard" href="#/b/${esc(b.slug)}">
        <div class="bicon" style="background:${grad(b.name)}">${icon(icons[i%icons.length],{size:20})}</div>
        <div class="bname">${esc(b.name)}</div>
        <div class="bdesc">${esc(b.description||'')}</div>
        <div class="bstat"><span>主题 ${b.topic_count}</span><span>帖数 ${b.reply_count}</span></div>
      </a>`).join('')||'<div class="card"><div class="empty">还没有版块</div></div>'}
    </div>`;
}

/* ---------- 版块 ---------- */
async function boardView(slug,q){
  const page=Math.max(1,parseInt(q.get('page')||'1',10));
  const sort=q.get('sort')==='hot'?'hot':'new';
  const j=await req(`?board=${encodeURIComponent(slug)}&page=${page}&sort=${sort}`);
  const b=j.board||{name:slug};
  const rows=(j.posts||[]).map(p=>`
    <div class="row" data-id="${p.id}">
      <div class="t">
        <div class="tt">${p.is_sticky?'<span class="pill st">置顶</span>':''}${p.is_featured?'<span class="pill ft">精华</span>':''}${esc(p.title)}</div>
        <div class="tm">${esc(p.author)} · ${rel(p.created_at)}</div>
      </div>
      <div class="n">${p.reply_count||0} 回复<br>${p.views||0} 浏览</div>
    </div>`).join('');
  app.innerHTML = `
    <div class="crumb"><a href="#/">首页</a> / ${esc(b.name||slug)}</div>
    <div class="card">
      <div class="card-hd">
        ${esc(b.name||slug)}
        <span class="r">
          <select id="sortSel" style="width:auto;padding:6px 10px;font-size:12px">
            <option value="new"${sort==='new'?' selected':''}>最新</option>
            <option value="hot"${sort==='hot'?' selected':''}>最热</option>
          </select>
          ${me?`<button class="btn mini" id="newBtn">发主题</button>`:''}
        </span>
      </div>
      ${rows||'<div class="empty"><div style="color:#cfe0f7">'+icon('spark',{size:42})+'</div><p style="margin-top:10px">本版还没有主题</p></div>'}
    </div>
    ${me?'':'<div class="card mt"><div class="card-bd muted" style="text-align:center">登录后可以发帖 · <a href="javascript:;" onclick="openAuth(\'login\')" style="color:#2f6fe0">去登录</a></div></div>'}`;
  if($('sortSel')) $('sortSel').onchange=e=>location.hash=`#/b/${slug}?sort=${e.target.value}`;
  if($('newBtn')) $('newBtn').onclick=()=>newPostView(b.id,slug);
  app.querySelectorAll('.row').forEach(r=>r.onclick=()=>location.hash='#/t/'+r.dataset.id);
}

/* ---------- 发主题 ---------- */
function newPostView(boardId,slug){
  const opts=boards.map(b=>`<option value="${b.id}"${b.id===boardId?' selected':''}>${esc(b.name)}</option>`).join('');
  app.innerHTML=`
    <div class="crumb"><a href="#/b/${esc(slug)}">返回</a></div>
    <div class="card"><div class="card-hd">发表主题</div><div class="card-bd">
      <div class="fld"><label>版块</label><select id="npB">${opts}</select></div>
      <div class="fld"><label>标题</label><input id="npT" maxlength="120" placeholder="一句话说清楚"></div>
      <div class="fld"><label>内容</label><textarea id="npC" maxlength="20000" placeholder="详细说说…"></textarea></div>
      <div class="err" id="npE"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button class="btn gray" onclick="history.back()">取消</button>
        <button class="btn" id="npS">发表</button>
      </div>
    </div></div>`;
  $('npS').onclick=async()=>{
    const t=$('npT').value.trim(),c=$('npC').value.trim(),b=$('npB').value;
    if(!t||!c)return $('npE').textContent='标题和内容都要填';
    $('npS').disabled=true;$('npS').textContent='发表中…';
    try{const r=await req('',{method:'POST',body:{action:'post',board_id:b,title:t,body:c}});toast('发表成功');location.hash='#/t/'+r.post.id;}
    catch(e){$('npE').textContent=e.message;$('npS').disabled=false;$('npS').textContent='发表';}
  };
}

/* ---------- 帖子 ---------- */
async function threadView(id,q){
  const page=Math.max(1,parseInt(q.get('page')||'1',10));
  const j=await req(`?post_id=${encodeURIComponent(id)}&page=${page}`);
  const p=j.post, L=lvOf(p.user||{});
  const reply=(r)=>`
    <div class="post">
      <div class="ph">${avatar(r.user)}
        <div style="flex:1;min-width:0">
          <div class="pn">${esc(r.author)}${tchip(r.user&&r.user.title_name)}</div>
          <div class="pt">${r.floor}楼 · ${rel(r.created_at)}</div>
        </div>
      </div>
      <div class="pb">${esc(r.body)}</div>
      <div class="acts">
        <button data-q="${r.floor}" data-a="${esc(r.author)}" data-b="${esc((r.body||'').slice(0,80))}">${icon('comment',{size:15})}引用</button>
        <button data-report="reply" data-id="${r.id}">${icon('shield',{size:15})}举报</button>
        ${r.canDelete?`<button data-delr="${r.id}">${icon('trash',{size:15})}删除</button>`:''}
      </div>
    </div>`;
  app.innerHTML=`
    <div class="crumb"><a href="#/">首页</a> / <a href="#/b/${esc(j.post.board_id||'')}">版块</a> / 主题</div>
    <div class="post">
      <div class="ph">${avatar(p.user)}
        <div style="flex:1;min-width:0">
          <div class="pn">${esc(p.author)}${tchip(p.user&&p.user.title_name)}</div>
          <div class="pt">${fmt(p.created_at)} · ${p.views||0} 浏览</div>
        </div>
        <span class="pill ft" style="background:var(--soft2);color:#2f6fe0">Lv.${L.lv}</span>
      </div>
      <div style="font-size:18px;font-weight:800;margin:12px 0 6px">${esc(p.title)}</div>
      <div class="pb">${esc(p.body)}</div>
      ${p.user&&p.user.signature?`<div class="sig">签名：${esc(p.user.signature)}</div>`:''}
      <div class="acts">
        <button class="like ${p.liked?'liked':''}" id="likeBtn">${icon('heart',{size:16,fill:!!p.liked})} ${p.likes||0}</button>
        <button id="quoteBtn">${icon('comment',{size:15})}引用</button>
        <button data-report="post" data-id="${p.id}">${icon('shield',{size:15})}举报</button>
        ${p.canEdit?`<button id="editBtn">${icon('settings',{size:15})}编辑</button>`:''}
        ${p.canDelete?`<button id="delBtn">${icon('trash',{size:15})}删除</button>`:''}
        ${p.canMod?`<button id="stickBtn">${icon('fire',{size:15})}${p.is_sticky?'取消置顶':'置顶'}</button><button id="featBtn">${icon('spark',{size:15})}${p.is_featured?'取消精华':'加精'}</button>`:''}
      </div>
    </div>
    <div id="replies">${(j.replies||[]).map(reply).join('')||'<div class="card mt"><div class="empty">还没有回复，来说两句吧</div></div>'}</div>
    ${me?`<div class="card mt"><div class="card-hd">写回复</div><div class="card-bd">
      <div id="qBox" class="muted" style="margin-bottom:8px"></div>
      <textarea id="rpC" maxlength="3000" placeholder="友善发言～"></textarea>
      <div class="err" id="rpE"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="rpS">发布回复</button></div>
    </div></div>`:`<div class="card mt"><div class="card-bd" style="text-align:center;color:var(--mut)">登录后可以回复</div></div>`}
  `;
  if($('likeBtn')) $('likeBtn').onclick=async()=>{ if(!me)return openAuth('login');
    try{const r=await req('',{method:'POST',body:{action:'like',post_id:p.id}});$('likeBtn').classList.toggle('liked',r.liked);$('likeBtn').innerHTML=icon('heart',{size:16,fill:r.liked})+' '+r.likes;}catch(e){toast(e.message);} };
  if($('editBtn')) $('editBtn').onclick=()=>editView(p);
  if($('delBtn')) $('delBtn').onclick=async()=>{ if(!confirm('确定删除？'))return;
    try{await req('',{method:'POST',body:{action:'delete_post',id:p.id}});toast('已删除');location.hash='#/';}catch(e){toast(e.message);} };
  if($('stickBtn')) $('stickBtn').onclick=async()=>{try{await req('',{method:'POST',body:{action:'mod_post',id:p.id,field:'sticky',value:!p.is_sticky}});route();}catch(e){toast(e.message);}};
  if($('featBtn')) $('featBtn').onclick=async()=>{try{await req('',{method:'POST',body:{action:'mod_post',id:p.id,field:'feature',value:!p.is_featured}});route();}catch(e){toast(e.message);}};
  const setQuote=(author,text)=>{ if(!$('rpC'))return openAuth('login'); $('rpC').value=`@${author}：${text}\n`+($('rpC').value||''); $('rpC').focus(); if($('qBox'))$('qBox').textContent='正在引用 '+author; };
  if($('quoteBtn')) $('quoteBtn').onclick=()=>setQuote(p.author,String(p.body||'').slice(0,80));
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setQuote(b.dataset.a,b.dataset.b));
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=async()=>{
    if(!me)return openAuth('login');
    const reason=prompt('举报理由（如广告、辱骂、违法）'); if(reason===null)return;
    try{const r=await req('',{method:'POST',body:{action:'report',target_type:b.dataset.report,target_id:b.dataset.id,reason}});
      toast(r.hidden?'已处理，内容已隐藏':'举报已提交'); if(r.hidden)route();}catch(e){toast(e.message);} });
  document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=async()=>{ if(!confirm('删除该回复？'))return;
    try{await req('',{method:'POST',body:{action:'delete_reply',id:b.dataset.delr}});toast('已删除');route();}catch(e){toast(e.message);} });
  if($('rpS')) $('rpS').onclick=async()=>{
    const v=$('rpC').value.trim(); if(!v)return $('rpE').textContent='内容不能为空';
    $('rpS').disabled=true;
    try{await req('',{method:'POST',body:{action:'reply',post_id:p.id,body:v}});toast('回复成功');route();}
    catch(e){$('rpE').textContent=e.message;$('rpS').disabled=false;}
  };
}

function editView(p){
  app.innerHTML=`<div class="card"><div class="card-hd">编辑主题</div><div class="card-bd">
    <div class="fld"><label>标题</label><input id="eT" value="${esc(p.title)}" maxlength="120"></div>
    <div class="fld"><label>内容</label><textarea id="eC" style="min-height:200px">${esc(p.body)}</textarea></div>
    <div class="err" id="eE"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn gray" onclick="route()">取消</button><button class="btn" id="eS">保存</button>
    </div></div></div>`;
  $('eS').onclick=async()=>{
    try{await req('',{method:'POST',body:{action:'post',id:p.id,title:$('eT').value.trim(),body:$('eC').value.trim()}});toast('已保存');route();}
    catch(e){$('eE').textContent=e.message;}
  };
}

/* ---------- 搜索 ---------- */
async function searchView(q){
  const j=await req(`?q=${encodeURIComponent(q)}&per=30`);
  app.innerHTML=`<div class="card"><div class="card-hd">搜索「${esc(q)}」<span class="r muted">${j.total||0} 条</span></div>
    ${(j.posts||[]).map(p=>`<div class="row" data-id="${p.id}"><div class="t"><div class="tt">${esc(p.title)}</div><div class="tm">${esc(p.author)} · ${rel(p.created_at)}</div></div><div class="n">${p.reply_count||0} 回复</div></div>`).join('')||'<div class="empty">没有找到相关内容</div>'}</div>`;
  app.querySelectorAll('.row').forEach(r=>r.onclick=()=>location.hash='#/t/'+r.dataset.id);
}

/* ---------- 个人主页 ---------- */
async function profileView(id){
  const j=await req(`?action=profile&id=${encodeURIComponent(id)}`);
  const u=j.user, L=lvOf(u);
  app.innerHTML=`
    <div class="card">
      <div class="uhero">
        ${avatar(u,76)}
        <div style="font-weight:800;font-size:17px">${esc(u.username)}${tchip(u.title_name)}</div>
        <div class="muted">Lv.${L.lv} · 加入于 ${fmtD(u.created_at)}</div>
        ${j.me&&j.me.id!==u.id?`<button class="btn" id="fBtn" style="margin-top:6px">${j.isFollowing?'已关注':'关注'}</button>`:''}
        <div class="ustat">
          <div><b>${j.following||0}</b><span>关注</span></div>
          <div><b>${j.followers||0}</b><span>粉丝</span></div>
          <div><b>${u.points||0}</b><span>经验</span></div>
        </div>
      </div>
      ${u.signature?`<div class="card-bd muted" style="border-top:1px solid var(--line)">签名：${esc(u.signature)}</div>`:''}
    </div>
    <div class="card mt"><div class="card-hd">TA 的主题</div>
      ${(j.posts||[]).map(p=>`<div class="row" data-id="${p.id}"><div class="t"><div class="tt">${esc(p.title)}</div><div class="tm">${rel(p.created_at)} · ${p.reply_count||0} 回复</div></div></div>`).join('')||'<div class="empty">还没有发过主题</div>'}
    </div>`;
  app.querySelectorAll('.row').forEach(r=>r.onclick=()=>location.hash='#/t/'+r.dataset.id);
  if($('fBtn')) $('fBtn').onclick=async()=>{
    if(!j.me)return openAuth('login');
    const will=$('fBtn').textContent.trim()!=='已关注';
    try{await req('',{method:'POST',body:{action:'follow',user_id:u.id,value:will}});toast(will?'关注成功':'已取消');profileView(id);}catch(e){toast(e.message);}
  };
}

/* ---------- 用户中心 ---------- */
async function meView(tab){
  if(!me)return openAuth('login');
  const L=lvOf(me);
  let body='';
  if(tab==='info'){
    body=`<div class="fld"><label>用户名</label><input value="${esc(me.username)}" disabled></div>
      <div class="fld"><label>头像</label><div style="display:flex;gap:12px;align-items:center">
        ${avatar(me,64)}<label class="btn gray mini" style="cursor:pointer">选择图片<input id="avFile" type="file" accept="image/*" style="display:none"></label></div></div>
      <div class="fld"><label>性别</label><select id="pfG"><option value="">保密</option><option value="男"${me.gender==='男'?' selected':''}>男</option><option value="女"${me.gender==='女'?' selected':''}>女</option></select></div>
      <div class="fld"><label>个性签名</label><textarea id="pfS" maxlength="200" style="min-height:70px">${esc(me.signature||'')}</textarea></div>
      <div class="err" id="pfE"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="pfSave">保存</button></div>`;
  } else if(tab==='pwd'){
    body=`<div class="fld"><label>原密码</label><input id="p0" type="password"></div>
      <div class="fld"><label>新密码</label><input id="p1" type="password"></div>
      <div class="fld"><label>确认新密码</label><input id="p2" type="password"></div>
      <div class="err" id="pwE"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="pwSave">修改密码</button></div>`;
  } else {
    body=`<div id="myList" class="muted">加载中…</div>`;
  }
  app.innerHTML=`
    <div class="card">
      <div class="uhero">
        ${avatar(me,76)}
        <div style="font-weight:800;font-size:17px">${esc(me.username)}${tchip(me.title_name)}</div>
        <div class="muted">Lv.${L.lv} · 经验 ${me.points||0}</div>
      </div>
      <div class="seg" style="margin:14px 16px 0">
        <button class="${tab==='info'?'on':''}" onclick="location.hash='#/me?tab=info'">资料</button>
        <button class="${tab==='pwd'?'on':''}" onclick="location.hash='#/me?tab=pwd'">密码</button>
        <button class="${tab==='posts'?'on':''}" onclick="location.hash='#/me?tab=posts'">我的主题</button>
      </div>
      <div class="card-bd">${body}</div>
    </div>
    <div class="card mt"><div class="card-bd" style="display:flex;gap:10px">
      <button class="btn gray" style="flex:1" onclick="doLogout()">退出登录</button>
      <a class="btn" style="flex:1;text-align:center" href="./feed.html">去动态页</a>
    </div></div>`;
  if(tab==='info'){
    $('avFile').onchange=async e=>{
      const f=e.target.files[0]; if(!f)return;
      const fd=new FormData(); fd.append('file',f);
      try{const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+store.token},body:fd});
        const j=await r.json(); if(!r.ok)throw new Error(j.error||'上传失败');
        me.avatar=j.url; store.user=me; toast('头像已更新'); meView('info');
      }catch(err){toast(err.message);}
    };
    $('pfSave').onclick=async()=>{
      try{const j=await req('',{method:'POST',body:{action:'profile_update',gender:$('pfG').value,signature:$('pfS').value}});
        me=Object.assign({},me,j.user); store.user=me; toast('已保存'); paintTop();
      }catch(e){$('pfE').textContent=e.message;}
    };
  }
  if(tab==='pwd'){
    $('pwSave').onclick=async()=>{
      if($('p1').value!==$('p2').value)return $('pwE').textContent='两次新密码不一致';
      try{await req('',{method:'POST',body:{action:'change_password',old_password:$('p0').value,new_password:$('p1').value}});
        toast('密码已修改，请重新登录'); setTimeout(doLogout,800);
      }catch(e){$('pwE').textContent=e.message;}
    };
  }
  if(tab==='posts'){
    try{const r=await req(`?action=profile&id=${me.id}`);
      $('myList').outerHTML=(r.posts||[]).map(p=>`<div class="row" data-id="${p.id}"><div class="t"><div class="tt">${esc(p.title)}</div><div class="tm">${rel(p.created_at)}</div></div></div>`).join('')||'<div class="empty">还没有发过主题</div>';
      app.querySelectorAll('.row').forEach(x=>x.onclick=()=>location.hash='#/t/'+x.dataset.id);
    }catch(e){$('myList').textContent='加载失败';}
  }
}

/* ---------- 登录注册 ---------- */
function openAuth(mode){
  authMode=mode||'login';
  const m=document.createElement('div'); m.className='modal'; m.id='authModal';
  m.innerHTML=`<div class="box">
    <h3>${authMode==='login'?'登录':'注册'}</h3>
    <div class="seg"><button id="sL" class="${authMode==='login'?'on':''}">登录</button><button id="sR" class="${authMode==='register'?'on':''}">注册</button></div>
    <div class="fld"><label>用户名（可用 QQ 号）</label><input id="auU" maxlength="20"></div>
    <div class="fld"><label>密码（至少 6 位）</label><input id="auP" type="password"></div>
    <div class="fld"><label>验证码（30 秒内有效）</label><div class="cap"><input id="auC" maxlength="6"><img id="capImg"></div></div>
    <div class="err" id="auE"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn gray" id="auX">取消</button><button class="btn" id="auOk">确定</button>
    </div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) close(); };
  $('auX').onclick=close;
  $('sL').onclick=()=>{close();openAuth('login');};
  $('sR').onclick=()=>{close();openAuth('register');};
  $('capImg').onclick=loadCap;
  loadCap();
  $('auOk').onclick=async()=>{
    const u=$('auU').value.trim(),p=$('auP').value,c=$('auC').value.trim();
    if(!u||!p)return $('auE').textContent='用户名和密码都要填';
    if(!c)return $('auE').textContent='请输入验证码';
    $('auOk').disabled=true;
    try{
      const j=await req('',{method:'POST',body:{action:authMode,username:u,password:p,captcha_id:capId,captcha_code:c}});
      store.token=j.token; me=j.user; store.user=j.user;
      localStorage.setItem('forum_me_ts',String(Date.now()));
      close(); paintTop(); toast(authMode==='login'?'登录成功':'注册成功'); route();
    }catch(e){ $('auE').textContent=e.message; loadCap(); }
    finally{ $('auOk').disabled=false; }
  };
}
async function loadCap(){
  capId='';
  try{const j=await req('?action=captcha'); capId=j.id; $('capImg').src=j.image;}
  catch(e){}
}
async function doLogout(){
  try{await req('',{method:'POST',body:{action:'logout'}});}catch(e){}
  store.token=''; me=null; store.user=null; localStorage.removeItem('forum_me_ts');
  paintTop(); toast('已退出'); location.hash='#/'; route();
}

/* 启动 */
(async()=>{
  const sp=new URLSearchParams(location.search);
  if(sp.get('u')){const id=sp.get('u');history.replaceState({},' ',location.pathname);location.hash='#/u/'+encodeURIComponent(id);}
  if(store.token){
    req('?action=me').then(j=>{
      if(!j.user){ store.token=''; me=null; store.user=null; paintTop(); }
      else { me=Object.assign({},me,j.user); store.user=me; paintTop(); }
    }).catch(()=>{});
  }
  paintTop(); await loadBoards(); route();
})();
</script>
