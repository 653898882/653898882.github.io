<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>论坛</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%232b6cb0'/%3E%3Cpath d='M7 8h18a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-7l-5 4v-4H7a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3Crect x='9.5' y='12.5' width='13' height='2.4' rx='1.2' fill='%232b6cb0'/%3E%3Crect x='9.5' y='17.2' width='8.5' height='2.4' rx='1.2' fill='%237fb3e8'/%3E%3C/svg%3E">
<style>
html{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a{-webkit-tap-highlight-color:transparent}
button:active,a:active{opacity:.8}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;color:#333;background:#eef1f5;line-height:1.7}
a{color:#1a66b3;text-decoration:none}
a:hover{text-decoration:underline;color:#d33}
input,textarea,select,button{font-family:inherit;font-size:14px}
.container{max-width:960px;margin:0 auto;padding:0 8px 60px}
/* 顶栏 */
.topbar{background:#2b6cb0;color:#fff}
.topbar .inner{max-width:960px;margin:0 auto;padding:0 8px;height:46px;display:flex;align-items:center;gap:14px}
.logo{font-size:18px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap}
.logo:hover{color:#fff;text-decoration:none}
.topbar .search{flex:1;display:flex;max-width:320px;margin-left:auto}
.topbar .search input{flex:1;border:0;border-radius:3px 0 0 3px;padding:6px 8px;background:#fff;color:#333}
.topbar .search button{border:0;background:#1d5a94;color:#fff;padding:6px 12px;border-radius:0 3px 3px 0;cursor:pointer}
.userbox{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.userbox a{color:#dbe9f7}
/* 导航 */
.nav{background:#fff;border-bottom:1px solid #cfd8e3}
.nav .inner{max-width:960px;margin:0 auto;padding:0 8px;display:flex;gap:2px;flex-wrap:wrap}
.nav a{display:block;padding:9px 16px;font-size:14px;color:#333;border-bottom:2px solid transparent}
.nav a.on{color:#1a66b3;border-bottom-color:#2b6cb0;font-weight:700}
.nav a:hover{background:#f4f7fb;text-decoration:none}
/* 通用面板 */
.panel{background:#fff;border:1px solid #cfd8e3;border-radius:4px;margin-top:12px;overflow:hidden}
.panel-hd{background:#f5f8fb;border-bottom:1px solid #e1e8f0;padding:9px 12px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-bd{padding:12px}
.crumb{font-size:13px;color:#666;padding:10px 2px 0}
.crumb a{color:#1a66b3}
/* 表格 */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #eef2f6;vertical-align:middle}
th{background:#f5f8fb;color:#666;font-weight:normal;font-size:13px}
tr:hover td{background:#fafcff}
.col-bd{width:auto}.col-num{width:88px;text-align:center;white-space:nowrap}.col-last{width:150px;font-size:12px;color:#888;white-space:nowrap}table th:nth-child(2),table td:nth-child(2){width:96px;white-space:nowrap}
.bd-name{font-size:15px;font-weight:700}
.bd-desc{font-size:12px;color:#999;font-weight:normal}
/* 主题行 */
.topic-title{font-size:14px}
.topic-title .st{color:#c00;font-weight:normal;font-size:12px;border:1px solid #f0b0b0;border-radius:2px;padding:0 3px;margin-right:5px}
.topic-title .ft{color:#e08a00;font-weight:normal;font-size:12px;border:1px solid #f2d49b;border-radius:2px;padding:0 3px;margin-right:5px}
/* 楼层 */
.post{border-bottom:1px solid #e8edf3;display:flex}
.post:last-child{border-bottom:0}
.post .pu{width:150px;flex:none;background:#f7f9fc;border-right:1px solid #e8edf3;padding:12px 10px;text-align:center}
.post .pu .av{width:64px;height:64px;border-radius:4px;object-fit:cover;background:#dde5ee;border:1px solid #cfd8e3}
.post .pu .nm{font-weight:700;margin-top:6px;word-break:break-all}
.post .pu .lv{display:inline-block;font-size:12px;color:#2b6cb0;background:#e8f0fb;border-radius:3px;padding:0 7px;margin-top:4px}
.post .pu .info{font-size:12px;color:#888;margin-top:6px;text-align:left;padding-left:4px}
.post .pc{flex:1;padding:12px 14px;min-width:0}
.post .pc .hd{display:flex;align-items:center;gap:10px;color:#999;font-size:12px;border-bottom:1px dashed #e8edf3;padding-bottom:6px;margin-bottom:8px}
.post .pc .hd .floor{margin-left:auto;color:#bbb}
.post .pc .body{white-space:pre-wrap;word-break:break-word;min-height:48px}
.post .pc .quote{background:#f5f8fb;border-left:3px solid #cfd8e3;padding:6px 10px;margin-bottom:8px;color:#777;font-size:13px}
.post .sig{border-top:1px dashed #e8edf3;margin-top:10px;padding-top:6px;color:#999;font-size:12px}
.acts{margin-top:8px;display:flex;gap:12px;font-size:12px}
/* 按钮 */
.btn{display:inline-block;border:0;background:#2b6cb0;color:#fff;border-radius:3px;padding:7px 16px;cursor:pointer;font-size:14px}
.btn:hover{background:#265f9a}
.btn.gray{background:#e6ebf1;color:#333}
.btn.gray:hover{background:#dbe2ea}
.btn.mini{padding:2px 8px;font-size:12px}
.btn.link{background:none;color:#1a66b3;padding:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.right{margin-left:auto}
/* 分页 */
.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
.pager a,.pager span{display:inline-block;border:1px solid #cfd8e3;background:#fff;padding:3px 10px;border-radius:3px;color:#1a66b3;font-size:13px}
.pager span.cur{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.pager span.dis{color:#bbb;border-color:#e5e9ef}
/* 表单 */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:#555}
.field input,.field textarea,.field select{border:1px solid #cfd8e3;border-radius:3px;padding:7px 9px;background:#fff}
.field textarea{min-height:120px;resize:vertical}
textarea{font-family:inherit}
.cap{display:flex;gap:8px;align-items:center}
.cap img{height:42px;border:1px solid #cfd8e3;border-radius:3px;cursor:pointer;background:#f5f6f7}
.err{color:#c00;font-size:13px}
.ok{color:#1a7f37;font-size:13px}
.muted{color:#999;font-size:12px}
.center{text-align:center}
/* 弹窗 */
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal .box{background:#fff;border-radius:5px;width:100%;max-width:380px;padding:18px}
.modal h3{margin-bottom:12px;font-size:16px}
.tabs2{display:flex;border-bottom:1px solid #cfd8e3;margin-bottom:14px}
.tabs2 button{background:none;border:0;padding:8px 14px;cursor:pointer;color:#555;border-bottom:2px solid transparent}
.tabs2 button.on{color:#1a66b3;border-bottom-color:#2b6cb0;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:4px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:.95}
.hidden{display:none!important}
@media(max-width:640px){
  .post{flex-direction:column}
  .post .pu{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border-right:0;border-bottom:1px solid #e8edf3}
  .post .pu .av{width:40px;height:40px}
  .post .pu .info{margin:0;display:none}
  .col-last{display:none}
  th.col-last{display:none}
}
</style>
</head>
<body>
<div class="topbar"><div class="inner">
  <a class="logo" href="#/"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" style="vertical-align:-4px;margin-right:6px"><path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><rect x="8.5" y="11.6" width="15" height="2.6" rx="1.3" fill="#2b6cb0"/><rect x="8.5" y="16.6" width="10" height="2.6" rx="1.3" fill="#7fb3e8"/></svg>论坛</a>
  <div class="search">
    <input id="topSearch" placeholder="搜索主题…">
    <button id="topSearchBtn">搜索</button>
  </div>
</div></div>
<div class="nav"><div class="inner" id="nav"></div></div>
<div class="container" id="app"></div>

<div class="modal hidden" id="authModal"><div class="box">
  <h3 id="authTitle">登录</h3>
  <div class="tabs2">
    <button id="tabLogin" class="on">登录</button>
    <button id="tabReg">注册</button>
  </div>
  <div class="field"><label>用户名（可填QQ号）</label><input id="auUser" maxlength="20"></div>
  <div class="field"><label>密码</label><input id="auPass" type="password"></div>
  <div class="field"><label>验证码（30 秒内有效，点击图片刷新）</label>
    <div class="cap"><input id="auCap" maxlength="6" autocomplete="off"><img id="capImg" title="点击刷新"></div>
  </div>
  <div class="err" id="authErr"></div>
  <div class="toolbar" style="margin-top:12px">
    <button class="btn gray" id="authCancel" type="button">取消</button>
    <button class="btn right" id="authOk">确定</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const API = "https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('zh-CN',{hour12:false}) : '';
const fmtD = t => t ? new Date(t).toLocaleDateString('zh-CN') : '';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function level(n){ n=n||0; if(n<10)return'新手上路'; if(n<50)return'初级会员'; if(n<200)return'中级会员'; if(n<500)return'高级会员'; return'论坛元老'; }

const store = {
  get token(){return localStorage.getItem('forum_token')||'';},
  set token(v){v?localStorage.setItem('forum_token',v):localStorage.removeItem('forum_token');},
  get user(){try{return JSON.parse(localStorage.getItem('forum_user')||'null');}catch{return null;}},
  set user(u){u?localStorage.setItem('forum_user',JSON.stringify(u)):localStorage.removeItem('forum_user');}
};
let me = store.user;
let boards = [];

async function req(path, opts={}){
  const headers = {};
  if(opts.body) headers['Content-Type']='application/json';
  if(store.token) headers['Authorization']='Bearer '+store.token;
  const r = await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(j.error||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}

// 启动时校验登录态：账号被删除/会话失效 -> 自动退出
async function validateSession(){
  if(!store.token){ me=null; store.user=null; return; }
  try{
    const j = await req('?action=me');
    if(j.user){ me=j.user; store.user=j.user; }
    else { store.token=''; me=null; store.user=null; }
  }catch(e){
    if(e.status===401 || e.status===403){ store.token=''; me=null; store.user=null; }
  }
}

// ---------------- 顶栏/导航 ----------------
function renderTop(){
  const ub = document.querySelector('.userbox');
  const box = ub || document.createElement('div');
  if(!ub){ box.className='userbox'; document.querySelector('.topbar .inner').appendChild(box); }
  if(me){
    box.innerHTML = `<a href="#/me">${esc(me.username)}${me.is_admin?' <b>(管理)</b>':''}</a><a href="javascript:;" id="logoutBtn">退出</a>`;
    $('logoutBtn').onclick = doLogout;
  }else{
    box.innerHTML = `<a href="javascript:;" id="loginLink">登录</a><a href="javascript:;" id="regLink">注册</a>`;
    $('loginLink').onclick = ()=>openAuth('login');
    $('regLink').onclick = ()=>openAuth('register');
  }
}
function renderNav(active){
  $('nav').innerHTML = `<a href="#/" class="${active==='home'?'on':''}">首页</a>` +
    boards.map(b=>`<a href="#/b/${b.slug}" class="${active===b.slug?'on':''}">${esc(b.name)}</a>`).join('') +
    `<a href="ai.html">AI小智</a><a href="ascii.html">ASCII工具</a><a href="privacy.html">协议</a>` + (me&&me.is_admin?`<a href="admin.html">追踪</a>`:``);
}
async function loadBoards(force){
  if(!force && boards.length) return boards;
  const now = Date.now();
  if(!force){
    try{ const raw=localStorage.getItem('forum_boards'); if(raw){ const c=JSON.parse(raw); if(now-c.t<60000 && c.d){ boards=c.d; return boards; } } }catch(e){}
  }
  try{ const j = await req('?action=boards'); boards = j.boards||[]; localStorage.setItem('forum_boards', JSON.stringify({t:now,d:boards})); }catch(e){}
  return boards;
}

// ---------------- 路由 ----------------
function parseHash(){
  const h = location.hash.replace(/^#/,'') || '/';
  const [path, query] = h.split('?');
  const q = new URLSearchParams(query||'');
  const seg = path.split('/').filter(Boolean);
  return {seg, q};
}
async function route(){
  const {seg,q} = parseHash();
  window.scrollTo(0,0);
  try{
    if(seg[0]==='b'){ await loadBoards(); renderNav(seg[1]); return topicList(seg[1], q); }
    if(seg[0]==='t'){ await loadBoards(); renderNav(''); return thread(seg[1], q); }
    if(seg[0]==='u'){ await loadBoards(); renderNav(''); return profile(seg[1]); }
    if(seg[0]==='me'){ await loadBoards(); renderNav(''); return meCenter(q.get('tab')||'info'); }
    if(seg[0]==='search'){ await loadBoards(); renderNav(''); return searchPage(q.get('q')||''); }
    return home();
  }catch(e){ app.innerHTML = `<div class="panel"><div class="panel-bd err">加载失败：${esc(e.message)}</div></div>`; }
}
window.addEventListener('hashchange', route);

// ---------------- 首页：版块列表 ----------------
async function home(){
  await loadBoards(true);
  renderNav('home');
  const rows = boards.map(b=>`
    <tr>
      <td class="col-bd">
        <div class="bd-name"><a href="#/b/${esc(b.slug)}">${esc(b.name)}</a></div>
        <div class="bd-desc">${esc(b.description)}</div>
      </td>
      <td class="col-num">${b.topic_count}</td>
      <td class="col-num">${b.reply_count}</td>
      <td class="col-last">${b.last_post?`<a href="#/t/${b.last_post.id}">${esc((b.last_post.title||'').slice(0,14))}</a><br>${esc(b.last_post.author)} · ${fmt(b.last_post.at)}`:'<span class="muted">暂无</span>'}</td>
    </tr>`).join('');
  app.innerHTML = `
    <div class="crumb">当前位置：<a href="#/">首页</a></div>
    <div class="panel">
      <div class="panel-hd">版块列表</div>
      <table>
        <thead><tr><th class="col-bd">版块</th><th class="col-num">主题</th><th class="col-num">帖数</th><th class="col-last">最后发表</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="4" class="center muted">暂无版块</td></tr>'}</tbody>
      </table>
    </div>`;
}

// ---------------- 版块页：主题列表 ----------------
async function topicList(slug, q){
  const page = Math.max(1, parseInt(q.get('page')||'1',10));
  const sort = q.get('sort')==='hot'?'hot':'new';
  const j = await req(`?board=${encodeURIComponent(slug)}&page=${page}&sort=${sort}`);
  const b = j.board || {name:slug};
  const rows = (j.posts||[]).map(p=>`
    <tr>
      <td class="col-bd topic-title">
        ${p.is_sticky?'<span class="st">置顶</span>':''}${p.is_featured?'<span class="ft">精华</span>':''}
        <a href="#/t/${p.id}">${esc(p.title)}</a>
      </td>
      <td>${esc(p.author)}</td>
      <td class="col-num">${p.reply_count||0} / ${p.views||0}</td>
      <td class="col-last">${esc(p.last_reply_by||p.author)}<br>${fmt(p.last_reply_at||p.created_at)}</td>
    </tr>`).join('');
  const newBtn = me ? `<button class="btn right" id="newPostBtn">发表主题</button>` : `<span class="right muted">登录后可发帖</span>`;
  app.innerHTML = `
    <div class="crumb">当前位置：<a href="#/">首页</a> &raquo; <a href="#/b/${esc(b.slug||slug)}">${esc(b.name)}</a></div>
    <div class="panel">
      <div class="panel-hd">
        ${esc(b.name||slug)} <span class="muted">${esc(b.description||'')}</span>
        <span class="right" style="display:flex;gap:8px;align-items:center">
          <select id="sortSel" class="btn gray" style="padding:5px 8px">
            <option value="new"${sort==='new'?' selected':''}>最新</option>
            <option value="hot"${sort==='hot'?' selected':''}>最热</option>
          </select>
          ${newBtn}
        </span>
      </div>
      <table>
        <thead><tr><th class="col-bd">主题</th><th>作者</th><th class="col-num">回复/查看</th><th class="col-last">最后发表</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="4" class="center muted">本版还没有主题</td></tr>'}</tbody>
      </table>
      ${pager(j.page, j.pages, `#/b/${slug}?sort=${sort}`)}
    </div>`;
  $('sortSel').onchange = e=>location.hash = `#/b/${slug}?sort=${e.target.value}`;
  if($('newPostBtn')) $('newPostBtn').onclick = ()=>newPost(b.id, b.slug);
}

function pager(page, pages, base){
  if(pages<=1) return '';
  const sep = base.includes('?')?'&':'?';
  let h = '<div class="pager">';
  h += page>1 ? `<a href="${base}${sep}page=${page-1}">上一页</a>` : '<span class="dis">上一页</span>';
  const from = Math.max(1,page-2), to = Math.min(pages,from+4);
  for(let i=from;i<=to;i++) h += i===page ? `<span class="cur">${i}</span>` : `<a href="${base}${sep}page=${i}">${i}</a>`;
  h += page<pages ? `<a href="${base}${sep}page=${page+1}">下一页</a>` : '<span class="dis">下一页</span>';
  h += `<span class="dis">${page}/${pages}</span></div>`;
  return h;
}

// ---------------- 发帖 ----------------
function newPost(boardId, slug){
  const opts = boards.map(b=>`<option value="${b.id}"${b.id===boardId?' selected':''}>${esc(b.name)}</option>`).join('');
  app.innerHTML = `
    <div class="crumb">当前位置：<a href="#/">首页</a> &raquo; <a href="#/b/${esc(slug)}">${esc(slug)}</a> &raquo; 发表主题</div>
    <div class="panel">
      <div class="panel-hd">发表新主题</div>
      <div class="panel-bd">
        <div class="field"><label>版块</label><select id="npBoard">${opts}</select></div>
        <div class="field"><label>标题</label><input id="npTitle" maxlength="120"></div>
        <div class="field"><label>内容</label><textarea id="npBody" maxlength="20000"></textarea></div>
        <div class="err" id="npErr"></div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn gray" id="npCancel">返回</button>
          <button class="btn right" id="npSubmit">发表</button>
        </div>
      </div>
    </div>`;
  $('npCancel').onclick = ()=>history.back();
  $('npSubmit').onclick = async ()=>{
    const title=$('npTitle').value.trim(), body=$('npBody').value.trim(), board_id=$('npBoard').value;
    const e=$('npErr'); e.textContent='';
    if(!title||!body){ e.textContent='标题和内容都要填'; return; }
    $('npSubmit').disabled=true;
    try{ const r=await req('',{method:'POST',body:{action:'post',board_id,title,body}}); toast('发表成功'); location.hash='#/t/'+r.post.id; }
    catch(err){ e.textContent=err.message; $('npSubmit').disabled=false; }
  };
}

// ---------------- 主题（楼层） ----------------
async function thread(id, q){
  const page = Math.max(1, parseInt(q.get('page')||'1',10));
  const j = await req(`?post_id=${encodeURIComponent(id)}&page=${page}`);
  const p = j.post;
  const canMod = !!p.canMod;
  const floor1 = `
    <div class="post">
      <div class="pu">
        ${userCell(p.user, p.author)}
      </div>
      <div class="pc">
        <div class="hd"><b>楼主</b><span>${fmt(p.created_at)}</span>${p.updated_at?`<span class="muted">（编辑于 ${fmt(p.updated_at)}）</span>`:''}<span class="floor">1楼</span></div>
        <div class="body">${esc(p.body)}</div>
        ${p.user&&p.user.signature?`<div class="sig">签名：${esc(p.user.signature)}</div>`:''}
        <div class="acts">
          <a href="javascript:;" class="quoteBtn" data-floor="1">引用</a>

      </div>

  const rows = (j.replies||[]).map(r=>`

      <div class="pu">${userCell(r.user, r.author)}</div>

          <a href="javascript:;" class="quoteBtn" data-floor="${r.floor}" data-id="${r.id}" data-author="${esc(r.author)}">引用</a>
          ${r.canDelete?`<a href="javascript:;" class="delReply" data-id="${r.id}">删除</a>`:''}
        </div>
      </div>
    </div>`).join('');

    <div class="panel">
      <div class="panel-hd">发表回复</div>
      <div class="panel-bd">
        <div id="quoteBox" class="hidden quote" style="background:#f5f8fb;border-left:3px solid #cfd8e3;padding:6px 10px;margin-bottom:8px;color:#777"></div>
        <div class="field"><textarea id="rpBody" maxlength="3000" placeholder="输入回复内容…"></textarea></div>
        <div class="err" id="rpErr"></div>
        <div class="toolbar" style="margin-top:8px"><button class="btn right" id="rpSubmit">发表回复</button></div>
      </div>
    </div>` : `<div class="panel"><div class="panel-bd center muted">请先登录后回复</div></div>`;

  app.innerHTML = `
    <div class="crumb">当前位置：<a href="#/">首页</a> &raquo; <a href="#/t/${p.id}">主题</a></div>
    <div class="panel">
      <div class="panel-hd">
        ${p.is_sticky?'<span class="st">置顶</span>':''}${p.is_featured?'<span class="ft">精华</span>':''}
        ${esc(p.title)}
        <span class="right muted">回复 ${p.reply_count||0} · 查看 ${(p.views||0)+1}</span>
      </div>
      ${floor1}
      ${rows}
      ${pager(j.page, j.pages, `#/t/${id}`)}
    </div>
    ${replyBox}`;

  // 事件
  $('likeBtn').onclick = async ()=>{ if(!me) return openAuth('login'); try{ await req('',{method:'POST',body:{action:'like',post_id:p.id}}); route(); }catch(e){toast(e.message);} };
  if($('delPostBtn')) $('delPostBtn').onclick = async ()=>{ if(!confirm('确定删除该主题？'))return; try{ await req('',{method:'POST',body:{action:'delete_post',id:p.id}}); toast('已删除'); location.hash='#/'; }catch(e){toast(e.message);} };
  if($('editPostBtn')) $('editPostBtn').onclick = ()=>editPost(p);
  if($('stickyBtn')) $('stickyBtn').onclick = async ()=>{ try{ await req('',{method:'POST',body:{action:'mod_post',id:p.id,field:'sticky',value:!p.is_sticky}}); toast('已更新'); route(); }catch(e){toast(e.message);} };
  if($('featBtn')) $('featBtn').onclick = async ()=>{ try{ await req('',{method:'POST',body:{action:'mod_post',id:p.id,field:'feature',value:!p.is_featured}}); toast('已更新'); route(); }catch(e){toast(e.message);} };
  document.querySelectorAll('.delReply').forEach(a=>a.onclick=async()=>{ if(!confirm('删除该回复？'))return; try{ await req('',{method:'POST',body:{action:'delete_reply',id:a.dataset.id}}); toast('已删除'); route(); }catch(e){toast(e.message);} });
  document.querySelectorAll('.quoteBtn').forEach(a=>a.onclick=()=>{
    if(!me) return openAuth('login');
    const f=a.dataset.floor;
    const content = f==='1' ? p.body : (j.replies.find(r=>String(r.floor)===f)||{}).body||'';
    $('rpBody').value = `@${f==='1'?p.author:a.dataset.author} ：${content.slice(0,80)}\n` + ($('rpBody').value||'');
    $('rpBody').focus(); window.scrollTo(0,document.body.scrollHeight);
    if($('quoteBox')){ $('quoteBox').textContent='引用 '+ (f==='1'?p.author:a.dataset.author) +' 的第 '+f+' 楼'; $('quoteBox').classList.remove('hidden'); }
  });
  if($('rpSubmit')) $('rpSubmit').onclick = async ()=>{
    const body=$('rpBody').value.trim(); const e=$('rpErr'); e.textContent='';
    if(!body){ e.textContent='回复内容不能为空'; return; }
    $('rpSubmit').disabled=true;
    try{ await req('',{method:'POST',body:{action:'reply',post_id:p.id,body}}); toast('回复成功'); route(); }
    catch(err){ e.textContent=err.message; $('rpSubmit').disabled=false; }
  };
}
function userCell(u, fallback){
  const name = u?u.username:fallback;
  const av = u&&u.avatar ? `<img class="av" src="${esc(u.avatar)}">` : `<img class="av">`;
  const link = u?`<a href="#/u/${u.id}">${esc(name)}</a>`:esc(name);
  return `${av}<div class="nm">${link}</div><div class="lv">${level(u&&u.post_count)}</div>
    <div class="info">帖子：${u?u.post_count:'-'}<br>注册：${u?fmtD(u.created_at):'-'}${u&&u.is_admin?'<br><b>管理员</b>':''}</div>`;
}

    const f=e.target.files[0]; if(!f) return;

let authMode='login', captchaId='';
function openAuth(mode){
  authMode=mode; $('authModal').classList.remove('hidden'); $('authErr').textContent='';
  $('authTitle').textContent = mode==='login'?'登录':'注册';
  $('tabLogin').classList.toggle('on',mode==='login'); $('tabReg').classList.toggle('on',mode==='register');
  $('authOk').textContent = mode==='login'?'登录':'注册';
  loadCaptcha();
}
$('tabLogin').onclick=()=>openAuth('login');
$('tabReg').onclick=()=>openAuth('register');
$('authCancel').onclick=()=>$('authModal').classList.add('hidden');
$('capImg').onclick=loadCaptcha;
async function loadCaptcha(){
  captchaId=''; $('auCap').value='';
  try{ const j=await req('?action=captcha'); captchaId=j.id; $('capImg').src=j.image; }
  catch(e){ $('authErr').textContent='验证码加载失败'; }
}
$('authOk').onclick = async ()=>{
  const username=$('auUser').value.trim(), password=$('auPass').value, captcha_code=$('auCap').value.trim();
  const e=$('authErr'); e.textContent='';
  if(!username||!password){ e.textContent='用户名和密码都要填'; return; }
  if(!captcha_code){ e.textContent='请输入验证码'; return; }
  $('authOk').disabled=true;
  try{
    const j = await req('',{method:'POST',body:{action:authMode,username,password,captcha_id:captchaId,captcha_code}});
    store.token=j.token; me=j.user; store.user=j.user;
    $('authModal').classList.add('hidden'); $('auPass').value='';
    renderTop(); toast(authMode==='login'?'登录成功':'注册成功'); route();
  }catch(err){ e.textContent=err.message; loadCaptcha(); }
  finally{ $('authOk').disabled=false; }
};
async function doLogout(){
  try{ await req('',{method:'POST',body:{action:'logout'}}); }catch{}
  store.token=''; me=null; store.user=null; renderTop(); toast('已退出'); location.hash='#/'; route();
}

$('topSearch').addEventListener('keydown',e=>{ if(e.key==='Enter') $('topSearchBtn').click(); });

(async ()=>{ await validateSession(); renderTop(); await loadBoards(); route(); })();
