<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>论坛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--acc:#388bfd;--ok:#3fb950;--bad:#f85149;--qq:#12b7f5}
body{font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;cursor:pointer;white-space:nowrap}
h1:hover{color:var(--acc)}
.hdr-user{display:flex;align-items:center;gap:10px;font-size:13px}
.hdr-user b{color:var(--acc)}
.hdr-user img{width:24px;height:24px;border-radius:50%;object-fit:cover}
input,textarea,select,button{font-family:inherit;font-size:14px}
input,textarea,select{width:100%;background:#0d1117;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:88px}
button{background:var(--acc);border:0;border-radius:8px;padding:9px 15px;color:#fff;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button.qq{background:var(--qq);width:100%}
button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);padding:5px 10px;font-size:12px}
button.like{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:6px 12px}
button.like.on{border-color:var(--acc);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:15px;margin-bottom:12px}
.post{cursor:pointer;transition:.15s}
.post:hover{border-color:var(--acc)}
.post h3{font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--mut)}
.body{white-space:pre-wrap;word-break:break-word;margin:9px 0}
.tag{background:#1f6feb22;color:var(--acc);border:1px solid #1f6feb55;border-radius:6px;padding:1px 8px;font-size:12px}
.likes-badge{color:var(--mut);font-size:12px;margin-left:auto}
.form{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:9px;justify-content:flex-end;align-items:center}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:150px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:transparent;border:1px solid var(--bd);color:var(--mut);padding:6px 13px;border-radius:20px;font-size:13px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hidden{display:none}
.empty{color:var(--mut);text-align:center;padding:36px 0}
.reply{border-left:3px solid var(--bd);padding-left:12px;margin-bottom:12px}
.reply .body{margin:4px 0}
.reply-head{display:flex;align-items:center;gap:10px}
.back{background:none;color:var(--mut);padding:6px 0;font-size:13px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{width:100%;max-width:360px;margin:0}
.seg{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--mut);border-radius:0}
.seg button.on{background:var(--acc);color:#fff}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:4px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--bd)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home">📋 论坛</h1>
    <div class="hdr-user" id="hdrUser"></div>
  </header>

  <section id="listView">
    <div class="toolbar">
      <input id="qBox" placeholder="搜索标题或内容…">
      <select id="sortBox" style="width:110px"><option value="new">最新</option><option value="hot">最热</option></select>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="composeCard">
      <div class="form">
        <input id="newTitle" placeholder="标题" maxlength="120">
        <textarea id="newBody" placeholder="内容…" maxlength="5000"></textarea>
        <div class="row">
          <select id="newCat" style="width:130px"></select>
          <button id="postBtn">发布</button>
        </div>
        <div class="err" id="listErr"></div>
      </div>
    </div>
    <div id="posts"></div>
  </section>

  <section id="detailView" class="hidden">
    <button class="back" id="back">← 返回列表</button>
    <div class="card" id="detailCard"></div>
    <div class="card" id="replyCard">
      <div class="form">
        <textarea id="replyBody" placeholder="回复…" maxlength="3000"></textarea>
        <div class="row"><button id="replyBtn">回复</button></div>
        <div class="err" id="replyErr"></div>
      </div>
    </div>
    <div id="replies"></div>
  </section>
</div>

<div class="modal hidden" id="authModal">
  <div class="card">
    <div class="seg">
      <button id="segLogin" class="on">登录</button>
      <button id="segReg">注册</button>
    </div>
    <div class="form">
      <input id="auUser" placeholder="用户名（3-20位）" maxlength="20">
      <input id="auPass" type="password" placeholder="密码（至少6位）">
      <div class="row"><button class="ghost" id="authCancel">取消</button><button id="authOk">确定</button></div>
      <div class="divider">或</div>
      <button class="qq" id="qqBtn">使用 QQ 登录 / 注册</button>
      <div class="err" id="authErr"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleString('zh-CN',{hour12:false});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

const store = {
  get token(){return localStorage.getItem('forum_token')||'';},
  set token(v){v?localStorage.setItem('forum_token',v):localStorage.removeItem('forum_token');},
  get user(){try{return JSON.parse(localStorage.getItem('forum_user')||'null');}catch{return null;}},
  set user(u){u?localStorage.setItem('forum_user',JSON.stringify(u)):localStorage.removeItem('forum_user');}
};
let me = store.user;
let state = {category:'', q:'', sort:'new', categories:[]};
let currentPost = null;
let authMode = 'login';

async function req(path, opts={}){
  const headers = opts.body ? {'Content-Type':'application/json'} : {};
  if(store.token) headers['Authorization'] = 'Bearer '+store.token;
  const r = await fetch(API+path, {method:opts.method||'GET', headers, body:opts.body?JSON.stringify(opts.body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

function renderHeader(){
  if(me){
    const av = me.avatar ? `<img src="${esc(me.avatar)}" alt="">` : '';
    const tag = me.provider==='qq' ? ' <span class="tag">QQ</span>' : '';
    $('hdrUser').innerHTML = `${av}<span>你好，<b>${esc(me.username)}</b></span>${tag}<button class="ghost" id="logoutBtn">退出</button>`;
    $('logoutBtn').onclick = doLogout;
  }else{
    $('hdrUser').innerHTML = `<button class="ghost" id="loginBtn">登录 / 注册</button>`;
    $('loginBtn').onclick = ()=>openAuth('login');
  }
  $('composeCard').classList.toggle('hidden', !me);
  $('replyCard').classList.toggle('hidden', !me);
}

function renderTabs(){
  const cats = ['全部', ...state.categories];
  $('tabs').innerHTML = cats.map(c=>{
    const val = c==='全部' ? '' : c;
    return `<button class="tab ${state.category===val?'on':''}" data-cat="${esc(val)}">${esc(c)}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;renderTabs();loadPosts();});
  $('newCat').innerHTML = state.categories.map(c=>`<option>${esc(c)}</option>`).join('');
}

function openAuth(mode){
  authMode = mode;
  $('authModal').classList.remove('hidden');
  $('authErr').textContent='';
  $('segLogin').classList.toggle('on', mode==='login');
  $('segReg').classList.toggle('on', mode==='register');
  $('authOk').textContent = mode==='login' ? '登录' : '注册';
}
$('segLogin').onclick=()=>openAuth('login');
$('segReg').onclick=()=>openAuth('register');
$('authCancel').onclick=()=>$('authModal').classList.add('hidden');

async function doAuth(){
  const username=$('auUser').value.trim(), password=$('auPass').value;
  const err=$('authErr'); err.textContent='';
  if(!username||!password){err.textContent='用户名和密码都要填';return;}
  $('authOk').disabled=true;
  try{
    const j = await req('', {method:'POST', body:{action:authMode, username, password}});
    store.token = j.token; me = j.user; store.user = j.user;
    $('authModal').classList.add('hidden'); $('auPass').value='';
    renderHeader(); toast(authMode==='login'?'登录成功':'注册成功'); loadPosts();
    if(currentPost) openPost(currentPost);
  }catch(e){ err.textContent = e.message; }
  finally{ $('authOk').disabled=false; }
}
$('authOk').onclick = doAuth;

// ---------------- QQ 登录 ----------------
function currentRedirect(){
  return location.origin + location.pathname.replace(/index\.html$/,'');
}
async function doQqLogin(){
  const err=$('authErr'); err.textContent='';
  $('qqBtn').disabled=true;
  try{
    const redirect = currentRedirect();
    const j = await req('?action=qq_start&redirect='+encodeURIComponent(redirect));
    location.href = j.authorize_url;   // 跳转到 QQ 授权页
  }catch(e){ err.textContent = e.message || 'QQ 登录不可用'; $('qqBtn').disabled=false; }
}
$('qqBtn').onclick = doQqLogin;

async function handleQqCallback(){
  const sp = new URLSearchParams(location.search);
  const code = sp.get('code');
  if(!code) return;
  // 清掉地址栏里的 code
  history.replaceState({}, document.title, location.origin + location.pathname);
  try{
    const redirect = currentRedirect();
    const j = await req('', {method:'POST', body:{action:'qq_login', code, redirect_uri: redirect}});
    store.token = j.token; me = j.user; store.user = j.user;
    renderHeader(); toast('QQ 登录成功'); loadPosts();
  }catch(e){
    toast('QQ 登录失败：'+e.message);
  }
}

async function doLogout(){
  try{ await req('', {method:'POST', body:{action:'logout'}}); }catch{}
  store.token=''; me=null; store.user=null;
  renderHeader(); toast('已退出'); loadPosts();
  if(currentPost){ currentPost=null; goHome(); }
}

async function loadPosts(){
  const box=$('posts'); box.innerHTML='<div class="empty">加载中…</div>';
  try{
    const p = new URLSearchParams();
    if(state.category) p.set('category', state.category);
    if(state.q) p.set('q', state.q);
    p.set('sort', state.sort);
    const j = await req('?'+p.toString());
    state.categories = j.categories || [];
    renderTabs();
    const posts = j.posts || [];
    if(!posts.length){ box.innerHTML='<div class="empty">还没有帖子'+(me?'，来发第一帖吧':'')+'</div>'; return; }
    box.innerHTML = posts.map(p=>`
      <div class="card post" data-id="${p.id}">
        <h3>${esc(p.title)} <span class="tag">${esc(p.category||'综合')}</span>
          <span class="likes-badge">❤ ${p.likes||0}</span></h3>
        <div class="meta">${esc(p.author)} · ${fmt(p.created_at)}</div>
        <div class="body">${esc((p.body||'').slice(0,150))}${(p.body||'').length>150?'…':''}</div>
      </div>`).join('');
    box.querySelectorAll('.post').forEach(el=>el.onclick=()=>openPost(el.dataset.id));
  }catch(e){ box.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function openPost(id){
  currentPost=id;
  $('listView').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  try{
    const j = await req('?post_id='+encodeURIComponent(id));
    const p = j.post;
    $('detailCard').innerHTML = `
      <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(p.title)} <span class="tag">${esc(p.category||'综合')}</span></h3>
      <div class="meta">${esc(p.author)} · ${fmt(p.created_at)}</div>
      <div class="body">${esc(p.body)}</div>
      <div class="row" style="justify-content:flex-start">
        <button class="like ${p.liked?'on':''}" id="likeBtn">❤ ${p.likes||0}</button>
        ${p.canDelete?'<button class="danger" id="delPostBtn">删除帖子</button>':''}
      </div>`;
    renderHeader();
    $('likeBtn').onclick = doLike;
    if(p.canDelete) $('delPostBtn').onclick = ()=>doDeletePost(p.id);
    renderReplies(j.replies||[]);
  }catch(e){ $('detailCard').innerHTML='<div class="err">加载失败：'+esc(e.message)+'</div>'; $('replies').innerHTML=''; }
}

function renderReplies(list){
  const box=$('replies');
  if(!list.length){ box.innerHTML='<div class="empty">暂无回复</div>'; return; }
  box.innerHTML = list.map(r=>`
    <div class="card reply">
      <div class="reply-head"><div class="meta">${esc(r.author)} · ${fmt(r.created_at)}</div>
        ${r.canDelete?`<button class="danger" data-del="${r.id}" style="margin-left:auto">删除</button>`:''}</div>
      <div class="body">${esc(r.body)}</div>
    </div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>doDeleteReply(b.dataset.del));
}

async function doLike(){
  if(!me){ toast('请先登录'); openAuth('login'); return; }
  try{ await req('', {method:'POST', body:{action:'like', post_id:currentPost}}); openPost(currentPost); }
  catch(e){ toast(e.message); }
}

async function createPost(){
  const title=$('newTitle').value.trim(), body=$('newBody').value.trim(), category=$('newCat').value;
  const err=$('listErr'); err.textContent='';
  if(!title||!body){err.textContent='标题和内容都要填';return;}
  $('postBtn').disabled=true;
  try{ await req('',{method:'POST',body:{action:'post',title,body,category}}); $('newTitle').value='';$('newBody').value=''; toast('发布成功'); loadPosts(); }
  catch(e){ err.textContent=e.message; }
  finally{ $('postBtn').disabled=false; }
}

async function createReply(){
  const body=$('replyBody').value.trim(); const err=$('replyErr'); err.textContent='';
  if(!body){err.textContent='回复内容不能为空';return;}
  $('replyBtn').disabled=true;
  try{ await req('',{method:'POST',body:{action:'reply',post_id:currentPost,body}}); $('replyBody').value=''; toast('回复成功'); openPost(currentPost); }
  catch(e){ err.textContent=e.message; }
  finally{ $('replyBtn').disabled=false; }
}

async function doDeletePost(id){
  if(!confirm('确定删除这个帖子？')) return;
  try{ await req('',{method:'POST',body:{action:'delete_post',id}}); toast('已删除'); goHome(); }
  catch(e){ toast(e.message); }
}
async function doDeleteReply(id){
  if(!confirm('确定删除这条回复？')) return;
  try{ await req('',{method:'POST',body:{action:'delete_reply',id}}); toast('已删除'); openPost(currentPost); }
  catch(e){ toast(e.message); }
}

function goHome(){ currentPost=null; $('detailView').classList.add('hidden'); $('listView').classList.remove('hidden'); renderHeader(); loadPosts(); }

$('postBtn').onclick=createPost;
$('replyBtn').onclick=createReply;
$('back').onclick=goHome;
$('home').onclick=goHome;
let qTimer;
$('qBox').oninput=e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{state.q=e.target.value.trim();loadPosts();},350);};
$('sortBox').onchange=e=>{state.sort=e.target.value;loadPosts();};
$('auPass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});

renderHeader();
handleQqCallback();
goHome();
</script>
</body>
</html>
