<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>私信与群聊</title>
<link rel="preconnect" href="https://jgwadmeqhzgzlkbbjcik.supabase.co" crossorigin>
<link rel="stylesheet" href="./theme.css">
<script src="./icons.js"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f7fc; --card:#fff; --soft:#f6f9fd; --soft2:#eef4ff;
  --ink:#22314a; --mut:#8896a8; --line:#e9eef6;
  --g1:#4f8cff; --g2:#35d0ba;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e141b; --card:#151c26; --soft:#1b242f; --soft2:#1d2a3b;
         --ink:#e7eef8; --mut:#8d9aac; --line:#26313f; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ic{display:inline-block;vertical-align:-4px}
/* 头 */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--g1),var(--g2));box-shadow:0 6px 20px rgba(79,140,255,.22)}
.top .in{max-width:1000px;margin:0 auto;padding:0 14px;height:56px;display:flex;align-items:center;gap:12px;color:#fff}
.top .ttl{font-weight:800;font-size:16.5px}
.top .acts{margin-left:auto;display:flex;gap:8px}
.ibtn{display:flex;align-items:center;gap:5px;background:#ffffff26;border:0;color:#fff;border-radius:16px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.ibtn:active{transform:scale(.95)}
/* 布局 */
.wrap{max-width:1000px;margin:14px auto;padding:0 14px;display:flex;gap:14px;align-items:stretch;height:calc(100vh - 84px)}
.pane{background:var(--card);border-radius:18px;box-shadow:0 4px 20px rgba(34,49,74,.06);display:flex;flex-direction:column;overflow:hidden}
.list{width:300px;flex:none}
.chatpane{flex:1;min-width:0}
.ph{padding:13px 16px;font-weight:800;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
/* 会话列表 */
.convs{flex:1;overflow-y:auto}
.conv{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.conv:hover{background:var(--soft)}
.conv.on{background:var(--soft2)}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.conv .m{flex:1;min-width:0}
.conv .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.conv .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bdg{background:#ff5d73;color:#fff;border-radius:10px;font-size:10.5px;font-weight:800;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px}
.bdg.at{background:#ffb020}
/* 聊天区 */
.chead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chead .bk{display:none;background:none;border:0;color:var(--mut);cursor:pointer;padding:4px}
.chead .ti{font-weight:800;font-size:14.5px}
.chead .sub{font-size:11.5px;color:var(--mut)}
.chead .ops{margin-left:auto;display:flex;gap:6px}
.obtn{background:var(--soft);border:0;border-radius:14px;padding:6px 11px;font-size:12px;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:600}
.ann{background:linear-gradient(120deg,#fff6e5,#ffeaf2);color:#8a5a1e;font-size:12.5px;padding:8px 14px;border-bottom:1px solid var(--line);display:none}
.ann.on{display:block}
@media (prefers-color-scheme: dark){ .ann{background:linear-gradient(120deg,#2a2216,#2b1b22);color:#e0b57a} }
.msgs{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.msg .bub{max-width:76%;background:var(--card);border-radius:16px 16px 16px 4px;padding:9px 13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(34,49,74,.05);font-size:14.5px}
.msg .who{font-size:11px;color:var(--mut);margin-bottom:3px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-radius:16px 16px 4px 16px;box-shadow:0 4px 14px rgba(79,140,255,.28)}
.msg .t{font-size:10.5px;color:var(--mut);margin-top:3px}
.inbar{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;background:var(--card)}
.inbar textarea{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:10px 14px;font-family:inherit;font-size:14.5px;resize:none;min-height:42px;max-height:110px;outline:none;color:var(--ink)}
.inbar textarea:focus{border-color:#bcd6ff;box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.send{border:0;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));cursor:pointer;box-shadow:0 6px 16px rgba(79,140,255,.3);flex:none}
.send:active{transform:scale(.93)}
.send:disabled{opacity:.5}
/* 弹窗 */
.modal{position:fixed;inset:0;background:#0b1520aa;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:80vh;border-radius:22px 22px 0 0;padding:18px 16px 24px;overflow-y:auto}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:12px}
.fld{margin-bottom:12px}
.fld label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:5px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:11px 13px;font-size:14.5px;font-family:inherit;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:#bcd6ff;box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft2);color:#2f6fe0;border-radius:16px;padding:5px 11px;font-size:12.5px;margin:3px}
.chip b{cursor:pointer;color:#e0245e}
.btn{border:0;border-radius:22px;padding:10px 20px;font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));cursor:pointer;font-family:inherit}
.btn.gray{background:var(--soft);color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) scale(.9);background:#22314a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.hide{display:none!important}
@media(max-width:820px){
  .wrap{height:calc(100vh - 76px);padding:0 10px;margin-top:10px}
  .list{width:100%}
  body.chatopen .list{display:none}
  body:not(.chatopen) .chatpane{display:none}
  .chead .bk{display:flex}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="ttl">私信</span>
  <span class="acts">
    <button class="ibtn" id="btnDm"></button>
    <button class="ibtn" id="btnGroup"></button>
  </span>
</div></div>

<div class="wrap">
  <div class="pane list">
    <div class="ph">会话</div>
    <div class="convs" id="convs"><div class="empty">加载中…</div></div>
  </div>
  <div class="pane chatpane">
    <div class="chead">
      <button class="bk" id="backBtn"></button>
      <div style="min-width:0">
        <div class="ti" id="cTitle">未选择会话</div>
        <div class="sub" id="cSub"></div>
      </div>
      <div class="ops">
        <button class="obtn hide" id="annBtn">公告</button>
        <button class="obtn hide" id="memBtn">成员</button>
      </div>
    </div>
    <div class="ann" id="annBar"></div>
    <div class="msgs" id="msgs"><div class="empty"><span style="color:#cfe0f7;display:block;margin-bottom:10px" id="emptyIco"></span>选择一个会话开始聊天</div></div>
    <div class="inbar">
      <textarea id="input" placeholder="说点什么…（@用户名 可提醒）" maxlength="1000" disabled></textarea>
      <button class="send" id="sendBtn" disabled></button>
    </div>
  </div>
</div>

<div class="modal hide" id="mDm"><div class="sheet">
  <h3>发起私信</h3>
  <div class="fld"><label>搜索用户名</label><input id="dmQ" placeholder="输入名字…"></div>
  <div id="dmRes"></div>
  <div style="text-align:right;margin-top:14px"><button class="btn gray" id="dmOff">关闭</button></div>
</div></div>

<div class="modal hide" id="mGroup"><div class="sheet">
  <h3>创建群聊</h3>
  <div class="fld"><label>群名称</label><input id="gTitle" maxlength="30" placeholder="给群起个名字"></div>
  <div class="fld"><label>群公告（可选）</label><input id="gAnn" maxlength="300" placeholder="一句话公告"></div>
  <div class="fld"><label>搜索并添加成员</label><input id="gQ" placeholder="输入名字…"></div>
  <div id="gChips"></div>
  <div id="gRes"></div>
  <div style="text-align:right;margin-top:14px">
    <button class="btn gray" id="gOff">取消</button>
    <button class="btn" id="gCreate" style="margin-left:8px">创建</button>
  </div>
</div></div>

<div class="modal hide" id="mAnn"><div class="sheet">
  <h3>群公告</h3>
  <div class="fld"><textarea id="annText" style="min-height:100px" maxlength="300"></textarea></div>
  <div style="text-align:right"><button class="btn gray" id="annOff">取消</button>
    <button class="btn" id="annSave" style="margin-left:8px">保存</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const API="https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const SB_URL="https://jgwadmeqhzgzlkbbjcik.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnd2FkbWVxaHpnemxrYmJqY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMTQ1NzIsImV4cCI6MjEwNzc5MDU3Mn0.IE9tXL2umU3Icg7b7vxxcKuRj_x4As1GbQodA1e8hmo";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>localStorage.getItem('forum_token')||'';
const me=(()=>{try{return JSON.parse(localStorage.getItem('forum_user')||'null');}catch(e){return null;}})();
const rel=t=>{const d=Date.now()-new Date(t).getTime();if(d<60000)return'刚刚';if(d<3600000)return Math.floor(d/60000)+'分钟前';if(d<86400000)return Math.floor(d/3600000)+'小时前';return new Date(t).toLocaleDateString('zh-CN');};
const hm=t=>new Date(t).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
const PALETTE=[['#4f8cff','#35d0ba'],['#ff8f70','#ff5d73'],['#a78bfa','#7c9dff'],['#fbbf24','#fb923c'],['#34d399','#22d3ee'],['#f472b6','#a78bfa']];
function grad(n){let h=0;for(const c of String(n||'?'))h=(h*31+c.charCodeAt(0))>>>0;const p=PALETTE[h%PALETTE.length];return `linear-gradient(135deg,${p[0]},${p[1]})`;}
function av(n,size){const st=size?`width:${size}px;height:${size}px;`:'';return `<div class="av" style="${st}background:${grad(n)}">${esc(String(n||'?').slice(0,1))}</div>`;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}

let sb=null;
function ensureSb(){return new Promise((res,rej)=>{ if(sb)return res(sb);
  if(window.supabase){sb=window.supabase.createClient(SB_URL,SB_ANON);return res(sb);}
  const s=document.createElement('script'); s.src='./lib/supabase.js';
  s.onload=()=>{sb=window.supabase.createClient(SB_URL,SB_ANON);res(sb);}; s.onerror=()=>rej(new Error('realtime加载失败'));
  document.head.appendChild(s); }); }

let cur=null, curInfo=null, channel=null, members=[], convs=[], gSel=[];

async function api(path,opts={}){
  const h={}; if(opts.body)h['Content-Type']='application/json';
  if(token())h['Authorization']='Bearer '+token();
  const r=await fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}

/* 顶部按钮 */
$('btnDm').innerHTML = icon('user',{size:15})+'<span>私信</span>';
$('btnGroup').innerHTML = icon('users',{size:15})+'<span>群聊</span>';
$('sendBtn').innerHTML = icon('send',{size:20});
$('backBtn').innerHTML = icon('back',{size:20});
$('emptyIco').innerHTML = icon('chat',{size:44});
$('btnDm').onclick=()=>{ $('mDm').classList.remove('hide'); $('dmQ').value=''; $('dmRes').innerHTML=''; };
$('btnGroup').onclick=()=>{ $('mGroup').classList.remove('hide'); $('gTitle').value=''; $('gAnn').value=''; $('gQ').value=''; gSel=[]; paintChips(); $('gRes').innerHTML=''; };
$('dmOff').onclick=()=>$('mDm').classList.add('hide');
$('gOff').onclick=()=>$('mGroup').classList.add('hide');
$('annOff').onclick=()=>$('mAnn').classList.add('hide');
$('backBtn').onclick=()=>{ document.body.classList.remove('chatopen'); cur=null; renderConvs(); };
[$('mDm'),$('mGroup'),$('mAnn')].forEach(m=>m.onclick=e=>{ if(e.target===m) m.classList.add('hide'); });

/* 会话列表 */
async function loadConvs(){
  try{ const j=await api('?action=conversations'); convs=j.conversations||[]; renderConvs(); }
  catch(e){ $('convs').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function renderConvs(){
  if(!convs.length){ $('convs').innerHTML='<div class="empty"><div style="color:#cfe0f7">'+icon('chat',{size:40})+'</div><p style="margin-top:10px">还没有会话<br>点右上角开始</p></div>'; return; }
  $('convs').innerHTML=convs.map(c=>`
    <div class="conv ${cur===c.id?'on':''}" data-id="${c.id}">
      ${av(c.type==='group'?'群':c.title)}
      <div class="m">
        <div class="n">${c.type==='group'?icon('users',{size:13}):''}${esc(c.title)}
          ${c.mention?`<span class="bdg at">@</span>`:''}</div>
        <div class="s">${c.last?esc(c.last.sender+': '+String(c.last.body).slice(0,16)):'暂无消息'}</div>
      </div>
      ${c.unread?`<span class="bdg">${c.unread>99?'99+':c.unread}</span>`:''}
    </div>`).join('');
  $('convs').querySelectorAll('.conv').forEach(el=>el.onclick=()=>openConv(el.dataset.id));
}

/* 打开会话 */
async function openConv(id){
  try{
    const j=await api('?action=messages&conv_id='+encodeURIComponent(id));
    cur=id; curInfo=j.conv; members=j.members||[];
    const meta=convs.find(x=>x.id===id);
    $('cTitle').textContent = meta?meta.title:(j.conv.title||'会话');
    $('cSub').textContent = j.conv.type==='group'? members.length+' 人' : '';
    const ann=j.conv.announcement||'';
    $('annBar').textContent = ann?('公告：'+ann):'';
    $('annBar').classList.toggle('on', !!ann);
    $('annBtn').classList.toggle('hide', !(j.conv.type==='group'&&j.conv.my_role==='owner'));
    $('memBtn').classList.toggle('hide', j.conv.type!=='group');
    $('input').disabled=false; $('sendBtn').disabled=false;
    $('msgs').innerHTML='';
    (j.messages||[]).forEach(m=>addMsg(m,false));
    scrollBottom();
    document.body.classList.add('chatopen');
    await api('',{method:'POST',body:{action:'mark_read',conv_id:id}});
    const c=convs.find(x=>x.id===id); if(c){c.unread=0;c.mention=0;renderConvs();}
    subscribe(id,j.conv.secret);
  }catch(e){ toast(e.message); }
}
function addMsg(m,rt){
  const box=$('msgs');
  if(box.querySelector('.empty')) box.innerHTML='';
  const mine=me&&m.sender_id===me.id;
  const d=document.createElement('div');
  d.className='msg'+(mine?' me':'');
  d.innerHTML=(mine?'':av(m.sender,32))+`
    <div style="max-width:100%">
      ${mine?'':`<div class="who">${esc(m.sender||'')}</div>`}
      <div class="bub">${esc(m.body)}</div>
      <div class="t">${hm(m.created_at)}</div>
    </div>`;
  box.appendChild(d);
  if(rt) scrollBottom();
}
function scrollBottom(){ const b=$('msgs'); b.scrollTop=b.scrollHeight; }

/* 实时 */
async function subscribe(convId,secret){
  try{
    if(channel&&sb){ try{await sb.removeChannel(channel);}catch(e){} channel=null; }
    await ensureSb();
    channel=sb.channel('conv:'+convId+':'+secret,{config:{broadcast:{self:false}}});
    channel.on('broadcast',{event:'msg'},({payload})=>{
      if(!payload||cur!==convId)return;
      if(payload.type==='announcement'){
        curInfo.announcement=payload.text||'';
        $('annBar').textContent=payload.text?('公告：'+payload.text):'';
        $('annBar').classList.toggle('on',!!payload.text); return;
      }
      addMsg(payload,true);
    });
    channel.subscribe();
  }catch(e){ console.warn('realtime不可用',e); }
}

/* 发送 */
$('sendBtn').onclick=async()=>{
  const v=$('input').value.trim(); if(!v||!cur)return;
  $('sendBtn').disabled=true;
  try{ const j=await api('',{method:'POST',body:{action:'send_message',conv_id:cur,body:v}});
    $('input').value=''; addMsg(j.message,true); loadConvs();
  }catch(e){ toast(e.message); }
  finally{ $('sendBtn').disabled=false; }
};
$('input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('sendBtn').click();} });

/* 新私信 */
let dmT;
$('dmQ').oninput=e=>{ clearTimeout(dmT); dmT=setTimeout(async()=>{
  const q=e.target.value.trim(); if(!q)return $('dmRes').innerHTML='';
  try{ const j=await api('?action=user_search&q='+encodeURIComponent(q));
    $('dmRes').innerHTML=(j.users||[]).map(u=>`<span class="chip" data-uid="${u.id}">${esc(u.username)}</span>`).join('')||'<div class="empty">没找到</div>';
    $('dmRes').querySelectorAll('[data-uid]').forEach(el=>el.onclick=async()=>{
      try{ const r=await api('',{method:'POST',body:{action:'open_dm',user_id:el.dataset.uid}});
        $('mDm').classList.add('hide'); await loadConvs(); openConv(r.conv_id);
      }catch(err){toast(err.message);} });
  }catch(err){toast(err.message);} },300); };

/* 新群聊 */
function paintChips(){
  $('gChips').innerHTML=gSel.map(u=>`<span class="chip">${esc(u.username)}<b data-rm="${u.id}">×</b></span>`).join('');
  $('gChips').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{gSel=gSel.filter(x=>x.id!==b.dataset.rm);paintChips();});
}
let gT;
$('gQ').oninput=e=>{ clearTimeout(gT); gT=setTimeout(async()=>{
  const q=e.target.value.trim(); if(!q)return $('gRes').innerHTML='';
  try{ const j=await api('?action=user_search&q='+encodeURIComponent(q));
    $('gRes').innerHTML=(j.users||[]).map(u=>`<span class="chip" data-add="${u.id}" data-name="${esc(u.username)}">+ ${esc(u.username)}</span>`).join('');
    $('gRes').querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{
      if(!gSel.find(x=>x.id===el.dataset.add)) gSel.push({id:el.dataset.add,username:el.dataset.name});
      paintChips(); });
  }catch(err){toast(err.message);} },300); };
$('gCreate').onclick=async()=>{
  const title=$('gTitle').value.trim(); if(!title)return toast('请填写群名称');
  try{ const j=await api('',{method:'POST',body:{action:'create_group',title,announcement:$('gAnn').value.trim(),member_ids:gSel.map(x=>x.id)}});
    $('mGroup').classList.add('hide'); await loadConvs(); openConv(j.conv_id);
  }catch(e){ toast(e.message); }
};

/* 公告 / 成员 */
$('annBtn').onclick=()=>{ $('annText').value=(curInfo&&curInfo.announcement)||''; $('mAnn').classList.remove('hide'); };
$('annSave').onclick=async()=>{
  try{ await api('',{method:'POST',body:{action:'set_announcement',conv_id:cur,text:$('annText').value.trim()}});
    $('mAnn').classList.add('hide'); openConv(cur);
  }catch(e){ toast(e.message); }
};
$('memBtn').onclick=()=>{ alert('群成员：\n'+members.map(m=>m.username).join('、')); };
