<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ASCII 动画转换器</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#eef1f5;color:#333;font-size:14px}
.top{background:#2b6cb0;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.top b{font-size:16px}
.top a{color:#dbe9f7;margin-left:auto;font-size:13px}
.wrap{max-width:1000px;margin:12px auto;padding:0 10px 40px}
.panel{background:#fff;border:1px solid #cfd8e3;border-radius:5px;margin-bottom:12px;overflow:hidden}
.panel-hd{background:#f5f8fb;border-bottom:1px solid #e1e8f0;padding:8px 12px;font-weight:700;font-size:14px}
.panel-bd{padding:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row+.row{margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#666}
select,input[type=range]{font-size:13px}
select{border:1px solid #cfd8e3;border-radius:3px;padding:5px 8px;background:#fff;color:#333}
input[type=range]{width:130px;vertical-align:middle}
.btn{display:inline-block;border:0;background:#2b6cb0;color:#fff;border-radius:3px;padding:7px 14px;cursor:pointer;font-size:13px}
.btn.gray{background:#e6ebf1;color:#333}
.drop{border:1px dashed #a9b8c9;border-radius:5px;padding:18px;text-align:center;color:#7a8a99;cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:#2b6cb0;background:#f4f8fd;color:#2b6cb0}
.stage{background:#fff;border:1px solid #cfd8e3;border-radius:5px;padding:8px;overflow:auto;max-height:72vh}
pre{font-family:"Courier New",Consolas,monospace;line-height:1;margin:0;color:#33404d;white-space:pre;font-size:8px;letter-spacing:0}
.stats{font-size:12px;color:#8a95a1;margin-top:6px}
.hint{font-size:12px;color:#8a95a1}
.hidden{display:none}
video{display:none}
</style>
</head>
<body>
<div class="top"><b>ASCII 动画转换器</b><a href="./">← 返回论坛</a></div>
<div class="wrap">

  <div class="panel">
    <div class="panel-hd">1. 选择素材</div>
    <div class="panel-bd">
      <div class="drop" id="drop">点击选择或拖拽文件到这里（支持 GIF / 图片 / 视频）</div>
      <input type="file" id="file" accept="image/*,video/*,.gif" class="hidden">
      <div class="stats" id="fileInfo">未选择文件</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd">2. 参数</div>
    <div class="panel-bd">
      <div class="row">
        <label class="f">字符风格
          <select id="preset">
            <option value="faithful">忠实原版（0/1 · .- · 空格）</option>
            <option value="ramp" selected>高清晰（ .:-=+*#%@ ）</option>
            <option value="block">方块（ ░▒▓█ ）</option>
          </select>
        </label>
        <label class="f">清晰度（步长 <span id="stepV">6</span>）
          <input type="range" id="step" min="2" max="16" step="1" value="6">
        </label>
        <label class="f">播放间隔 <span id="speedV">60</span> ms
          <input type="range" id="speed" min="20" max="300" step="10" value="60">
        </label>
        <label class="f">反色
          <select id="invert"><option value="0">否</option><option value="1">是</option></select>
        </label>
        <label class="f">&nbsp;<button class="btn gray" id="stopBtn">停止</button></label>
      </div>
      <div class="hint" style="margin-top:8px">提示：步长越小越清晰但越吃性能；视频会自动循环播放。</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd">3. 输出</div>
    <div class="panel-bd">
      <div class="stage"><pre id="out">等待素材…</pre></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

</div>
<video id="vid" muted loop playsinline></video>

<script type="module">
import { parseGIF, decompressFrames } from 'https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm';

const $ = id => document.getElementById(id);
const out = $('out'), stats = $('stats');
let timer = null;
let gifFrames = null, gifW = 0, gifH = 0, gifIndex = 0;
let video = $('vid'), vCanvas = document.createElement('canvas'), vCtx = vCanvas.getContext('2d', {willReadFrequently:true});
let imgData = null; // 静态图
let mode = 'none';

const PRESETS = {
  faithful: { type:'levels', levels: [["0","1"],[".","-"],[" "]] },
  ramp:     { type:'ramp', ramp: " .:-=+*#%@" },
  block:    { type:'ramp', ramp: " ░▒▓█" },
};

function pickChar(avg, preset){
  if(preset.type==='levels'){
    const L = preset.levels;
    const idx = Math.min(L.length-1, Math.floor(avg/255*L.length));
    const arr = L[idx];
    return arr[Math.floor(Math.random()*arr.length)];
  }
  const r = preset.ramp;
  const idx = Math.min(r.length-1, Math.floor(avg/255*(r.length-1)));
  return r[idx];
}

function pixelsToText(data, w, h, step, preset, inv){
  let s = '';
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      const i = (y*w+x)*4;
      let lum = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
      if(inv) lum = 255 - lum;
      s += pickChar(lum, preset);
    }
    s += '\n';
  }
  return s;
}

function render(data, w, h){
  const step = +$('step').value;
  const preset = PRESETS[$('preset').value];
  const inv = $('invert').value === '1';
  out.textContent = pixelsToText(data, w, h, step, preset, inv);
  stats.textContent = `尺寸 ${w}×${h} · 步长 ${step} · 字符画约 ${Math.ceil(w/step)}×${Math.ceil(h/step)} 字符`;
}

function clearTimer(){ if(timer){ clearInterval(timer); timer=null; } }

// ---- 图片 ----
function setupImage(img){
  const c=document.createElement('canvas'); c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height;
  const cx=c.getContext('2d',{willReadFrequently:true}); cx.drawImage(img,0,0);
  imgData = { data: cx.getImageData(0,0,c.width,c.height).data, w:c.width, h:c.height };
  mode='image'; clearTimer(); render(imgData.data, imgData.w, imgData.h);
}

// ---- GIF ----
async function setupGif(file){
  const buff = await file.arrayBuffer();
  const gif = parseGIF(buff);
  gifW = gif.lsd.width; gifH = gif.lsd.height;
  gifFrames = [];
  decompressFrames(gif, true).forEach(frame => {
    const c=document.createElement('canvas'); c.width=frame.dims.width; c.height=frame.dims.height;
    const cx=c.getContext('2d',{willReadFrequently:true});
    cx.putImageData(new ImageData(frame.patch, frame.dims.width, frame.dims.height),0,0);
    gifFrames.push({ patch: frame.patch, dw: frame.dims.width, dh: frame.dims.height, delay: frame.delay||60 });
  });
  // 逐帧合成到整幅画布再采样
  gifIndex = 0; mode='gif';
  drawGifFrame(0);
  const speed = +$('speed').value;
  clearTimer();
  timer = setInterval(()=>{
    if(!gifFrames || !gifFrames.length) return;
    gifIndex = (gifIndex + 1) % gifFrames.length;
    drawGifFrame(gifIndex);
  }, Math.max(20, +$('speed').value));
}
function drawGifFrame(i){
  const f = gifFrames[i];
  const full=document.createElement('canvas'); full.width=gifW; full.height=gifH;
  const fx=full.getContext('2d',{willReadFrequently:true});
  fx.putImageData(new ImageData(f.patch, f.dw, f.dh), 0, 0);
  const d = fx.getImageData(0,0,gifW,gifH).data;
  render(d, gifW, gifH);
}

// ---- 视频 ----
function setupVideo(file){
  video.src = URL.createObjectURL(file);
  video.play().catch(()=>{});
  mode='video';
  const loop = ()=>{
    if(mode!=='video') return;
    if(video.videoWidth){
      if(vCanvas.width!==video.videoWidth){ vCanvas.width=video.videoWidth; vCanvas.height=video.videoHeight; }
      vCtx.drawImage(video,0,0,vCanvas.width,vCanvas.height);
      const d = vCtx.getImageData(0,0,vCanvas.width,vCanvas.height).data;
      render(d, vCanvas.width, vCanvas.height);
    }
    setTimeout(loop, Math.max(20, +$('speed').value));
  };
  loop();
}

// ---- 文件入口 ----
$('drop').onclick = ()=>$('file').click();
$('drop').ondragover = e=>{ e.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = ()=>$('drop').classList.remove('on');
$('drop').ondrop = e=>{ e.preventDefault(); $('drop').classList.remove('on'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
$('file').onchange = e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

async function handleFile(file){
  clearTimer(); mode='none';
  $('fileInfo').textContent = `已选择：${file.name}（${(file.size/1024).toFixed(0)} KB）`;
  const t = file.type || '';
  if(/gif$/i.test(file.name) || t==='image/gif'){ await setupGif(file); return; }
  if(t.startsWith('video/')){ setupVideo(file); return; }
  if(t.startsWith('image/')){
    const img = new Image();
    img.onload = ()=>setupImage(img);
    img.src = URL.createObjectURL(file);
    return;
  }
  $('fileInfo').textContent = '不支持的文件类型';
}

// 参数变化即时生效
function rerender(){
  if(mode==='image' && imgData) render(imgData.data, imgData.w, imgData.h);
  else if(mode==='gif' && gifFrames) drawGifFrame(gifIndex);
  // video 由循环自动用新参数
}
$('step').oninput = e=>{ $('stepV').textContent = e.target.value; rerender(); };
$('speed').oninput = e=>{ $('speedV').textContent = e.target.value;
  if(mode==='gif' && gifFrames){ clearTimer(); timer=setInterval(()=>{ gifIndex=(gifIndex+1)%gifFrames.length; drawGifFrame(gifIndex); }, Math.max(20,+e.target.value)); }
};
$('preset').onchange = rerender;
$('invert').onchange = rerender;
$('stopBtn').onclick = ()=>{ clearTimer(); mode='none'; if(video){ video.pause(); } out.textContent='已停止'; };
</script>
</body>
</html>
