<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>社区</title>
<link rel="preconnect" href="https://jgwadmeqhzgzlkbbjcik.supabase.co" crossorigin>
<script src="./icons.js"></script>
<style>
:root{
  color-scheme:light;
  --ink:#22314a; --mut:#8896a8; --line:#e9eef6;
  --card:#fff; --bg:#f4f7fc; --soft:#f6f9fd; --soft2:#eef4ff;
  --g1:#4f8cff; --g2:#35d0ba;
  --hot:#ff5d73; --sun:#ffb020; --mint:#22c55e;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ic{display:inline-block;vertical-align:-4px}
/* 背景装饰 */
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;z-index:0}
.b1{width:320px;height:320px;background:#8fc2ff;top:-90px;left:-90px}
.b2{width:280px;height:280px;background:#8ef0d8;top:120px;right:-110px}
.b3{width:240px;height:240px;background:#ffe0a3;bottom:-80px;left:30%}
/* 顶栏 */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 20px rgba(79,140,255,.25)}
.top .in{max-width:1020px;margin:0 auto;padding:0 14px;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.5px}
.bell{position:relative;cursor:pointer;display:flex;padding:7px;border-radius:12px;transition:.2s}
.bell:active{transform:scale(.92)}
.bell .dot{position:absolute;top:0;right:0;background:var(--hot);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px;font-weight:700;box-shadow:0 0 0 2px #ffffff55}
.me-ava{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;box-shadow:0 0 0 2px #ffffff66;cursor:pointer}
.me-ava img{width:100%;height:100%;object-fit:cover}
/* 布局 */
.wrap{position:relative;z-index:1;max-width:1020px;margin:16px auto 90px;padding:0 14px;display:flex;gap:16px;align-items:flex-start}
.main{flex:1;min-width:0}
.side{width:268px;flex:none;display:flex;flex-direction:column;gap:14px}
/* 卡片 */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 4px 20px rgba(34,49,74,.06);overflow:hidden}
.card+.card,.post+.post{margin-top:14px}
.card-hd{padding:13px 16px 0;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
/* 问候卡 */
.hero{background:linear-gradient(135deg,#ffffff,#f2f8ff);padding:18px}
.hero .row1{display:flex;align-items:center;gap:12px}
.hero .hi{font-size:16px;font-weight:800}
.hero .sub{font-size:12px;color:var(--mut);margin-top:2px}
.lv{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(90deg,#ffd166,#ffb020);color:#7a4b00;font-weight:800;font-size:11.5px;padding:3px 9px;border-radius:20px}
.xp{margin-top:12px}
.xp .bar{height:9px;border-radius:9px;background:#e8eefb;overflow:hidden}
.xp .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#4f8cff,#35d0ba);transition:width .6s cubic-bezier(.2,.9,.3,1.4)}
.xp .txt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:5px}
.checkin{margin-top:14px;display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#fff4e5,#ffe9f0);border-radius:14px;padding:11px 13px}
.checkin .flame{font-size:0;color:#ff7a45}
.checkin .t{flex:1}
.checkin .t b{font-size:13px}
.checkin .t div{font-size:11.5px;color:#a06a3a;margin-top:1px}
.cbtn{border:0;border-radius:22px;padding:9px 18px;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(120deg,#ff9a3d,#ff6f61);color:#fff;box-shadow:0 6px 16px rgba(255,122,69,.35);transition:.15s}
.cbtn:active{transform:scale(.95)}
.cbtn.done{background:#e9eef6;color:#96a2b3;box-shadow:none}
/* 发布 */
.composer{padding:16px}
.composer .top-row{display:flex;gap:11px}
.composer textarea{flex:1;border:0;outline:none;resize:none;font-family:inherit;font-size:15px;line-height:1.6;min-height:64px;color:var(--ink)}
.composer textarea::placeholder{color:#b6c1cf}
.cbar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:11px;border-top:1px dashed var(--line)}
.tool{display:flex;align-items:center;gap:6px;border:0;background:#f1f5fb;color:#5c7ba3;border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.tool:active{transform:scale(.95)}
.pub{margin-left:auto;border:0;border-radius:22px;padding:9px 22px;font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(79,140,255,.35);cursor:pointer;transition:.15s}
.pub:active{transform:scale(.95)}
.pub:disabled{opacity:.55}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.previews .rm{position:relative}
.previews img{width:78px;height:78px;object-fit:cover;border-radius:12px}
.previews b{position:absolute;top:-6px;right:-6px;background:#22314a;color:#fff;border-radius:50%;width:19px;height:19px;line-height:18px;text-align:center;font-size:12px;cursor:pointer}
/* 动态卡 */
.post{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 20px rgba(34,49,74,.06);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{display:flex;gap:10px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pn{font-weight:800;font-size:14.5px}
.pt{color:var(--mut);font-size:11.5px;margin-top:1px}
.pb{margin-top:11px;white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:15px}
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px;margin-top:11px}
.pimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
.pacts{display:flex;gap:8px;margin-top:13px}
.pacts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--soft);border:0;border-radius:14px;padding:9px 0;color:#6f7f93;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.pacts button:active{transform:scale(.96)}
.pacts .like.liked{color:var(--hot);background:#fff0f3}
.pacts .like.liked svg{animation:pop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
/* 侧栏 */
.mini{padding:16px;text-align:center}
.mini .av{width:64px;height:64px;font-size:22px;margin:0 auto}
.mini .nm{font-weight:800;margin-top:9px;font-size:15px}
.mini .st{display:flex;margin-top:14px;background:var(--soft);border-radius:14px;overflow:hidden}
.mini .st>div{flex:1;padding:10px 0}
.mini .st b{display:block;font-size:16px;font-weight:800}
.mini .st span{font-size:11.5px;color:var(--mut)}
.sug{display:flex;align-items:center;gap:9px;padding:10px 16px;border-bottom:1px solid #f5f8fc}
.sug:last-child{border-bottom:0}
.sug .nm{flex:1;min-width:0}
.sug .nm div{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .nm span{font-size:11px;color:var(--mut)}
.fb{border:0;border-radius:16px;padding:6px 14px;font-size:12.5px;font-weight:800;cursor:pointer;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff}
.fb.on{background:#eef2f8;color:#9aa7b6}
/* 骨架屏 */
.sk{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 20px rgba(34,49,74,.06)}
.sk .l{height:12px;border-radius:8px;background:linear-gradient(90deg,#eef2f8,#f8fafd,#eef2f8);background-size:200% 100%;animation:sh 1.2s infinite}
.sk .l+.l{margin-top:9px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* 空状态 */
.empty{padding:44px 16px;text-align:center;color:var(--mut)}
.empty .ico{color:#cfe0f7;animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty p{margin-top:12px;font-size:13.5px}
/* 底栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#9aa7b6;padding:4px 0}
.tabbar a.on{color:var(--g1);font-weight:800}
/* 通知抽屉 */
.drawer{position:fixed;top:0;right:-390px;width:370px;max-width:94vw;height:100%;background:var(--card);z-index:60;transition:right .28s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(34,49,74,.12)}
.drawer.on{right:0}
.dhd{padding:16px;font-weight:800;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dhd .x{margin-left:auto;background:#f1f5fb;border:0;border-radius:12px;padding:6px;cursor:pointer;color:#6b7b8f;display:flex}
.dbd{flex:1;overflow-y:auto}
.ni{display:flex;gap:10px;padding:13px 16px;border-bottom:1px solid #f6f9fc;font-size:13.5px;align-items:flex-start}
.ni.un{background:#f5faff}
.ni .tx{flex:1;line-height:1.5}
.ni .tx b{font-weight:800}
.ni .pv{color:var(--mut);font-size:12px;margin-top:2px}
.ni .tm{font-size:11px;color:#a9b5c4;margin-top:3px}
.mask{position:fixed;inset:0;background:#22314a55;z-index:55;display:none}
.mask.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.9);background:#22314a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.hide{display:none!important}
@media(max-width:820px){
  .side{display:none}
  .tabbar{display:flex}
  .wrap{margin-bottom:80px}
  .top .in{height:52px}
}

/* 头衔 / 任务 / 表情 / 商店 */
.tchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;color:#fff;margin-left:6px;vertical-align:1px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rx{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 10px;font-size:12.5px;color:#7b8798;cursor:pointer;transition:.15s;font-family:inherit}
.rx:active{transform:scale(.93)}
.rx.on{background:var(--soft2);border-color:#bcd6ff;color:#2f6fe0;font-weight:700}
.rx span:empty{display:none}
.tasks{padding:4px 0}
.task{display:flex;align-items:center;gap:9px;padding:10px 16px;border-bottom:1px solid #f5f8fc}
.task:last-child{border-bottom:0}
.task .ti{width:32px;height:32px;border-radius:11px;background:#eef4ff;color:#4f8cff;display:flex;align-items:center;justify-content:center;flex:none}
.task.done .ti{background:#e8f8ef;color:#22c55e}
.task .tn{flex:1;min-width:0}
.task .tn b{font-size:12.5px;display:block}
.task .tn span{font-size:11px;color:var(--mut)}
.task .go{border:0;border-radius:14px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;background:linear-gradient(120deg,#ffb020,#ff8a3d);color:#fff;font-family:inherit}
.task .go:disabled{background:#eef2f8;color:#a9b5c4;cursor:default}
.modal{position:fixed;inset:0;background:#22314a66;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:78vh;border-radius:22px 22px 0 0;padding:18px 16px 24px;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.sheet .pts{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.titem{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.titem .nm{font-weight:800;font-size:13.5px}
.titem .cost{font-size:11.5px;color:var(--mut);margin:5px 0 9px}
.titem .buy{border:0;border-radius:16px;padding:7px 0;width:100%;font-size:12.5px;font-weight:800;cursor:pointer;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;font-family:inherit}
.titem .buy.own{background:#eef2f8;color:#8f9dae}
.exp-pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(120deg,#ffb020,#ff8a3d);color:#fff;font-weight:800;padding:10px 22px;border-radius:24px;z-index:95;animation:popup 1.1s ease forwards;pointer-events:none;box-shadow:0 8px 24px rgba(255,150,60,.4)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.05)}75%{opacity:1;transform:translate(-50%,-75%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(.95)}}

@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ink:#e7eef8; --mut:#8d9aac; --line:#26313f;
    --card:#151c26; --bg:#0e141b; --soft:#1b242f; --soft2:#1d2a3b;
  }
  body{background:var(--bg);color:var(--ink)}
  .blob{opacity:.22}
  .hero{background:linear-gradient(135deg,#182231,#131a24)}
  .checkin{background:linear-gradient(120deg,#2a2118,#2b1b22)}
  .checkin .t div{color:#d1a06a}
  .composer textarea{color:var(--ink)}
  .post,.card,.sk{background:var(--card)}
  .card-hd{background:transparent}
  .pt,.txt,.sub{color:var(--mut)}
  .pacts button{background:var(--soft)}
  .rx{background:var(--card);border-color:var(--line);color:var(--mut)}
  .rx.on{background:var(--soft2);border-color:#2f5fa8;color:#8ab8ff}
  .pacts .like.liked{background:#3a1f28}
  .mini .st{background:var(--soft)}
  .sug{border-color:var(--line)}
  .sk .l{background:linear-gradient(90deg,#1b242f,#22303f,#1b242f);background-size:200% 100%}
  .drawer{background:var(--card)}
  .dhd{border-color:var(--line)}
  .ni{border-color:var(--line)}
  .ni.un{background:#182231}
  .tabbar{background:#0e141bf2;border-color:var(--line)}
  .sheet{background:var(--card)}
  .titem{border-color:var(--line)}
  .titem .buy.own{background:var(--soft);color:var(--mut)}
  .empty{color:var(--mut)}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="top"><div class="in">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22"><path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><rect x="8.5" y="11.6" width="15" height="2.6" rx="1.3" fill="#4f8cff"/><rect x="8.5" y="16.6" width="10" height="2.6" rx="1.3" fill="#9ed8ff"/></svg>
    <span>社区</span>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <div class="bell" id="bellBtn"></div>
    <div class="me-ava" id="meAva"></div>
  </div>
</div></div>

<div class="wrap">
  <div class="main">
    <div class="card" id="heroCard"></div>

    <div class="card" style="margin-top:14px" id="composerCard">
      <div class="composer">
        <div class="top-row">
          <div class="av" id="myAva"></div>
          <textarea id="postInput" placeholder="今天有什么好玩的事？" maxlength="1000"></textarea>
        </div>
        <div class="previews" id="previews"></div>
        <div class="cbar">
          <button class="tool" id="imgBtn"></button>
          <input type="file" id="imgFile" accept="image/*" multiple class="hide">
          <span style="font-size:11.5px;color:var(--mut)" id="counter">0/1000</span>
          <button class="pub" id="pubBtn">发布</button>
        </div>
      </div>
    </div>

    <div id="feed" style="margin-top:14px"></div>
    <button class="pub hide" id="moreBtn" style="width:100%;margin-top:14px">加载更多</button>
  </div>

  <div class="side">
    <div class="card" id="meCard"></div>
    <div class="card">
      <div class="card-hd" style="padding-bottom:4px">每日任务</div>
      <div class="tasks" id="taskBox"><div class="empty" style="padding:18px">加载中…</div></div>
    </div>
    <div class="card">
      <div class="card-hd" style="padding-bottom:6px">推荐关注</div>
      <div id="sugBox"><div class="empty" style="padding:24px">加载中…</div></div>
    </div>
  </div>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dhd"><span>通知</span><button class="x" id="drawerX"></button></div>
  <div class="dbd" id="notifBox"><div class="empty">加载中…</div></div>
</div>
<div class="modal hide" id="shopModal"><div class="sheet">
  <h3 id="shopTitle">头衔商店</h3>
  <div class="pts" id="shopPts"></div>
  <div class="tgrid" id="shopGrid"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API = "https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = () => localStorage.getItem('forum_token') || '';
let me = (()=>{ try{ return JSON.parse(localStorage.getItem('forum_user')||'null'); }catch(e){ return null; } })();
let page = 1, totalPages = 1, pendingImages = [], unread = 0, myStreak = 0, myPoints = 0;

const REACTIONS = [
  {k:'love', ic:'heart', t:'喜欢'}, {k:'haha', ic:'haha', t:'哈哈'},
  {k:'wow', ic:'wow', t:'哇'}, {k:'cool', ic:'cool', t:'酷'},
  {k:'six', ic:'six', t:'666'}, {k:'sad', ic:'sad', t:'难过'}
];
const TCOLOR = {'萌新':'#9aa7b6','夜猫子':'#22c55e','段子手':'#fb923c','活跃分子':'#4f8cff','学霸':'#35d0ba','人气王':'#ff5d73','大佬':'#ffb020','传说':'#a78bfa'};
function titleChip(name){ return name ? `<span class="tchip" style="background:${TCOLOR[name]||'#8fa0b3'}">${esc(name)}</span>` : ''; }
function floatExp(text){
  const d = document.createElement('div'); d.className='exp-pop'; d.textContent = text;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1200);
}
const PALETTE = [['#4f8cff','#35d0ba'],['#ff8f70','#ff5d73'],['#a78bfa','#7c9dff'],['#fbbf24','#fb923c'],['#34d399','#22d3ee'],['#f472b6','#a78bfa']];
function grad(name){ let h=0; for(const c of String(name||'?')) h=(h*31+c.charCodeAt(0))>>>0; const p=PALETTE[h%PALETTE.length]; return `linear-gradient(135deg,${p[0]},${p[1]})`; }
function avatarHTML(u, size){
  const st = size? `width:${size}px;height:${size}px;` : '';
  if(u && u.avatar) return `<div class="av" style="${st}"><img src="${esc(u.avatar)}"></div>`;
  const n = (u && u.username) || '?';
  return `<div class="av" style="${st}background:${grad(n)}">${esc(n.slice(0,1))}</div>`;
}
const relTime = t => { const d = Date.now()-new Date(t).getTime();
  if(d<60000) return '刚刚'; if(d<3600000) return Math.floor(d/60000)+'分钟前';
  if(d<86400000) return Math.floor(d/3600000)+'小时前';
  if(d<2592000000) return Math.floor(d/86400000)+'天前';
  return new Date(t).toLocaleDateString('zh-CN'); };
function greet(){ const h=new Date().getHours();
  return h<6?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':h<23?'晚上好':'夜深了'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

async function api(path, opts={}){
  const h={}; if(opts.body) h['Content-Type']='application/json';
  if(token()) h['Authorization']='Bearer '+token();
  const r=await fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(j.error||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}

/* ---------- 顶部 ---------- */
function paintBell(){
  $('bellBtn').innerHTML = icon('bell',{size:21}) + (unread>0?`<i class="dot">${unread>99?'99+':unread}</i>`:'');
}
function paintTop(){
  paintBell();
  $('meAva').innerHTML = me && me.avatar ? `<img src="${esc(me.avatar)}">` : esc(me?me.username.slice(0,1):'?');
  $('meAva').style.background = me && me.avatar ? '' : grad(me?me.username:'?');
  $('meAva').onclick = ()=>{ location.href = me ? './?u='+encodeURIComponent(me.id) : './'; };
  $('myAva').innerHTML = me && me.avatar ? `<img src="${esc(me.avatar)}">` : esc(me?me.username.slice(0,1):'?');
  $('myAva').style.background = me && me.avatar ? '' : grad(me?me.username:'?');
  // 底栏
  $('tabbar').innerHTML = `
    <a href="./feed.html" class="on">${icon('home',{size:22})}<span>动态</span></a>
    <a href="./">${icon('forum',{size:22})}<span>论坛</span></a>
    <a href="./chat.html">${icon('chat',{size:22})}<span>私信</span></a>
    <a href="./ai.html">${icon('spark',{size:22})}<span>AI</span></a>
    <a href="./?u=${me?encodeURIComponent(me.id):''}">${icon('user',{size:22})}<span>我的</span></a>`;
}

/* ---------- 问候 + 经验 + 签到 ---------- */
function expOf(points, posts){ return (points||0) + (posts||0)*5; }
function levelOf(exp){ return 1 + Math.floor(exp/100); }
async function paintHero(){
  if(!me){ $('heroCard').innerHTML = `<div class="hero"><div class="hi">${greet()}，欢迎来到社区</div>
    <div class="sub">登录后可以发动态、点赞、关注朋友</div>
    <div style="margin-top:14px"><a class="cbtn" href="./" style="display:inline-block;text-decoration:none">去登录 / 注册</a></div></div>`; return; }
  let posts = me.post_count||0, followers=0, following=0;
  try{ const p = await api('?action=profile&id='+me.id); posts=p.user.post_count||0; followers=p.followers||0; following=p.following||0;
    myPoints = p.user.points||0; myStreak = p.user.streak||0;
  }catch(e){}
  const exp = expOf(myPoints, posts), lv = levelOf(exp), cur = exp%100;
  $('heroCard').innerHTML = `
    <div class="hero">
      <div class="row1">
        ${avatarHTML(me, 52)}
        <div style="flex:1;min-width:0">
          <div class="hi">${greet()}，${esc(me.username)}${titleChip(me.title_name)}</div>
          <div class="sub">今天也来分享点什么吧～</div>
        </div>
        <span class="lv">${icon('crown',{size:13,fill:true})} Lv.${lv}</span>
      </div>
      <div class="xp">
        <div class="bar"><div class="fill" style="width:${cur}%"></div></div>
        <div class="txt"><span>经验 ${cur}/100</span><span>距离 Lv.${lv+1}</span></div>
      </div>
      <div class="checkin">
        <span class="flame" style="color:#ff7a45">${icon('fire',{size:24,fill:true})}</span>
        <div class="t"><b>已连续签到 ${myStreak} 天</b><div>每天签到得经验，连签越多奖励越多</div></div>
        <button class="cbtn" id="checkinBtn">签到</button>
        <button class="cbtn" id="shopBtn" style="background:linear-gradient(120deg,#a78bfa,#7c9dff);font-size:12px;padding:8px 14px">头衔</button>
      </div>
    </div>`;
  if($('shopBtn')) $('shopBtn').onclick = openShop;
  $('checkinBtn').onclick = async ()=>{
    const b=$('checkinBtn'); b.disabled=true;
    try{
      const j = await api('',{method:'POST',body:{action:'checkin'}});
      if(j.already){ toast('今天已经签过啦'); b.textContent='已签到'; b.classList.add('done'); paintHero(); return; }
      toast(`签到成功 +${j.gained} 经验，连签 ${j.streak} 天`);
      floatExp('+'+j.gained+' 经验');
      myStreak = j.streak; myPoints = j.points; paintHero(); loadTasks();
    }catch(e){ toast(e.message); b.disabled=false; }
  };
  // 侧栏我的卡
  $('meCard').innerHTML = `<div class="mini">
    ${avatarHTML(me,64)}
    <div class="nm">${esc(me.username)}</div>
    <div style="font-size:11.5px;color:var(--mut);margin-top:3px">Lv.${lv}</div>
    <div class="st"><div><b>${following}</b><span>关注</span></div><div><b>${followers}</b><span>粉丝</span></div><div><b>${myPoints}</b><span>经验</span></div></div>
  </div>`;
}

/* ---------- 发布 ---------- */
$('imgBtn').innerHTML = icon('image',{size:17}) + '<span>图片</span>';
$('imgBtn').onclick = ()=>{ if(!me) return toast('请先登录'); $('imgFile').click(); };
$('postInput').addEventListener('input', e=>$('counter').textContent=e.target.value.length+'/1000');
$('imgFile').onchange = async e=>{
  const files=[...e.target.files].slice(0, 4-pendingImages.length);
  for(const f of files){
    if(f.size>2*1024*1024){ toast('图片不能超过 2MB'); continue; }
    try{
      const fd=new FormData(); fd.append('file',f); fd.append('kind','moment');
      $('imgBtn').innerHTML = icon('image',{size:17})+'<span>上传中…</span>';
      const r=await fetch(API,{method:'POST',headers:{'Authorization':'Bearer '+token()},body:fd});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'上传失败');
      pendingImages.push(j.url); paintPreviews();
    }catch(err){ toast(err.message); }
  }
  $('imgBtn').innerHTML = icon('image',{size:17})+'<span>图片</span>';
  e.target.value='';
};
function paintPreviews(){
  $('previews').innerHTML = pendingImages.map((u,i)=>`<div class="rm"><img src="${esc(u)}"><b data-i="${i}">×</b></div>`).join('');
  $('previews').querySelectorAll('b').forEach(b=>b.onclick=()=>{ pendingImages.splice(+b.dataset.i,1); paintPreviews(); });
}
$('pubBtn').onclick = async ()=>{
  if(!me) return toast('请先登录');
  const v=$('postInput').value.trim();
  if(!v) return toast('说点什么吧～');
  const b=$('pubBtn'); b.disabled=true; b.textContent='发布中…';
  try{
    await api('',{method:'POST',body:{action:'create_moment',content:v,images:pendingImages}});
    $('postInput').value=''; pendingImages=[]; paintPreviews(); $('counter').textContent='0/1000';
    page=1; await loadFeed(true); paintHero(); toast('发布成功！');
  }catch(e){ toast(e.message); }
  finally{ b.disabled=false; b.textContent='发布'; }
};

/* ---------- 每日任务 ---------- */
let taskData = null;
async function loadTasks(){
  if(!me) { $('taskBox').innerHTML='<div class="empty" style="padding:18px">登录后可做任务</div>'; return; }
  try{ taskData = await api('?action=tasks'); renderTasks(); }
  catch(e){ $('taskBox').innerHTML='<div class="empty" style="padding:18px">'+esc(e.message)+'</div>'; }
}
function renderTasks(){
  if(!taskData) return;
  const {tasks, progress, claimed} = taskData;
  const doneOf = t => t.key==='checkin' ? progress.checkin : t.key==='post' ? progress.posted : progress.likes >= t.need;
  $('taskBox').innerHTML = tasks.map(t=>{
    const done = doneOf(t), got = (claimed||[]).includes(t.key);
    const label = t.key==='like' ? `${Math.min(progress.likes,t.need)}/${t.need}` : (done?'已完成':'未完成');
    return `<div class="task ${done?'done':''}">
      <div class="ti">${icon(t.icon||'spark',{size:16})}</div>
      <div class="tn"><b>${esc(t.name)}</b><span>${label} · +${t.reward} 经验</span></div>
      <button class="go" data-k="${t.key}" ${(done && !got)?'':'disabled'}>${got?'已领':(done?'领取':'进行中')}</button>
    </div>`;
  }).join('');
  $('taskBox').querySelectorAll('.go').forEach(b=>b.onclick=()=>claimTask(b.dataset.k));
}
async function claimTask(k){
  try{ const j = await api('',{method:'POST',body:{action:'claim_task',key:k}});
    floatExp('+'+j.gained+' 经验'); toast('任务奖励已领取'); loadTasks(); paintHero();
  }catch(e){ toast(e.message); }
}

/* ---------- 头衔商店 ---------- */
async function openShop(){
  if(!me) return toast('请先登录');
  try{
    const j = await api('?action=shop');
    $('shopPts').textContent = '我的经验：' + j.points;
    $('shopGrid').innerHTML = j.titles.map(t=>{
      const own=(j.owned||[]).includes(t.id), cur=j.current===t.id;
      return `<div class="titem">
        <div class="nm" style="color:${t.color}">${esc(t.name)}</div>
        <div class="cost">${t.cost===0?'免费':t.cost+' 经验'}</div>
        <button class="buy ${own?'own':''}" data-id="${t.id}" ${own&&cur?'disabled':''}>${cur?'佩戴中':(own?'佩戴':'购买')}</button>
      </div>`;
    }).join('');
    $('shopGrid').querySelectorAll('.buy').forEach(b=>b.onclick=()=>buyOrEquip(b.dataset.id));
    $('shopModal').classList.remove('hide');
  }catch(e){ toast(e.message); }
}
$('shopModal').onclick = e=>{ if(e.target.id==='shopModal') $('shopModal').classList.add('hide'); };
async function buyOrEquip(id){
  try{
    const j = await api('',{method:'POST',body:{action:'buy_title',title_id:id}});
    me.title_name = j.title.name; me.title_id = id; localStorage.setItem('forum_user',JSON.stringify(me));
    floatExp('解锁「'+j.title.name+'」'); paintHero(); openShop(); toast('购买成功，已佩戴');
  }catch(e){
    if(/已经拥有/.test(e.message)){
      try{ const j = await api('',{method:'POST',body:{action:'equip_title',title_id:id}});
        me.title_name = j.title.name; me.title_id = id; localStorage.setItem('forum_user',JSON.stringify(me));
        paintHero(); openShop(); toast('已佩戴「'+j.title.name+'」');
      }catch(err){ toast(err.message); }
    } else toast(e.message);
  }
}

/* ---------- 动态流 ---------- */
function skeleton(){
  return `<div class="sk"><div style="display:flex;gap:10px;align-items:center"><div class="l" style="width:42px;height:42px;border-radius:50%"></div><div style="flex:1"><div class="l" style="width:40%"></div><div class="l" style="width:25%;margin-top:7px"></div></div></div><div class="l" style="margin-top:14px"></div><div class="l" style="width:70%"></div></div>`;
}
async function loadFeed(reset){
  if(!me){
    $('feed').innerHTML = `<div class="card"><div class="empty"><div class="ico">${icon('user',{size:46})}</div><p>登录后就能看到朋友们的动态啦</p><p style="margin-top:10px"><a class="cbtn" href="./" style="display:inline-block;text-decoration:none;padding:8px 20px">去登录</a></p></div></div>`;
    return;
  }
  if(reset){ page=1; $('feed').innerHTML = skeleton() + '<div style="height:14px"></div>' + skeleton(); }
  try{
    const j = await api('?action=feed&page='+page);
    totalPages = j.pages||1;
    const html = (j.posts||[]).map(postCard).join('');
    if(reset) $('feed').innerHTML = html || `<div class="card"><div class="empty"><div class="ico">${icon('spark',{size:46})}</div><p>还没有动态，来发第一条吧！</p></div></div>`;
    else $('feed').insertAdjacentHTML('beforeend', html);
    $('moreBtn').classList.toggle('hide', page>=totalPages);
    bindPosts();
  }catch(e){
    if(reset) $('feed').innerHTML = `<div class="card"><div class="empty"><p>加载失败：${esc(e.message)}</p></div></div>`;
  }
}
function postCard(p){
  const u = p.user || {username:p.author, avatar:null};
  const imgs = (p.images&&p.images.length) ? `<div class="pimgs">${p.images.map(s=>`<img src="${esc(s)}" loading="lazy">`).join('')}</div>` : '';
  return `<div class="post">
    <div class="ph">
      ${avatarHTML(u)}
      <div style="flex:1;min-width:0">
        <a class="pn" href="./?u=${encodeURIComponent(p.user_id||'')}">${esc(u.username||p.author)}</a>${titleChip(u.title_name)}
        <div class="pt">${relTime(p.created_at)}${p.kind==='topic'?' · 来自论坛':''}</div>
      </div>
    </div>
    <div class="pb">${esc(p.body)}</div>
    ${imgs}
    ${reactRow(p)}
    <div class="pacts">
      <button class="like ${p.liked?'liked':''}" data-id="${p.id}">${icon('heart',{size:18,fill:!!p.liked})}<span>${p.likes||0}</span></button>
      <button data-goto="${p.id}">${icon('comment',{size:18})}<span>${p.reply_count||0}</span></button>
      <button data-share="${p.id}">${icon('repeat',{size:18})}<span>分享</span></button>
    </div>
  </div>`;
}
function reactRow(p){
  const r = p.reactions || {counts:{}, mine:[]};
  const mine = r.mine||[], counts = r.counts||{};
  return `<div class="reacts" data-pid="${p.id}">` + REACTIONS.map(x=>{
    const n = counts[x.k]||0, on = mine.includes(x.k);
    return `<button class="rx ${on?'on':''}" data-k="${x.k}" title="${x.t}">${icon(x.ic,{size:17})}<span>${n>0?n:''}</span></button>`;
  }).join('') + `</div>`;
}
function bindPosts(){
  document.querySelectorAll('.like').forEach(b=>b.onclick=async()=>{
    if(!me) return toast('请先登录');
    try{
      const j = await api('',{method:'POST',body:{action:'like',post_id:b.dataset.id}});
      b.classList.toggle('liked', j.liked);
      b.innerHTML = icon('heart',{size:18,fill:j.liked}) + `<span>${j.likes}</span>`;
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('.reacts').forEach(box=>{
    box.querySelectorAll('.rx').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      if(!me) return toast('请先登录');
      try{
        const j = await api('',{method:'POST',body:{action:'react',post_id:box.dataset.pid,key:b.dataset.k}});
        box.querySelectorAll('.rx').forEach(x=>{
          const k=x.dataset.k, n=j.counts[k]||0;
          x.querySelector('span').textContent = n>0?n:'';
          x.classList.toggle('on', k===b.dataset.k ? j.active : x.classList.contains('on') && k!==b.dataset.k);
        });
        b.classList.toggle('on', j.active);
        if(j.active) b.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:320});
      }catch(err){ toast(err.message); }
    });
  });
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>location.href='./#/t/'+b.dataset.goto);
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    const url = location.origin + '/#/t/' + b.dataset.share;
    if(navigator.share) navigator.share({url}).catch(()=>{});
    else navigator.clipboard.writeText(url).then(()=>toast('链接已复制'));
  });
}
$('moreBtn').onclick = ()=>{ page++; loadFeed(false); };

/* ---------- 推荐关注 ---------- */
async function loadSuggest(){
  if(!me) return;
  try{
    const j = await api('?action=suggest_users');
    const us = j.users||[];
    if(!us.length){ $('sugBox').innerHTML='<div class="empty" style="padding:24px">暂时没有可推荐的人</div>'; return; }
    $('sugBox').innerHTML = us.map(u=>`<div class="sug">${avatarHTML(u,36)}
      <div class="nm"><div>${esc(u.username)}</div><span>${u.post_count||0} 条动态</span></div>
      <button class="fb" data-uid="${u.id}">关注</button></div>`).join('');
    $('sugBox').querySelectorAll('[data-uid]').forEach(b=>b.onclick=async()=>{
      try{ await api('',{method:'POST',body:{action:'follow',user_id:b.dataset.uid,value:true}});
        b.textContent='已关注'; b.classList.add('on'); toast('关注成功'); paintHero();
      }catch(e){ toast(e.message); }
    });
  }catch(e){ $('sugBox').innerHTML='<div class="empty" style="padding:24px">'+esc(e.message)+'</div>'; }
}

/* ---------- 通知 ---------- */
$('drawerX').innerHTML = icon('close',{size:18});
async function loadNotifs(){
  if(!me) return;
  try{
    const j = await api('?action=notifications');
    unread = j.unread||0; paintBell();
    const list = j.notifications||[];
    if(!list.length){ $('notifBox').innerHTML='<div class="empty"><div class="ico">'+icon('bell',{size:42})+'</div><p>还没有新通知</p></div>'; return; }
    const label={like:'赞了你的动态',reply:'回复了你',follow:'关注了你',mention:'提到了你'};
    const color={like:'#ff5d73',reply:'#4f8cff',follow:'#22c55e',mention:'#ffb020'};
    $('notifBox').innerHTML = list.map(n=>`<div class="ni ${n.is_read?'':'un'}">
      ${avatarHTML({username:n.actor_name,avatar:null},36)}
      <div class="tx"><b>${esc(n.actor_name||'某人')}</b> ${esc(label[n.type]||n.type)}
        ${n.preview?`<div class="pv">${esc(n.preview)}</div>`:''}
        <div class="tm">${relTime(n.created_at)}</div></div></div>`).join('');
  }catch(e){ $('notifBox').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function openDrawer(){
  $('drawer').classList.add('on'); $('mask').classList.add('on'); loadNotifs();
  if(unread>0&&me){ api('',{method:'POST',body:{action:'read_notifications'}}).then(()=>{unread=0;paintBell();}).catch(()=>{}); }
}
$('bellBtn').onclick = openDrawer;
$('mask').onclick = ()=>{ $('drawer').classList.remove('on'); $('mask').classList.remove('on'); };
$('drawerX').onclick = $('mask').onclick;

/* 启动 */
paintTop(); paintHero(); loadFeed(true); loadSuggest(); loadNotifs(); loadTasks();
setInterval(()=>{ if(me) loadNotifs(); }, 60000);
</script>
