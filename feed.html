<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>动态</title>
<link rel="preconnect" href="https://jgwadmeqhzgzlkbbjcik.supabase.co" crossorigin>
<script src="./icons.js"></script>
<style>
:root{color-scheme:light;--bd:#dbe2ea;--mut:#8a95a1;--acc:#2b6cb0;--bg:#eef1f5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#333;font-size:14px}
a{color:inherit;text-decoration:none}
.ic{display:inline-block;vertical-align:-4px}
.top{background:#2b6cb0;color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:1040px;margin:0 auto;padding:0 12px;height:48px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;cursor:pointer}
.tnav{display:flex;gap:4px;margin-left:6px}
.tnav a{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:6px;font-size:13px;color:#dbe9f7}
.tnav a:hover{background:#ffffff22;color:#fff}
.tnav a.on{background:#ffffff2e;color:#fff}
.tsearch{margin-left:auto;display:flex;align-items:center;background:#ffffff22;border-radius:18px;padding:5px 11px;gap:6px}
.tsearch input{background:none;border:0;color:#fff;outline:none;width:130px;font-size:13px}
.tsearch input::placeholder{color:#dbe9f7cc}
.bell{position:relative;cursor:pointer;padding:5px;border-radius:6px;display:flex}
.bell:hover{background:#ffffff22}
.bell .dot{position:absolute;top:1px;right:1px;background:#e74c3c;color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.ava{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#cfd8e3;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.wrap{max-width:1040px;margin:14px auto;padding:0 12px;display:flex;gap:14px;align-items:flex-start}
.col-main{flex:1;min-width:0}
.col-side{width:265px;flex:none;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.card+.card{margin-top:12px}
.card-hd{padding:9px 13px;background:#f7f9fc;border-bottom:1px solid #eef2f6;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.card-bd{padding:12px 13px}
/* 发布框 */
.composer{display:flex;gap:10px}
.composer textarea{flex:1;border:0;outline:none;resize:none;font-family:inherit;font-size:14.5px;min-height:62px;line-height:1.6}
.cbar{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:9px;border-top:1px solid #f0f3f7}
.cbtn{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:13px;padding:5px 8px;border-radius:6px}
.cbtn:hover{background:#eef4fb}
.cbtn:disabled{color:#b7c2ce;cursor:default}
.pub{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:7px 20px;font-size:13.5px;font-weight:600;cursor:pointer}
.pub:disabled{opacity:.5}
.previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.previews img{width:74px;height:74px;object-fit:cover;border-radius:7px;border:1px solid var(--bd)}
.previews .rm{position:relative}
.previews .rm b{position:absolute;top:-5px;right:-5px;background:#333;color:#fff;border-radius:50%;width:18px;height:18px;line-height:17px;text-align:center;font-size:12px;cursor:pointer}
/* 动态卡片 */
.post{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:13px;margin-top:12px}
.ph{display:flex;gap:9px;align-items:center}
.pn{font-weight:700;font-size:14px}
.pt{color:var(--mut);font-size:11.5px}
.pb{margin-top:9px;white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:14.5px}
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:9px}
.pimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.pacts{display:flex;gap:20px;margin-top:11px;padding-top:9px;border-top:1px solid #f2f5f8;color:#6b7785;font-size:13px}
.pacts button{display:flex;align-items:center;gap:5px;background:none;border:0;color:inherit;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:5px;font-family:inherit}
.pacts button:hover{background:#f2f6fb;color:var(--acc)}
.pacts button.liked{color:#e0245e}
/* 侧栏 */
.me-hd{display:flex;flex-direction:column;align-items:center;padding:16px 13px 10px;gap:8px}
.me-hd .ava{width:62px;height:62px;font-size:22px}
.stat{display:flex;width:100%;border-top:1px solid #f0f3f7;margin-top:6px}
.stat>div{flex:1;text-align:center;padding:9px 0;cursor:pointer}
.stat b{display:block;font-size:15px;color:#2b3a49}
.stat span{font-size:11.5px;color:var(--mut)}
.sug{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f6f8fb}
.sug:last-child{border-bottom:0}
.sug .nm{flex:1;min-width:0}
.sug .nm div{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .nm span{font-size:11px;color:var(--mut)}
.fbtn{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.fbtn.on{background:#eef4fb;border-color:#cfe0f7;color:#8a95a1}
/* 通知抽屉 */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100%;background:#fff;box-shadow:-4px 0 18px #0002;z-index:60;transition:right .25s;display:flex;flex-direction:column}
.drawer.on{right:0}
.dhd{padding:13px 15px;border-bottom:1px solid var(--bd);font-weight:700;display:flex;align-items:center;gap:8px}
.dhd .x{margin-left:auto;background:none;border:0;cursor:pointer;color:#8a95a1;display:flex}
.dbd{flex:1;overflow-y:auto}
.nitem{display:flex;gap:9px;padding:11px 15px;border-bottom:1px solid #f4f7fa;font-size:13px;align-items:flex-start}
.nitem.un{background:#f4f9ff}
.nitem .txt{flex:1;line-height:1.5}
.nitem .txt b{color:#2b3a49}
.nitem .t{font-size:11px;color:var(--mut);margin-top:2px}
.mask{position:fixed;inset:0;background:#0005;z-index:55;display:none}
.mask.on{display:block}
.empty{color:var(--mut);text-align:center;padding:36px 10px;font-size:13px}
.more{width:100%;padding:11px;background:#fff;border:1px solid var(--bd);border-radius:8px;color:var(--acc);cursor:pointer;margin-top:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:5px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:90}
.toast.show{opacity:.95}
.hide{display:none!important}
@media(max-width:820px){.col-side{display:none}.tnav a span{display:none}.tsearch input{width:90px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand" onclick="location.href='./'"><svg viewBox="0 0 32 32" width="21" height="21"><path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><rect x="8.5" y="11.6" width="15" height="2.6" rx="1.3" fill="#2b6cb0"/><rect x="8.5" y="16.6" width="10" height="2.6" rx="1.3" fill="#7fb3e8"/></svg><span>社区</span></div>
  <div class="tnav">
    <a href="./feed.html" class="on" id="navFeed"></a>
    <a href="./" id="navForum"></a>
    <a href="./chat.html" id="navChat"></a>
    <a href="./ai.html" id="navAi"></a>
  </div>
  <div class="tsearch" id="searchBox"></div>
  <div class="bell" id="bellBtn"></div>
  <div class="ava" id="topAva"></div>
</div></div>

<div class="wrap">
  <div class="col-main">
    <div class="card" id="composerCard">
      <div class="card-bd">
        <div class="composer">
          <div class="ava" id="myAva"></div>
          <textarea id="postInput" placeholder="分享点什么…（最多 1000 字）" maxlength="1000"></textarea>
        </div>
        <div class="previews" id="previews"></div>
        <div class="cbar">
          <button class="cbtn" id="imgBtn"></button>
          <input type="file" id="imgFile" accept="image/*" multiple class="hide">
          <span style="font-size:12px;color:var(--mut)" id="counter">0/1000</span>
          <button class="pub" id="pubBtn">发布</button>
        </div>
      </div>
    </div>
    <div id="feed"></div>
    <button class="more hide" id="moreBtn">加载更多</button>
  </div>

  <div class="col-side">
    <div class="card" id="meCard"></div>
    <div class="card">
      <div class="card-hd" id="sugHd">推荐关注</div>
      <div class="card-bd" id="sugBox"><div class="empty">加载中…</div></div>
    </div>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dhd" id="drawerHd"><span>通知</span><button class="x" id="drawerX"></button></div>
  <div class="dbd" id="notifBox"><div class="empty">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://jgwadmeqhzgzlkbbjcik.supabase.co/functions/v1/forum";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = () => localStorage.getItem('forum_token') || '';
let me = (()=>{ try{ return JSON.parse(localStorage.getItem('forum_user')||'null'); }catch(e){ return null; } })();
let page = 1, totalPages = 1, pendingImages = [], unread = 0;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
const relTime = t => {
  const d = Date.now() - new Date(t).getTime();
  if(d < 60000) return '刚刚';
  if(d < 3600000) return Math.floor(d/60000)+' 分钟前';
  if(d < 86400000) return Math.floor(d/3600000)+' 小时前';
  if(d < 2592000000) return Math.floor(d/86400000)+' 天前';
  return new Date(t).toLocaleDateString('zh-CN');
};

async function api(path, opts={}){
  const h = {};
  if(opts.body) h['Content-Type']='application/json';
  if(token()) h['Authorization']='Bearer '+token();
  const r = await fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(j.error||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}

// ---------- 顶栏 ----------
function paintTop(){
  $('navFeed').innerHTML = icon('home',{size:18})+'<span>动态</span>';
  $('navForum').innerHTML = icon('forum',{size:18})+'<span>论坛</span>';
  $('navChat').innerHTML = icon('chat',{size:18})+'<span>私信</span>';
  $('navAi').innerHTML = icon('spark',{size:18})+'<span>AI</span>';
  $('searchBox').innerHTML = icon('search',{size:16})+'<input id="searchInput" placeholder="搜索用户…">';
  $('searchInput').addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    const q = e.target.value.trim(); if(!q) return;
    location.href = './?q=' + encodeURIComponent(q);
  });
  $('topAva').innerHTML = me && me.avatar ? `<img src="${esc(me.avatar)}">` : (me ? esc(me.username.slice(0,1)) : icon('user',{size:16}));
  paintBell();
}
function paintBell(){
  $('bellBtn').innerHTML = icon('bell',{size:20}) + (unread>0?`<i class="dot">${unread>99?'99+':unread}</i>`:'');
}

// ---------- 侧栏资料 ----------
async function paintMe(){
  if(!me){ $('meCard').innerHTML = `<div class="card-bd empty">请先到 <a href="./" style="color:#2b6cb0">论坛登录</a></div>`; return; }
  let followers=0, following=0;
  try{ const p = await api('?action=profile&id='+me.id); followers=p.followers||0; following=p.following||0; }catch(e){}
  $('meCard').innerHTML = `
    <div class="me-hd">
      <div class="ava" style="width:62px;height:62px;font-size:22px">${me.avatar?`<img src="${esc(me.avatar)}">`:esc(me.username.slice(0,1))}</div>
      <div style="font-weight:700;font-size:15px">${esc(me.username)}</div>
      <div style="display:flex;gap:8px">
        <a class="fbtn" href="./?u=${encodeURIComponent(me.id)}" style="border-color:#dbe2ea;color:#5b6b7c">我的主页</a>
      </div>
    </div>
    <div class="stat">
      <div><b>${following}</b><span>关注</span></div>
      <div><b>${followers}</b><span>粉丝</span></div>
    </div>
    <div class="card-bd" style="padding-top:6px;display:flex;gap:8px">
      <a class="fbtn" style="flex:1;text-align:center" href="./ai.html">AI 小智</a>
      <a class="fbtn" style="flex:1;text-align:center" href="./chat.html">私信</a>
    </div>`;
}

// ---------- 发布 ----------
$('imgBtn').innerHTML = icon('image',{size:18});
$('imgBtn').onclick = ()=>{ if(!me) return toast('请先登录'); $('imgFile').click(); };
$('postInput').addEventListener('input', e=>{ $('counter').textContent = e.target.value.length + '/1000'; });
$('imgFile').onchange = async e=>{
  const files = [...e.target.files].slice(0, 4 - pendingImages.length);
  for(const f of files){
    if(f.size > 2*1024*1024){ toast('图片不能超过 2MB'); continue; }
    try{
      const fd = new FormData(); fd.append('file', f); fd.append('kind','moment');
      const r = await fetch(API, {method:'POST', headers:{'Authorization':'Bearer '+token()}, body:fd});
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'上传失败');
      pendingImages.push(j.url); paintPreviews();
    }catch(err){ toast(err.message); }
  }
  e.target.value='';
};
function paintPreviews(){
  $('previews').innerHTML = pendingImages.map((u,i)=>`<div class="rm"><img src="${esc(u)}"><b data-i="${i}">×</b></div>`).join('');
  $('previews').querySelectorAll('b').forEach(b=>b.onclick=()=>{ pendingImages.splice(+b.dataset.i,1); paintPreviews(); });
}
$('pubBtn').onclick = async ()=>{
  if(!me) return toast('请先登录');
  const v = $('postInput').value.trim();
  if(!v) return toast('说点什么吧');
  $('pubBtn').disabled = true; $('pubBtn').textContent = '发布中…';
  try{
    await api('',{method:'POST',body:{action:'create_moment', content:v, images:pendingImages}});
    $('postInput').value=''; pendingImages=[]; paintPreviews(); $('counter').textContent='0/1000';
    page=1; await loadFeed(true); toast('已发布');
  }catch(e){ toast(e.message); }
  finally{ $('pubBtn').disabled=false; $('pubBtn').textContent='发布'; }
};

// ---------- 关注流 ----------
async function loadFeed(reset){
  if(!me){ $('feed').innerHTML = `<div class="card"><div class="card-bd empty">登录后查看关注动态<br><br><a href="./" style="color:#2b6cb0">去登录</a></div></div>`; return; }
  if(reset){ page=1; $('feed').innerHTML='<div class="card"><div class="card-bd empty">加载中…</div></div>'; }
  try{
    const j = await api('?action=feed&page='+page);
    totalPages = j.pages || 1;
    const list = j.posts || [];
    const html = list.map(p=>postCard(p)).join('');
    if(reset) $('feed').innerHTML = html || `<div class="card"><div class="card-bd empty">还没有动态<br>关注一些人，或发布第一条</div></div>`;
    else $('feed').insertAdjacentHTML('beforeend', html);
    $('moreBtn').classList.toggle('hide', page >= totalPages);
    bindPosts();
  }catch(e){
    if(reset) $('feed').innerHTML = `<div class="card"><div class="card-bd empty">${esc(e.message)}</div></div>`;
  }
}
function postCard(p){
  const u = p.user || {username:p.author, avatar:null};
  const imgs = (p.images&&p.images.length) ? `<div class="pimgs">${p.images.map(src=>`<img src="${esc(src)}" loading="lazy">`).join('')}</div>` : '';
  return `<div class="post" data-id="${p.id}">
    <div class="ph">
      <a class="ava" href="./?u=${encodeURIComponent(p.user_id||'')}">${u.avatar?`<img src="${esc(u.avatar)}">`:esc((u.username||'?').slice(0,1))}</a>
      <div>
        <a class="pn" href="./?u=${encodeURIComponent(p.user_id||'')}">${esc(u.username||p.author)}</a>
        <div class="pt">${relTime(p.created_at)}${p.kind==='topic'?' · 来自论坛':''}</div>
      </div>
    </div>
    <div class="pb">${esc(p.body)}</div>
    ${imgs}
    <div class="pacts">
      <button class="like ${p.liked?'liked':''}" data-id="${p.id}">${icon('heart',{size:17,fill:!!p.liked})}<span>${p.likes||0}</span></button>
      <button data-goto="${p.id}">${icon('comment',{size:17})}<span>${p.reply_count||0}</span></button>
      <button data-share="${p.id}">${icon('repeat',{size:17})}</button>
    </div>
  </div>`;
}
function bindPosts(){
  document.querySelectorAll('.like').forEach(b=>b.onclick=async()=>{
    if(!me) return toast('请先登录');
    try{ const j = await api('',{method:'POST',body:{action:'like',post_id:b.dataset.id}});
      b.classList.toggle('liked', j.liked);
      b.innerHTML = icon('heart',{size:17,fill:j.liked}) + `<span>${j.likes}</span>`;
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ location.href='./#/t/'+b.dataset.goto; });
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    const url = location.origin + '/#/t/' + b.dataset.share;
    if(navigator.share) navigator.share({url}).catch(()=>{});
    else { navigator.clipboard.writeText(url).then(()=>toast('链接已复制')); }
  });
}
$('moreBtn').onclick = ()=>{ page++; loadFeed(false); };

// ---------- 推荐关注 ----------
async function loadSuggest(){
  if(!me) return;
  try{
    const j = await api('?action=suggest_users');
    const us = j.users||[];
    if(!us.length){ $('sugBox').innerHTML = '<div class="empty">暂时没有可推荐的人</div>'; return; }
    $('sugBox').innerHTML = us.map(u=>`
      <div class="sug">
        <div class="ava">${u.avatar?`<img src="${esc(u.avatar)}">`:esc(u.username.slice(0,1))}</div>
        <div class="nm"><div>${esc(u.username)}</div><span>${u.post_count||0} 条动态</span></div>
        <button class="fbtn" data-uid="${u.id}">关注</button>
      </div>`).join('');
    $('sugBox').querySelectorAll('[data-uid]').forEach(b=>b.onclick=async()=>{
      try{ await api('',{method:'POST',body:{action:'follow',user_id:b.dataset.uid,value:true}});
        b.textContent='已关注'; b.classList.add('on'); toast('已关注'); paintMe();
      }catch(e){ toast(e.message); }
    });
  }catch(e){ $('sugBox').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}

// ---------- 通知 ----------
$('drawerX').innerHTML = icon('close',{size:18});
async function loadNotifs(){
  if(!me) return;
  try{
    const j = await api('?action=notifications');
    unread = j.unread || 0; paintBell();
    const list = j.notifications||[];
    if(!list.length){ $('notifBox').innerHTML = '<div class="empty">暂无通知</div>'; return; }
    const label = {like:'赞了你的动态', reply:'回复了你', follow:'关注了你', mention:'在聊天中提到了你'};
    $('notifBox').innerHTML = list.map(n=>`
      <div class="nitem ${n.is_read?'':'un'}">
        <div class="ava">${esc((n.actor_name||'?').slice(0,1))}</div>
        <div class="txt"><b>${esc(n.actor_name||'某人')}</b> ${esc(label[n.type]||n.type)}
          ${n.preview?`<div style="color:#8a95a1;font-size:12px">${esc(n.preview)}</div>`:''}
          <div class="t">${relTime(n.created_at)}</div></div>
      </div>`).join('');
  }catch(e){ $('notifBox').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}
function openDrawer(){
  $('drawer').classList.add('on'); $('mask').classList.add('on');
  loadNotifs();
  if(unread>0 && me){ api('',{method:'POST',body:{action:'read_notifications'}}).then(()=>{ unread=0; paintBell(); }).catch(()=>{}); }
}
$('bellBtn').onclick = openDrawer;
$('mask').onclick = ()=>{ $('drawer').classList.remove('on'); $('mask').classList.remove('on'); };
$('drawerX').onclick = $('mask').onclick;

// 启动
paintTop(); paintMe(); loadFeed(true); loadSuggest(); loadNotifs();
setInterval(()=>{ if(me) loadNotifs(); }, 60000);
</script>
</body>
</html>
