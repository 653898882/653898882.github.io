<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>注册 · 人类不存在</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#1b2233,#0b0e14 60%); color:#e8eaed; min-height:100vh;}
  header{position:sticky; top:0; z-index:99; background:rgba(13,17,24,.92); backdrop-filter:blur(8px);
         border-bottom:1px solid #232a38; padding:14px 18px 12px;}
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  h1{font-size:15px; margin:0; letter-spacing:.5px; color:#cdd6e4; font-weight:600;}
  #levelNo{font-size:12px; color:#6f7c90; font-variant-numeric:tabular-nums;}
  .bar{height:6px; margin-top:10px; background:#212836; border-radius:99px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; border-radius:99px;
         background:linear-gradient(90deg,#4f8cff,#a05cff 60%,#ff5ca8); transition:width .25s ease;}
  main{padding:26px 18px 40px; max-width:760px; margin:0 auto; min-height:62vh;}
  .desc{color:#9aa6b8; font-size:15px; line-height:1.7; margin:0 0 22px;}
  .desc b{color:#e8eaed;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .center{justify-content:center;}
  .col{display:flex; flex-direction:column; gap:14px; align-items:flex-start;}
  .btn{background:#4f8cff; color:#fff; border:none; padding:12px 24px; border-radius:11px;
       font-size:16px; cursor:pointer; transition:background .15s, transform .05s; user-select:none;}
  .btn:hover{background:#6ba0ff;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#222a3a; color:#cdd6e4; border:1px solid #303a4d;}
  .btn.ghost:hover{background:#2b3548;}
  .btn.sm{padding:8px 14px; font-size:14px;}
  .note{color:#8b98ab; font-size:14px; line-height:1.6;}
  .warn{color:#ffb454;}
  .ok{color:#5cd08a;}
  .err{color:#ff6b6b;}
  input[type=text],input[type=password],input[type=number],select{
       padding:11px 13px; border-radius:9px; border:1px solid #2a3346; background:#141b28;
       color:#e8eaed; font-size:16px; outline:none; min-width:220px;}
  input:focus,select:focus{border-color:#4f8cff;}
  input[readonly]{opacity:.65; cursor:not-allowed;}
  .box{border:2px dashed #33405a; border-radius:14px; padding:20px; background:#101725;}
  .box.solid{border-style:solid;}
  .zone{width:180px; height:120px; border:2px dashed #4f8cff; border-radius:12px; position:relative;
        display:flex; align-items:center; justify-content:center; color:#4f8cff; font-size:13px;}
  .chip{position:absolute; width:74px; height:40px; border-radius:9px; background:#4f8cff; color:#fff;
        display:flex; align-items:center; justify-content:center; cursor:grab; user-select:none; font-size:14px;}
  .card{width:120px; height:120px; border-radius:14px; background:#1b2436; border:1px solid #2c3852;
        display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer;}
  .sw{width:66px; height:34px; border-radius:99px; background:#2a3346; position:relative; cursor:pointer; transition:background .2s;}
  .sw.on{background:#4f8cff;}
  .sw>i{position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; transition:left .2s;}
  .sw.on>i{left:35px;}
  .grid{display:grid; gap:8px;}
  footer{padding:22px 18px 40px; max-width:760px; margin:0 auto; color:#586274; font-size:12px; line-height:1.8;}
  footer a{color:#6f7c90; text-decoration:none; border-bottom:1px dotted #3a4456;}
  .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
         background:#1c2434; border:1px solid #2c3852; color:#e8eaed; padding:11px 18px; border-radius:11px;
         font-size:14px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:200; max-width:88vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-8px);}
  .glitch{animation:gl .12s infinite;}
  @keyframes gl{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(0,0)}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>安全注册 · Anti-Human Verification</h1>
    <span id="levelNo">第 1 关 / 共 85 关</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<main id="stage"></main>

<footer>
  本页面共 85 关，用于证明「人类无法完成注册」。<br>
  若你不小心通过了某一关，那一定是 bug，请勿声张。<br>
  <a href="#" id="restart">重新开始（你确定？）</a>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============================ 框架 ============================ */
const $ = s => document.querySelector(s);
const T = $('#toast');
let toastTimer = null;
function toast(msg, ms=1800){
  T.textContent = msg; T.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>T.classList.remove('show'), ms);
}

function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const B  = (t, fn, cls='btn') => h('button', {class: cls, onclick: fn || (()=>{})}, t);
const P  = (t, cls='note') => h('p', {class: cls}, t);
const Row= (...k) => h('div', {class:'row'}, k);
const Col= (...k) => h('div', {class:'col'}, k);
const Box= (...k) => h('div', {class:'box'}, k);

/* 事件登记（切关自动清理，避免上一关的定时器/监听器污染下一关） */
let disposers = [];
function on(t, ev, fn, o){ t.addEventListener(ev, fn, o); disposers.push(()=>t.removeEventListener(ev, fn, o)); }
function every(ms, fn){ const id = setInterval(fn, ms); disposers.push(()=>clearInterval(id)); return id; }
function after(ms, fn){ const id = setTimeout(fn, ms); disposers.push(()=>clearTimeout(id)); return id; }
function clearAll(){ for (const d of disposers){ try{ d(); }catch(e){} } disposers = []; }

/* ============================ 关卡数据 ============================ */
/* build(stage, next) —— 只有 next() 才能进入下一关。绝大多数关卡永远不调用它。 */

const LEVELS = [

/* 1 */ { desc:'请点击「继续」按钮，完成身份验证。',
  build(r,next){
    const wrap = flee(r);
    r.append(P('提示：这个按钮有点害羞。'));
  }},

/* 2 */ { desc:'点击「继续」，按钮每被鼠标靠近一次就缩小 12%。',
  build(r,next){
    let s = 1;
    const b = B('继续', ()=>toast('太小了，没点到。'));
    b.style.transition = 'transform .15s, opacity .15s';
    const wrap = h('div',{class:'row center'}, b);
    r.append(wrap);
    on(document,'mousemove', e=>{
      const q = b.getBoundingClientRect();
      const cx = q.left+q.width/2, cy = q.top+q.height/2;
      if (Math.hypot(e.clientX-cx, e.clientY-cy) < 130 && s > 0.12){
        s *= 0.88;
        b.style.transform = `scale(${s})`;
        b.style.opacity = Math.max(0.05, s);
        if (s <= 0.12) b.textContent = '·';
      }
    });
  }},

/* 3 */ { desc:'按钮每 0.4 秒随机传送一次，请抓住它。',
  build(r,next){
    const wrap = h('div',{class:'box', style:'height:320px; position:relative; overflow:hidden;'});
    const b = B('继续', ()=>{});
    b.style.position = 'absolute';
    wrap.append(b);
    const put = ()=>{
      const w = wrap.clientWidth, hh = wrap.clientHeight;
      b.style.left = Math.random()*(w-90)+'px';
      b.style.top  = Math.random()*(hh-60)+'px';
    };
    put(); every(400, put);
    r.append(wrap);
    r.append(P('如果它一直不跑，那只是它累了。'));
  }},

/* 4 */ { desc:'请依次选择「我是」「不是」「机器人」三个选项。',
  build(r,next){
    const words = ['我是','不是','机器人'];
    const order = [];
    const wrap = Row();
    const render = ()=>{
      wrap.innerHTML = '';
      const shuffled = words.slice().sort(()=>Math.random()-0.5);
      shuffled.forEach(w=>{
        wrap.append(B(w, ()=>{
          order.push(w);
          if (order.length === 3){
            if (order.join('') === '我是机器人'){ toast('判定：你在撒谎。'); }
            order.length = 0;
            toast('顺序错误，已重置。');
          }
          render();
        }, 'btn ghost'));
      });
    };
    render();
    r.append(wrap, P('提示：正确的顺序是「我是 不是 机器人」——但你永远按不出来。'));
  }},

/* 5 */ { desc:'勾选下方复选框表示你同意。',
  build(r,next){
    const cb = h('input', {type:'checkbox'});
    cb.style.width='22px'; cb.style.height='22px'; cb.style.minWidth='0';
    r.append(Row(cb, '我同意'));
    on(cb,'change',()=>{ if (cb.checked){ after(300, ()=>{ cb.checked = false; }); } });
  }},

/* 6 */ { desc:'请输入你的真实姓名（系统会自动纠正方向）。',
  build(r,next){
    const inp = h('input', {type:'text', placeholder:'在这里输入…'});
    r.append(inp);
    on(inp,'input',()=>{
      const p = inp.selectionStart;
      inp.value = inp.value.split('').reverse().join('');
      inp.setSelectionRange(Math.max(0,p), Math.max(0,p));
    });
  }},

/* 7 */ { desc:'请清空输入框，输入「通过」。',
  build(r,next){
    const inp = h('input', {type:'text', placeholder:'…'});
    r.append(inp);
    let busy = false;
    on(inp,'input',()=>{
      if (busy) return; busy = true;
      // 每输入一个字符，就删掉前面的字符 —— 永远留不住
      inp.value = '';
      busy = false;
    });
  }},

/* 8 */ { desc:'把滑块拖到最右边，证明你有手。',
  build(r,next){
    const s = h('input', {type:'range', min:0, max:100, value:0});
    s.style.width='320px'; s.style.minWidth='0';
    const v = P('当前：0');
    r.append(Col(s, v));
    on(s,'input',()=>{ v.textContent = '当前：' + s.value; });
    on(s,'change',()=>{ s.value = 0; v.textContent = '当前：0'; toast('手滑是人类的特征。'); });
    every(500, ()=>{ if (+s.value) { s.value = 0; v.textContent='当前：0（归零）'; } });
  }},

/* 9 */ { desc:'⚠ 请「不要」点击下方按钮。',
  build(r,next){
    const b = B('继续', ()=>toast('都说了不要点。'));
    r.append(Row(b), P('本关没有其他操作方式。祝你好运。'));
  }},

/* 10 */ { desc:'点击「继续」按钮进入下一步。',
  build(r,next){
    let n = 0;
    const b = B('继续', ()=>{ n++; b.textContent = '再点一次 (' + n + ' 次)'; });
    r.append(Row(b));
  }},

/* 11 */ { desc:'按住按钮「恰好 3.000 秒」后松开。误差超过 1 毫秒即失败。',
  build(r,next){
    const st = P('（等待按下…）');
    const b = B('按住我', ()=>{});
    let t0 = 0, down = false;
    on(b,'pointerdown',()=>{ t0 = performance.now(); down = true; st.textContent='计时中…'; st.className='note warn'; });
    on(b,'pointerup',()=>{
      if(!down) return; down = false;
      const d = performance.now() - t0;
      st.className = 'note err';
      st.textContent = '用时 ' + d.toFixed(3) + ' 秒，偏差 ' + Math.abs(d-3000).toFixed(3) + ' 秒 → 失败。';
    });
    on(window,'pointerup',()=>{ if(down){ down=false; st.className='note err'; st.textContent='松手位置不对 → 失败。'; } });
    r.append(Col(Row(b), st));
  }},

/* 12 */ { desc:'按住按钮 30 秒，期间鼠标不得有任何移动或抖动。',
  build(r,next){
    let t = 0, held = false;
    const st = P('进度：0 / 30 秒');
    const b = B('按住保持不动', ()=>{});
    let tick = null;
    const start = ()=>{
      held = true; t = 0; st.className='note warn';
      tick = every(100, ()=>{ t += 0.1; st.textContent = '进度：' + t.toFixed(1) + ' / 30 秒'; });
    };
    const stop = (why)=>{ if(!held) return; held=false; if(tick) clearInterval(tick); st.className='note err'; st.textContent = '失败：' + why; };
    on(b,'pointerdown', start);
    on(b,'pointerup', ()=>stop('你松手了'));
    on(document,'pointermove', ()=>{ if(held) stop('鼠标动了'); });
    r.append(Col(Row(b), st), P('放心，你手一定会抖。'));
  }},

/* 13 */ { desc:'按下【空格键】继续。',
  build(r,next){
    r.append(P('（系统已禁用空格键）'));
    on(window,'keydown', e=>{
      if (e.code === 'Space'){ e.preventDefault(); toast('空格：已被禁用。'); }
    });
  }},

/* 14 */ { desc:'在输入框输入任意内容，然后按【回车】提交。',
  build(r,next){
    const inp = h('input', {type:'text', placeholder:'输入点什么…'});
    r.append(inp);
    on(inp,'keydown', e=>{ if (e.key === 'Enter'){ inp.value=''; toast('回车：已清空，请重来。'); } });
  }},

/* 15 */ { desc:'等待进度条加载完成即可继续。',
  build(r,next){
    const i = h('i', {style:'display:block;height:100%;width:0;background:#4f8cff;border-radius:99px;transition:width .5s;'});
    const bar = h('div', {style:'height:10px;width:320px;background:#212836;border-radius:99px;overflow:hidden;'}, i);
    const st = P('0%');
    r.append(Col(bar, st));
    let v = 0;
    every(120, ()=>{
      v = Math.min(99, v + Math.random()*7);
      i.style.width = v + '%'; st.textContent = Math.floor(v) + '%';
      if (v >= 99){ v = 0; i.style.width='0%'; st.textContent='0%（重置）'; toast('加载失败，请重试。'); }
    });
  }},

/* 16 */ { desc:'倒计时结束后自动进入下一步，请耐心等待。',
  build(r,next){
    let n = -1;
    const st = h('div', {style:'font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;color:#4f8cff;'}, '-1');
    r.append(Col(st, P('倒计时：')));
    every(1000, ()=>{ n--; st.textContent = n; st.style.color = n < -50 ? '#ff6b6b' : '#4f8cff'; });
  }},

/* 17 */ { desc:'不想注册？点击「跳过」直接进入下一步。',
  build(r,next){
    r.append(Row(B('跳过', ()=>{ toast('已跳过。'); go(0); }, 'btn ghost')));
  }},

/* 18 */ { desc:'请同时勾选 A 和 B 两个选项。',
  build(r,next){
    const a = h('input', {type:'checkbox', style:'width:22px;height:22px;min-width:0;'});
    const b = h('input', {type:'checkbox', style:'width:22px;height:22px;min-width:0;'});
    r.append(Row(a,'A 选项'), Row(b,'B 选项'));
    on(a,'change',()=>{ if(a.checked){ b.checked = false; toast('B 已自动取消。'); } });
    on(b,'change',()=>{ if(b.checked){ a.checked = false; toast('A 已自动取消。'); } });
  }},

/* 19 */ { desc:'把方块拖进虚线框内。',
  build(r,next){
    const box = h('div',{class:'box', style:'height:300px; position:relative;'});
    const zone = h('div',{class:'zone', style:'position:absolute; top:20px; left:20px;'}, '目标区域');
    const chip = h('div',{class:'chip', style:'left:20px; top:200px;'}, '拖我');
    box.append(zone, chip);
    r.append(box);
    let drag = false, ox=0, oy=0;
    on(chip,'pointerdown', e=>{ drag=true; const q=chip.getBoundingClientRect(); ox=e.clientX-q.left; oy=e.clientY-q.top; chip.setPointerCapture(e.pointerId); });
    on(document,'pointermove', e=>{
      if(!drag) return;
      const bq = box.getBoundingClientRect();
      chip.style.left = (e.clientX - bq.left - ox) + 'px';
      chip.style.top  = (e.clientY - bq.top  - oy) + 'px';
      // 目标区域会躲开你
      const zq = zone.getBoundingClientRect(), cq = chip.getBoundingClientRect();
      const dx = (zq.left+zq.width/2) - (cq.left+cq.width/2);
      const dy = (zq.top+zq.height/2) - (cq.top+cq.height/2);
      if (Math.hypot(dx,dy) < 150){
        zone.style.left = Math.min(box.clientWidth-190, Math.max(10, zq.left - bq.left - dx/2 + (Math.random()*80-40))) + 'px';
        zone.style.top  = Math.min(box.clientHeight-140, Math.max(10, zq.top  - bq.top  - dy/2 + (Math.random()*80-40))) + 'px';
      }
    });
    on(document,'pointerup', ()=>{ drag=false; });
  }},

/* 20 */ { desc:'把滑块拖到 100。',
  build(r,next){
    const s = h('input',{type:'range', min:0, max:99, value:0, style:'width:320px;min-width:0;'});
    const v = P('目标：100 ｜ 当前：0 ｜ 最大值：99');
    r.append(Col(s, v));
    on(s,'input',()=>{ v.textContent = '目标：100 ｜ 当前：' + s.value + ' ｜ 最大值：99'; });
  }},

/* 21 */ { desc:'请在下方输入框输入「人类」。',
  build(r,next){
    const inp = h('input',{type:'text', placeholder:'在此输入「人类」', readonly:''});
    r.append(inp, P('（输入框已锁定，理由：防止机器人输入）'));
  }},

/* 22 */ { desc:'请按正确顺序点击下列词语：我 → 是 → 人 → 类。',
  build(r,next){
    const words = ['我','是','人','类'];
    const target = ['我','是','人','类'];
    let step = 0;
    const wrap = Row();
    const render = ()=>{
      wrap.innerHTML = '';
      words.slice().sort(()=>Math.random()-0.5).forEach(w=>{
        wrap.append(B(w, ()=>{
          if (w === target[step]) step++;
          else step = 0;
          toast(step===4 ? '等等，好像对了一次…' : '重新开始。');
          if (step===4) step = 0;
          render();
        }, 'btn ghost'));
      });
    };
    render();
    r.append(wrap, P('每点一次，所有词语会重新洗牌。'));
  }},

/* 23 */ { desc:'请精确输入圆周率 π 的完整小数位（不得省略）。',
  build(r,next){
    const inp = h('input',{type:'text', placeholder:'3.14159265358979…'});
    r.append(Col(inp, B('校验', ()=>toast('位数不足，且它本来就是无限的。'))));
  }},

/* 24 */ { desc:'安全验证题：1 + 1 = ?',
  build(r,next){
    r.append(Row(
      B('1', ()=>toast('错。')),
      B('3', ()=>toast('错。')),
      B('11', ()=>toast('错。')),
      B('∞', ()=>toast('错。'))
    ), P('（本题已屏蔽正确答案）'));
  }},

/* 25 */ { desc:'请把拼图补齐。',
  build(r,next){
    const g = h('div',{class:'grid', style:'grid-template-columns:repeat(3,64px);width:max-content;'});
    for (let i=0;i<9;i++){
      const filled = i !== 4;
      g.append(h('div',{style:`width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #2c3852;background:${filled?'#1b2436':'#0b0e14'};color:${filled?'#5cd08a':'#3a4456'};`}, filled ? '🧩' : '？'));
    }
    r.append(Col(g, P('缺失的那一块已在数据库中损坏，无法提供。')));
  }},

/* 26 */ { desc:'翻开卡片，找出匹配的图案。',
  build(r,next){
    const c = h('div',{class:'card'}, '？');
    let flips = 0;
    on(c,'click',()=>{ flips++; c.textContent = '？'; toast('翻开第 '+flips+' 次，还是背面。'); });
    r.append(Col(c, P('牌堆里只有这一张牌，且它两面都是背面。')));
  }},

/* 27 */ { desc:'转动幸运转盘，转到「通过」即可晋级。',
  build(r,next){
    const st = h('div',{style:'font-size:18px;padding:26px;border-radius:14px;background:#141b28;border:1px solid #2c3852;min-width:220px;text-align:center;'}, '🎡 请转动');
    r.append(Col(st, B('转动', ()=>{

/* ============================ 引擎 ============================ */
let idx = 0;
function go(n){
  clearAll();
  document.body.classList.remove('glitch');
  idx = Math.max(0, Math.min(LEVELS.length - 1, n));
  render();
}
function render(){
  const lv = LEVELS[idx];
  $('#levelNo').textContent = `第 ${idx+1} 关 / 共 ${LEVELS.length} 关`;
  $('#bar').style.width = (idx / LEVELS.length * 100).toFixed(2) + '%';
  const stage = $('#stage');
  stage.innerHTML = '';
  stage.append(h('p', {class:'desc', html: lv.desc || ''}));
  const next = ()=>go(idx+1);
  try { lv.build(stage, next); }
  catch (e){ stage.append(P('本关出现未定义错误。这也在预期之内。')); }
  window.scrollTo(0,0);
}

/* 「逃跑按钮」通用实现 */
function flee(r, speed=200){
  const b = B('继续', ()=>{});
  b.style.position = 'relative';
  b.style.transition = 'transform .1s';
  const wrap = h('div',{class:'box', style:'height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;'}, b);
  on(window,'mousemove', e=>{
    const q = b.getBoundingClientRect();
    const cx = q.left+q.width/2, cy = q.top+q.height/2;
    const d = Math.hypot(e.clientX-cx, e.clientY-cy);
    if (d < 150){
      const a = Math.atan2(cy-e.clientY, cx-e.clientX) + (Math.random()-0.5);
      b.style.transform = `translate(${Math.cos(a)*speed}px, ${Math.sin(a)*speed}px)`;
    }
  });
  r.append(wrap);
  return wrap;
}


/* ======== 作弊模式（后加） ======== */
(function(){
  const st = document.createElement('style');
  st.textContent =
    "#cheatBtn{position:fixed;right:16px;bottom:16px;z-index:300;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#a05cff);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(79,140,255,.45);}"
  + "#cheatPanel{position:fixed;right:16px;bottom:82px;z-index:301;width:min(340px,88vw);background:#141b28;border:1px solid #2c3852;border-radius:14px;padding:14px;display:none;box-shadow:0 14px 44px rgba(0,0,0,.65);}"
  + "#cheatPanel.show{display:block;} #cheatPanel h3{margin:0 0 12px;font-size:14px;color:#cdd6e4;}"
  + "#cheatPanel .crow{display:flex;gap:8px;margin-bottom:8px;}"
  + "#cheatPanel .cbtn{flex:1;background:#222a3a;color:#cdd6e4;border:1px solid #303a4d;border-radius:9px;padding:10px 12px;font-size:13px;cursor:pointer;}"
  + "#cheatPanel .cbtn.main{background:#4f8cff;color:#fff;border-color:#4f8cff;}"
  + "#cheatPanel input{background:#0f1420;border:1px solid #303a4d;color:#e8eaed;border-radius:9px;padding:9px;font-size:13px;width:86px;flex:none;}"
  + "#cheatMsg{font-size:12px;color:#8b98ab;margin:8px 0 0;line-height:1.6;}"
  + "#winOverlay{position:fixed;inset:0;z-index:400;background:rgba(5,8,14,.82);display:flex;align-items:center;justify-content:center;padding:24px;}"
  + "#winBox{background:#161d2b;border:1px solid #2c3852;border-radius:18px;padding:28px;max-width:420px;text-align:center;}"
  + "#winBox h2{margin:0 0 12px;font-size:22px;color:#e8eaed;} #winBox p{color:#9aa6b8;font-size:14px;line-height:1.7;margin:6px 0;}"
  + "#winBox button{background:#4f8cff;color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:14px;cursor:pointer;margin-top:14px;}";
  document.head.append(st);

  const btn = document.createElement('button');
  btn.id = 'cheatBtn'; btn.textContent = '🔓'; btn.title = '作弊模式';
  const panel = document.createElement('div');
  panel.id = 'cheatPanel';
  panel.innerHTML =
    '<h3>🔓 作弊模式（本页面本该无法通过）</h3>'
  + '<div class="crow"><button class="cbtn" id="cPrev">◀ 上一关</button><button class="cbtn main" id="cNext">下一关 ▶</button></div>'
  + '<div class="crow"><input type="number" id="cJump" min="1" max="85" value="1"><button class="cbtn" id="cGo">跳到该关</button></div>'
  + '<div class="crow"><button class="cbtn main" id="cAuto">⏭ 一键通关（自动跑完 85 关）</button></div>'
  + '<div class="crow"><button class="cbtn" id="cHint">💡 本关为什么过不去</button></div>'
  + '<p id="cheatMsg"></p>';
  document.body.append(btn, panel);

  const q = s => panel.querySelector(s);
  const msg = t => { q('#cheatMsg').textContent = t; };
  let autoId = null;

  btn.onclick = () => { panel.classList.toggle('show'); q('#cJump').value = idx + 1; };
  q('#cPrev').onclick = () => go(idx - 1);
  q('#cNext').onclick = () => go(idx + 1);
  q('#cGo').onclick = () => { const n = parseInt(q('#cJump').value, 10); if (!isNaN(n)) go(n - 1); };

  function win(){
    const w = document.createElement('div');
    w.id = 'winOverlay';
    w.innerHTML = '<div id="winBox"><h2>🎉 全部通关！</h2>'
      + '<p>你借助作弊模式走完了 85 关。</p>'
      + '<p>但凭人类自己，是过不去的 —— 这正是本页面的设计目的。</p>'
      + '<button id="winClose">关闭</button></div>';
    document.body.append(w);
    w.querySelector('#winClose').onclick = () => w.remove();
  }

  q('#cAuto').onclick = () => {
    if (autoId){ clearInterval(autoId); autoId = null; q('#cAuto').textContent = '⏭ 一键通关（自动跑完 85 关）'; return; }
    if (idx !== 0) go(0);
    q('#cAuto').textContent = '⏹ 停止';
    autoId = setInterval(() => {
      if (idx >= LEVELS.length - 1){
        clearInterval(autoId); autoId = null;
        q('#cAuto').textContent = '⏭ 一键通关（自动跑完 85 关）';
        setTimeout(win, 250);
        return;
      }
      go(idx + 1);
    }, 150);
  };

  q('#cHint').onclick = () => {
    const lv = LEVELS[idx];
    const t = (lv && lv.desc) ? lv.desc.replace(/<[^>]+>/g, '') : '';
    msg('第 ' + (idx + 1) + ' 关：' + t + ' —— 本关为「不可通过」设计，没有正解，点「下一关 ▶」即可。');
  };

  document.addEventListener('keydown', e => {
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT')) return;
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft')  go(idx - 1);
  });
})();

/* 启动 */
$('#restart').addEventListener('click', e=>{ e.preventDefault(); toast('你真的确定？'); go(0); });
